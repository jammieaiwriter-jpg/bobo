<html lang="zh-Hant">
<head>

  <style>
    :root { --ink:#17212b; --muted:#637083; --line:#d9e1ea; --bg:#f5f7fa; --paper:#fff; --blue:#2563eb; --green:#0f8f68; --red:#d84a3a; --amber:#a66321; --shadow:0 10px 24px rgba(23,33,43,.08); }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif; background:var(--bg); color:var(--ink); }
    header { background:#fff; border-bottom:1px solid var(--line); }
    .wrap { width:min(1160px, calc(100% - 32px)); margin:0 auto; }
    .top { min-height:116px; display:grid; grid-template-columns:1fr auto; gap:20px; align-items:center; padding:24px 0; }
    h1 { margin:0 0 8px; font-size:clamp(28px,4vw,42px); line-height:1.12; letter-spacing:0; }
    .subtitle { margin:0; color:var(--muted); line-height:1.6; }
    .mark { width:112px; height:112px; border-radius:50%; border:1px solid var(--line); background:conic-gradient(from 30deg, #2563eb 0 28%, #0f8f68 28% 54%, #a66321 54% 78%, #d84a3a 78%); box-shadow:var(--shadow); display:grid; place-items:center; color:#fff; font-weight:900; }
    .toolbar, .unitbar, .runbar { display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between; align-items:center; padding:16px 0; }
    .runbar, .unitbar { padding-top:0; justify-content:flex-start; }
    .runstatus { font-weight:800; color:var(--blue); padding:8px 0; }
    .group { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    button { min-height:38px; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:8px; padding:8px 12px; font-size:15px; cursor:pointer; }
    button:hover { border-color:#9aacbf; }
    button.active { border-color:var(--blue); background:#eaf1ff; color:#1747b8; font-weight:800; }
    button.primary { background:var(--ink); color:#fff; border-color:var(--ink); }
    button:disabled { opacity:.48; cursor:not-allowed; }
    main { padding:20px 0 48px; }
    .stats { display:grid; grid-template-columns:repeat(4,minmax(92px,1fr)); gap:10px; margin-bottom:14px; }
    .stat { background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px; min-height:70px; }
    .stat b { display:block; font-size:24px; margin-bottom:4px; }
    .stat span { color:var(--muted); font-size:13px; }
    .progress { display:grid; gap:8px; color:var(--muted); font-size:14px; margin-bottom:18px; }
    .bar { height:10px; border-radius:99px; background:#e7edf5; overflow:hidden; }
    .bar span { display:block; width:0; height:100%; background:linear-gradient(90deg,var(--green),var(--blue)); }
    .activity { display:none; margin:0 0 14px; padding:10px 12px; border:1px solid #b9d7ff; border-radius:8px; background:#f2f7ff; color:#1747b8; font-weight:800; line-height:1.55; }
    .activity.show { display:block; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .q { background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow); display:grid; grid-template-rows:auto 1fr auto auto; min-height:330px; overflow:hidden; }
    .qhead { display:flex; justify-content:space-between; gap:10px; padding:14px 14px 0; }
    .badge { display:inline-flex; align-items:center; border-radius:99px; padding:4px 10px; min-height:28px; font-weight:800; font-size:13px; background:#eef2f7; color:#334155; }
    .basic { background:#e8f7f1; color:#087855; }
    .challenge { background:#fff1e8; color:#a63d2a; }
    .retry { background:#fff8e8; color:#8a5a00; }
    .done { background:#e8f7f1; color:#087855; border-color:#9bd9c2; }
    .qnum { color:var(--muted); font-weight:800; text-align:right; }
    .body { padding:12px 14px 14px; }
    .unit { margin:0 0 8px; color:var(--blue); font-weight:800; font-size:14px; }
    .prompt { margin:0 0 14px; line-height:1.65; font-size:17px; }
    .options { display:grid; gap:8px; }
    label.option { display:grid; grid-template-columns:auto 1fr; gap:8px; align-items:start; border:1px solid #d9e1ea; border-radius:8px; padding:9px 10px; cursor:pointer; background:#fbfcfe; }
    label.option:hover { border-color:#9aacbf; }
    input[type=radio] { margin-top:4px; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:0 14px 14px; }
    .result { min-height:22px; font-size:14px; font-weight:800; }
    .ok { color:var(--green); }
    .no { color:var(--red); }
    .hint-panel { display:none; margin:0 14px 14px; padding:10px 12px; border:1px solid #f0d59f; border-radius:8px; background:#fff8e8; color:#704f12; line-height:1.65; }
    .hint-panel.show { display:block; }
    details { border-top:1px solid var(--line); background:#fbfcfe; padding:10px 14px 14px; line-height:1.65; }
    summary { cursor:pointer; font-weight:800; }
    .solution { margin-top:8px; white-space:pre-wrap; }
    .trap { color:var(--muted); margin-top:6px; }
    .report { display:none; white-space:pre-wrap; margin:18px 0 0; padding:14px; line-height:1.65; border:1px solid var(--line); border-radius:8px; background:#fff; }
    .report.show { display:block; }
    .note { color:var(--muted); line-height:1.6; font-size:13px; padding-top:18px; }
    @media (max-width:760px){ .top,.stats,.grid{grid-template-columns:1fr}.mark{width:92px;height:92px}.toolbar{align-items:stretch}.group{width:100%}button{flex:1 1 auto}.runbar button{flex:0 0 auto} }
    @media print { button,.toolbar,.unitbar,.runbar,.stats,.progress,details,.report,.activity{display:none}.grid{grid-template-columns:1fr}.q{box-shadow:none;break-inside:avoid;min-height:170px} }

    function renderQuestions(){ const items=activeItems(); grid.innerHTML = items.length ? "" : '<article class="q"><div class="body"><p class="prompt">目前沒有再練項目。</p></div></article>'; items.forEach((q,idx) => { const st=itemState(q); const article=document.createElement("article"); article.className="q"; article.dataset.id=q.id; const optionName = "opt-" + itemKey(q).replace(/[^a-zA-Z0-9_-]/g, "_"); article.innerHTML = '<div class="qhead"><span class="badge ' + q.level + '">' + label(q.level) + '</span><span class="qnum">' + run().label + " · " + (idx+1) + (q.retryStage ? " · " + (q.retryStage==="original"?"原錯題":q.retryStage==="variant1"?"補洞1":"補洞2") : "") + '</span></div>' + '<div class="body"><p class="unit">' + escapeHtml(q.unit || "") + '</p><p class="prompt">' + escapeHtml(q.prompt) + '</p><div class="options">' + q.options.map((opt,i)=>'<label class="option"><input type="radio" name="' + optionName + '" value="' + escapeHtml(opt) + '"' + (st.value===opt?' checked':'') + '><span>' + String.fromCharCode(65+i) + '. ' + escapeHtml(opt) + '</span></label>').join("") + '</div></div>' + '<div class="actions"><button data-action="check">檢查</button>' + (q.retryStage ? "" : '<button data-action="hint">提示</button><button data-action="show">看答案</button>') + '<span class="result"></span></div>' + '<div class="hint-panel">提示：' + escapeHtml(hintFor(q)) + '</div>' + '<details><summary>詳解 / 看完整解法</summary><div class="solution">' + escapeHtml(solutionFor(q)) + '</div><div class="trap">容易錯的地方：' + escapeHtml(q.trap || "") + '</div></details>'; const result=article.querySelector(".result"); const details=article.querySelector("details"); const hintPanel=article.querySelector(".hint-panel"); if(st.checked) mark(article,st); if(st.hinted && hintPanel) hintPanel.classList.add("show"); article.querySelectorAll('input[type=radio]').forEach(input => input.addEventListener("change", () => { const current=itemState(q); const next={...current, value:input.value, checked:false, correct:false}; setItemState(q,next); result.textContent=""; result.className="result"; updateStats(); })); article.querySelector('[data-action="check"]').addEventListener("click", () => { const selected=article.querySelector('input[type=radio]:checked'); const value=selected ? selected.value : ""; const current=itemState(q); const correct=ok(q,value); const next={...current, value, checked:true, correct}; if(!correct){ next.tainted=true; next.retryReason=next.retryReason || "答錯"; } setItemState(q,next); recordActivity(correct ? "檢查答案：答對" : "檢查答案：答錯", q); mark(article,next); updateStats(); renderRunTabs(); }); details.addEventListener("toggle", () => { if(!details.open) return; const current=itemState(q); if(current.shown) return; const next={...current, shown:true, hinted:true, tainted:true, retryReason:current.retryReason || "看詳解/答案", checked:current.checked || false, correct:current.correct || false}; setItemState(q,next); recordActivity("打開詳解", q); mark(article,next); updateStats(); renderRunTabs(); }); const hintBtn=article.querySelector('[data-action="hint"]'); if(hintBtn) hintBtn.addEventListener("click", () => { const next={...itemState(q), hinted:true, tainted:true, retryReason:itemState(q).retryReason || "看提示"}; setItemState(q,next); recordActivity("看提示", q); hintPanel.classList.add("show"); result.textContent="看過提示，這題會進再練。"; result.className="result no"; updateStats(); renderRunTabs(); }); const showBtn=article.querySelector('[data-action="show"]'); if(showBtn) showBtn.addEventListener("click", () => { const target=[...article.querySelectorAll('input[type=radio]')].find(input => input.value === q.answer); if(target) target.checked=true; const next={...itemState(q), value:q.answer, checked:true, correct:false, shown:true, hinted:true, tainted:true, retryReason:itemState(q).retryReason || "看答案"}; setItemState(q,next); recordActivity("看答案", q); details.open=true; mark(article,next); updateStats(); renderRunTabs(); }); grid.appendChild(article); }); }
    function mark(article, st){ const el=article.querySelector(".result"); if(st.tainted || st.shown || st.hinted){ el.textContent=retryReasonFor(st) + "，這題會進再練。"; el.className="result no"; return; } el.textContent=st.correct ? "答對" : "再想想，答案不會直接顯示；需要時可看詳解。"; el.className="result " + (st.correct ? "ok" : "no"); }
    function updateStats(){ const s=runStats(activeRunId); document.getElementById("doneCount").textContent=s.done; document.getElementById("correctCount").textContent=s.clean; document.getElementById("retryCount").textContent=s.retry; document.getElementById("totalCount").textContent=s.total; document.getElementById("progressText").textContent=run().label + "：精熟 " + s.clean + " / " + s.total + "，再練 " + s.retry + " 題"; document.getElementById("progressBar").style.width=Math.round(s.clean/s.total*100) + "%"; updateActivityNotice(); }
    document.getElementById("prevRun").addEventListener("click", () => { const idx=runIndex(); if(idx>0) switchRun(BANK.runs[idx-1].run_id); });
    document.getElementById("nextRun").addEventListener("click", () => { const idx=runIndex(); if(idx<BANK.runs.length-1) switchRun(BANK.runs[idx+1].run_id); });
    document.getElementById("retryMode").addEventListener("click", () => { filter = filter === "retry" ? "all" : "retry"; reportBox.classList.remove("show"); renderAll(true); });
    document.getElementById("checkAll").addEventListener("click", () => document.querySelectorAll(".q[data-id]").forEach(card => card.querySelector('[data-action="check"]')?.click()));
    document.getElementById("resetRun").addEventListener("click", () => { if(!confirm("確定清除本回填寫內容嗎？看過提示、詳解或答錯的紀錄會保留，不能用重來躲過再練。")) return; Object.keys(state).filter(k => k.startsWith(activeRunId + ":")).forEach(k => { const item=state[k]; const isRetryDetail=k.split(":").length > 2; if(isRetryDetail){ delete state[k]; return; } if(item && (item.tainted || item.hinted || item.shown || item.retryReason)){ state[k]={tainted:true, hinted:!!item.hinted, shown:!!item.shown, retryReason:item.retryReason || retryReasonFor(item)}; } else { delete state[k]; } }); saveState(); reportBox.classList.remove("show"); renderAll(); });
    document.getElementById("printPage").addEventListener("click", () => window.print());
    document.getElementById("reportBtn").addEventListener("click", () => { recordActivity("產生回報文字", null); reportBox.textContent=buildReport(); reportBox.classList.toggle("show"); });
    function buildReport(){ const s=runStats(activeRunId); const remaining=BANK.runs.filter(r => !runComplete(r.run_id)).length; const activity=activityStatsForToday(); const last=activity.items[activity.items.length - 1]; const lines=["Bobo 社會畢業考練習回報", "回合：" + run().label + " / 共 " + BANK.run_count + " 回", "時間：" + new Date().toLocaleString("zh-TW"), "本回精熟：" + s.clean + "/" + s.total + "，再練：" + s.retry + "，未完成回數：" + remaining, "", "今日通知紀錄：", activity.items.length ? "Bobo 今天有反應。最後動作：" + last.run + "｜" + last.action + "｜" + last.time : "今天尚未留下互動紀錄。", "今日答錯：" + activity.wrong + "，看提示：" + activity.hint + "，看答案/詳解：" + activity.shown, ""]; [...new Set(questions().map(q=>q.unit))].forEach(unit => { const qs=questions().filter(q=>q.unit===unit); const clean=qs.filter(q => { const st=get(q.id); return st.checked && st.correct && !st.hinted && !st.shown && !st.tainted; }).length; const retry=qs.filter(q=>isRetryItem(q)).length; lines.push(unit + "：精熟 " + clean + "/" + qs.length + "，再練 " + retry); }); const retryItems=questions().filter(q=>isRetryItem(q)).map(q => { const st=get(q.id); return "- " + q.unit + "｜" + retryReasonFor(st) + "｜" + q.prompt; }); lines.push("", "待補洞：", retryItems.join("\n") || "目前沒有待補洞題。", "", "再練規則：每題會安排原錯題 + 補洞題 1 + 補洞題 2。"); return lines.join("\n"); }
    renderAll();
  </script>
