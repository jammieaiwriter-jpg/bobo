    .challenge { background:#fff1e8; color:#a63d2a; }

  <script>
    const BANK = {"project":"bobo-science-graduation-20260528","scope":"自然第 3 單元：生物生長的環境、人類活動對環境的影響、珍惜自然資源","generated_at":"2026-05-24","policy":"pre_generated_verified_only","run_count":12,"high_confidence_runs":8,"verified_variation_runs":4,"questions_per_run":24,"retry_variants_per_question":2,"source_basis":["03_alignment/00-source-inventory.json","03_alignment/01-curriculum-scope.md","03_alignment/01-alignment-table.json","03_alignment/03-question-type-matrix.json","03_alignment/04-allocation-plan.json","03_alignment/05-run-capacity-estimate.md"],"runs":[{"run_id":"run01","label":"第 1 回","confidence_band":"high_confidence","questions":[{"id":"s01-b01","level":"basic","unit":"3-1 生物生長的環境","question_type_id":"environment-feature","prompt":"哪一種環境通常具有「日夜溫差大、降雨少，植物常有儲水或減少水分散失的構造」的特徵？請填：沙漠、草原、熱帶雨林、極地、河口溼地或高山。","answer":["沙漠"],"solution":"沙漠的典型線索是日夜溫差大、降雨少，植物常有儲水或減少水分散失的構造，常見例子有駱駝、跳鼠。","trap":"不要看到動物活動就選草原；少雨和溫差大才是沙漠線索。","hint":"先抓環境壓力，再選環境名稱。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07","A05"],"retry_variants":[{"id":"s01-b01-r1","variant_role":"same_type_new_context","prompt":"看到「終年寒冷、冰雪覆蓋，生物常有厚皮毛或脂肪保暖」，最可能是哪一種環境？","answer":["極地"],"solution":"極地的線索是終年寒冷、冰雪覆蓋，生物常有厚皮毛或脂肪保暖。","verified":true},{"id":"s01-b01-r2","variant_role":"same_concept_different_ask_direction","prompt":"沙漠常見的生物例子包含「駱駝、跳鼠」嗎？請填：是或否。","answer":["是"],"solution":"駱駝、跳鼠可作為沙漠的代表例子。","verified":true}]},{"id":"s01-b02","level":"basic","unit":"3-1 生物生長的環境","question_type_id":"adaptation-reason","prompt":"仙人掌的「肥厚的莖」主要能幫助它適應什麼？","answer":["儲存水分"],"solution":"仙人掌面對缺水的環境壓力，肥厚的莖可以儲存水分。","trap":"同一種生物可能有多種構造，答題時要看清楚題目問哪一個構造。","hint":"先圈出構造，再想它解決哪個環境壓力。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07","A05"],"retry_variants":[{"id":"s01-b02-r1","variant_role":"same_type_new_context","prompt":"仙人掌的「葉變成刺」主要功能是什麼？","answer":["減少水分散失","水分散失"],"solution":"葉變成刺可幫助仙人掌適應缺水。","verified":true},{"id":"s01-b02-r2","variant_role":"same_concept_different_ask_direction","prompt":"北極熊主要面對的環境壓力是什麼？","answer":["寒冷"],"solution":"北極熊的構造和寒冷有關。","verified":true}]},{"id":"s01-b03","level":"basic","unit":"3-1 生物生長的環境","question_type_id":"species-habitat","prompt":"臺灣藍鵲最適合和哪一種環境或分類配對？請填：森林、外來入侵種或沙漠。","answer":["森林"],"solution":"臺灣藍鵲是特有種，適合配到森林。","trap":"不要只憑名字猜，要把生物和棲地特徵配起來。","hint":"看到臺灣生物，先想牠是高山、溪流、河口、海洋或森林。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P08"],"retry_variants":[{"id":"s01-b03-r1","variant_role":"same_type_new_context","prompt":"玉山杜鵑較適合和哪一種環境配對？","answer":["高山"],"solution":"玉山杜鵑常和高山連在一起考。","verified":true},{"id":"s01-b03-r2","variant_role":"same_concept_different_ask_direction","prompt":"臺灣藍鵲比較接近「特有種」還是「外來入侵種」？","answer":["特有種"],"solution":"臺灣藍鵲的重點是特有種。","verified":true}]},{"id":"s01-b04","level":"basic","unit":"3-1 生物生長的環境","question_type_id":"endemic-conservation","prompt":"如果題目說臺灣藍鵲「只自然分布在某一地區，其他地方沒有」，這個分類概念稱為什麼？","answer":["特有種"],"solution":"特有種強調自然分布範圍，只出現在某特定地區。","trap":"特有種不一定等於保育類；保育類重點是數量或生存受到威脅，需要保護。","hint":"分清楚：特有種看分布，保育類看保護需求。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P02","P03","P07"],"retry_variants":[{"id":"s01-b04-r1","variant_role":"same_type_new_context","prompt":"「數量稀少或生存受威脅，需要法律保護」比較接近哪個概念？","answer":["保育類"],"solution":"保育類著重保護需求，不是分布範圍。","verified":true},{"id":"s01-b04-r2","variant_role":"same_concept_different_ask_direction","prompt":"只要是特有種，就一定是外來入侵種嗎？請填：是或否。","answer":["否","不是"],"solution":"特有種是原本自然分布在某地的生物，和外來入侵種不同。","verified":true}]},{"id":"s01-b05","level":"basic","unit":"3-1 生物生長的環境","question_type_id":"cold-dry-adaptation","prompt":"若題目說生物有「厚毛和厚脂肪」，通常是在適應哪一種環境壓力？","answer":["寒冷"],"solution":"厚毛和厚脂肪可幫助北極熊適應寒冷。","trap":"不要只背生物名稱，要把構造、功能、環境壓力三者連起來。","hint":"用「構造 -> 功能 -> 環境」三步判斷。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P08"],"retry_variants":[{"id":"s01-b05-r1","variant_role":"same_type_new_context","prompt":"北極熊的構造可以幫助牠或它適應環境嗎？請填：是或否。","answer":["是"],"solution":"生物的構造常與環境適應有關。","verified":true},{"id":"s01-b05-r2","variant_role":"same_concept_different_ask_direction","prompt":"若環境壓力是缺水，仙人掌的哪個構造有幫助？","answer":["肥厚的莖"],"solution":"肥厚的莖能幫助仙人掌適應缺水。","verified":true}]},{"id":"s01-b06","level":"basic","unit":"3-1 生物生長的環境","question_type_id":"food-chain-role","prompt":"在「草 → 蚱蜢 → 青蛙 → 蛇」中，草能利用陽光製造養分，這個角色稱為什麼？","answer":["生產者"],"solution":"草能行光合作用製造養分，是這條食物鏈的生產者。","trap":"消費者靠吃其他生物取得能量；分解者分解遺骸、枯枝落葉和排泄物。","hint":"看到光合作用和製造養分，就想到生產者。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07"],"retry_variants":[{"id":"s01-b06-r1","variant_role":"same_type_new_context","prompt":"蚱蜢吃草取得能量，蚱蜢通常是什麼者？","answer":["消費者","一級消費者"],"solution":"蚱蜢吃生產者，所以是消費者。","verified":true},{"id":"s01-b06-r2","variant_role":"same_concept_different_ask_direction","prompt":"真菌分解枯木取得養分，通常稱為什麼者？","answer":["分解者"],"solution":"分解遺骸和枯木的角色是分解者。","verified":true}]},{"id":"s01-b07","level":"basic","unit":"3-2 人類活動對環境的影響","question_type_id":"invasive-definition","prompt":"像小花蔓澤蘭這類外來生物若能大量繁殖並造成「攀爬並遮蔽其他植物，使原生植物缺光死亡」，稱為什麼？","answer":["外來入侵種","入侵種"],"solution":"外來入侵種的判斷重點是外來、能繁殖，並造成生態或經濟危害。","trap":"不是所有外來種都一定有害；造成威脅才稱外來入侵種。","hint":"用三個條件檢查：外來、繁殖、危害。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P07"],"retry_variants":[{"id":"s01-b07-r1","variant_role":"same_type_new_context","prompt":"美國螯蝦造成「捕食小魚、水草或水生植物，危害水域生態」，比較接近哪一類生物？","answer":["外來入侵種","入侵種"],"solution":"美國螯蝦會威脅原生生物或環境，是外來入侵種題型。","verified":true},{"id":"s01-b07-r2","variant_role":"same_concept_different_ask_direction","prompt":"只要不是臺灣原生的生物，都一定會造成危害嗎？請填：是或否。","answer":["否","不是"],"solution":"外來種不一定有害，要造成危害才是外來入侵種。","verified":true}]},{"id":"s01-b08","level":"basic","unit":"3-2 人類活動對環境的影響","question_type_id":"conservation-action","prompt":"下列哪一項不是保育環境的適當做法？A 設置保留區、B 復育瀕危生物、C 任意放生小花蔓澤蘭、D 加強檢疫。","answer":["C","任意放生小花蔓澤蘭"],"solution":"任意放生小花蔓澤蘭可能破壞原生生態，不是正確保育行為。","trap":"看到放生不要立刻判斷為保育，要看是否造成外來種風險。","hint":"保育行動要降低風險，不是把生物隨便放到野外。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07"],"retry_variants":[{"id":"s01-b08-r1","variant_role":"same_type_new_context","prompt":"入境時加強動植物檢疫，有助於預防外來入侵種嗎？","answer":["是"],"solution":"檢疫能降低外來生物進入與擴散的風險。","verified":true},{"id":"s01-b08-r2","variant_role":"same_concept_different_ask_direction","prompt":"不想養的寵物可以直接放到野外嗎？請填：可以或不可以。","answer":["不可以","不能"],"solution":"棄養或放生可能造成外來入侵種問題。","verified":true}]},{"id":"s01-b09","level":"basic","unit":"3-2 人類活動對環境的影響","question_type_id":"air-pollution","prompt":"若今天甲地 AQI 42、乙地 AQI 88、丙地 AQI 156，AQI 數值越低通常代表空氣品質越好還是越差？","answer":["越好","好"],"solution":"AQI 是空氣品質指標，數值越低代表污染程度較低，空氣品質較好。","trap":"不要把數字大誤認為比較好；AQI 像警示燈，越高越要注意。","hint":"比較 AQI 時，先記住低是好、高是差。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07","P08"],"retry_variants":[{"id":"s01-b09-r1","variant_role":"same_type_new_context","prompt":"若丙地 AQI 156，戶外劇烈活動應增加還是減少？","answer":["減少"],"solution":"AQI 偏高時應減少戶外劇烈活動。","verified":true},{"id":"s01-b09-r2","variant_role":"same_concept_different_ask_direction","prompt":"PM2.5 主要影響人體哪個系統？","answer":["呼吸系統"],"solution":"細懸浮微粒會影響呼吸道，也可能影響心血管。","verified":true}]},{"id":"s01-b10","level":"basic","unit":"3-2 人類活動對環境的影響","question_type_id":"water-soil-pollution","prompt":"工廠廢水直接排入河川，最直接可能造成哪一類污染？","answer":["水汙染"],"solution":"工廠廢水直接排入河川會造成水汙染，可能導致魚蝦大量死亡。","trap":"不要以為只有工廠才會造成污染；家庭、農業、交通和能源使用也可能造成污染。","hint":"看污染物進入空氣、水、土壤或海洋。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07","A05"],"retry_variants":[{"id":"s01-b10-r1","variant_role":"same_type_new_context","prompt":"油輪漏油流入海面，可能造成什麼結果？","answer":["海鳥與海洋生物受害"],"solution":"油輪漏油流入海面會造成海洋汙染，進而讓海鳥與海洋生物受害。","verified":true},{"id":"s01-b10-r2","variant_role":"same_concept_different_ask_direction","prompt":"要減少這個問題，可採取「設置並確實使用汙水處理設備」嗎？請填：是或否。","answer":["是"],"solution":"設置並確實使用汙水處理設備能降低水汙染。","verified":true}]},{"id":"s01-b11","level":"basic","unit":"3-3 珍惜自然資源","question_type_id":"renewable-resource","prompt":"石油、風、鐵礦、陽光、水 中，哪幾項屬於可再生資源？請至少填一項。","answer":["風","陽光","水"],"solution":"風、陽光、水可在合理使用下持續供應或循環利用；其他項目短時間內無法再生。","trap":"石油、煤、天然氣和礦產形成時間很長，不能因為自然界有就算可再生。","hint":"一項一項分類，不要憑感覺。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07","A05"],"retry_variants":[{"id":"s01-b11-r1","variant_role":"same_type_new_context","prompt":"水力、銅礦、石油、生物資源、陽光 中，可再生資源有幾項？","answer":["3","三"],"solution":"可再生的是水力、生物資源、陽光，共 3 項。","verified":true},{"id":"s01-b11-r2","variant_role":"same_concept_different_ask_direction","prompt":"水是可再生資源，所以完全不用節約。此敘述正確或錯誤？","answer":["錯誤"],"solution":"水會循環，但仍可能因污染或使用不當而短缺。","verified":true}]},{"id":"s01-b12","level":"basic","unit":"3-3 珍惜自然資源","question_type_id":"energy-source","prompt":"火力發電的主要限制或環境問題是什麼？","answer":["空氣汙染"],"solution":"火力發電利用燃燒煤、石油或天然氣，優點是供電較穩定，但會排放污染物和二氧化碳。","trap":"不能只背優點；考題常把發電方式、來源、污染和限制一起考。","hint":"先判斷能源來源，再想它的優點和限制。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P03","P07","A05"],"retry_variants":[{"id":"s01-b12-r1","variant_role":"same_type_new_context","prompt":"水力發電主要利用什麼？","answer":["水位落差與水流"],"solution":"水力發電的能源來源是水位落差與水流。","verified":true},{"id":"s01-b12-r2","variant_role":"same_concept_different_ask_direction","prompt":"火力發電的優點是「供電較穩定」嗎？請填：是或否。","answer":["是"],"solution":"火力發電確實有供電較穩定這項優點，但也有會排放污染物和二氧化碳。","verified":true}]},{"id":"s01-b13","level":"basic","unit":"3-3 珍惜自然資源","question_type_id":"eco-label","prompt":"哪一種標章或標示重點是「可回收、低污染、省資源」？","answer":["環保標章"],"solution":"環保標章的重點是可回收、低污染、省資源。","trap":"不要和「能源效率」混淆；標章題要抓關鍵字。","hint":"先分清楚環保、節能、碳足跡、回收各自代表什麼。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07","A03","A05"],"retry_variants":[{"id":"s01-b13-r1","variant_role":"same_type_new_context","prompt":"「產品生命週期的二氧化碳排放量」對應哪一種標章或標示？","answer":["碳標籤"],"solution":"碳標籤的重點是產品生命週期的二氧化碳排放量。","verified":true},{"id":"s01-b13-r2","variant_role":"same_concept_different_ask_direction","prompt":"環保標章的重點是「可回收、低污染、省資源」嗎？請填：是或否。","answer":["是"],"solution":"環保標章就是用來表示可回收、低污染、省資源。","verified":true}]},{"id":"s01-b14","level":"basic","unit":"3-3 珍惜自然資源","question_type_id":"green-action","prompt":"Bobo 要去戶外教學，下列哪一項最符合節能減碳？A 購買過度包裝商品、B 自備餐具或購物袋、C 長時間開冰箱、D 短程也請家人開車。","answer":["B","自備餐具","自備購物袋"],"solution":"自備餐具或購物袋可減少一次性用品使用，屬於日常綠色行動。","trap":"包裝精美不代表環保；方便也不一定節能。","hint":"綠色行動常見線索是減少、重複使用、回收和節能。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P07","A03"],"retry_variants":[{"id":"s01-b14-r1","variant_role":"same_type_new_context","prompt":"購買當地、當季食物通常能減少運輸能源，這是節能減碳嗎？","answer":["是"],"solution":"減少長途運輸可降低能源消耗與碳排。","verified":true},{"id":"s01-b14-r2","variant_role":"same_concept_different_ask_direction","prompt":"選購過度包裝禮盒通常符合綠色消費嗎？請填：是或否。","answer":["否","不是"],"solution":"過度包裝會增加資源消耗和垃圾量。","verified":true}]},{"id":"s01-c01","level":"challenge","unit":"3-1 生物生長的環境","question_type_id":"wrong-statement-ecosystem","prompt":"下列哪一個敘述不正確？A 沙漠常見線索是日夜溫差大、降雨少，植物常有儲水或減少水分散失的構造、B 極地常見例子有企鵝、海豹、C 臺灣自然環境包含沙漠和極地、D 生物構造常和環境適應有關。","answer":["C","臺灣自然環境包含沙漠和極地"],"solution":"臺灣有高山、森林、河口、溪流、海洋等環境，但沒有自然的沙漠和極地。","trap":"高山寒冷不等於極地；乾季不等於沙漠。","hint":"找出太絕對或不符合臺灣地理的選項。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07","A05"],"retry_variants":[{"id":"s01-c01-r1","variant_role":"same_type_new_context","prompt":"臺灣高山氣溫低，所以臺灣就有極地環境。此敘述正確或錯誤？","answer":["錯誤"],"solution":"高山和極地是不同環境。","verified":true},{"id":"s01-c01-r2","variant_role":"same_concept_different_ask_direction","prompt":"沙漠的線索是「日夜溫差大、降雨少，植物常有儲水或減少水分散失的構造」嗎？請填：是或否。","answer":["是"],"solution":"沙漠可以用這些線索判斷。","verified":true}]},{"id":"s01-c02","level":"challenge","unit":"3-1 生物生長的環境","question_type_id":"species-habitat-trap","prompt":"哪一組生物與環境配對最合理？A 臺灣藍鵲—森林、B 玉山杜鵑—熱帶雨林植物、C 駱駝、跳鼠—極地、D 小花蔓澤蘭—臺灣特有種。","answer":["A","臺灣藍鵲—森林","臺灣藍鵲-森林"],"solution":"臺灣藍鵲適合配到森林；其他選項把棲地或分類混淆。","trap":"考古題常把正確生物放到錯誤棲地，或把外來種寫成特有種。","hint":"先處理最有把握的一組，再排除明顯錯誤。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P08"],"retry_variants":[{"id":"s01-c02-r1","variant_role":"same_type_new_context","prompt":"玉山杜鵑較適合配到高山還是熱帶雨林植物？","answer":["高山"],"solution":"玉山杜鵑和高山較合理。","verified":true},{"id":"s01-c02-r2","variant_role":"same_concept_different_ask_direction","prompt":"小花蔓澤蘭是臺灣特有種嗎？請填：是或否。","answer":["否","不是"],"solution":"小花蔓澤蘭在本範圍常作為外來入侵種例子。","verified":true}]},{"id":"s01-c03","level":"challenge","unit":"3-1 生物生長的環境","question_type_id":"food-chain-arrow","prompt":"草 → 蚱蜢 → 青蛙 → 蛇。這條食物鏈中，青蛙通常是幾級消費者？","answer":["二級","二級消費者"],"solution":"蚱蜢吃草，是一級消費者；青蛙吃蚱蜢，所以是二級消費者。","trap":"不要把生產者也算成一級消費者。","hint":"從生產者後第一個吃植物的動物開始數一級。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07"],"retry_variants":[{"id":"s01-c03-r1","variant_role":"same_type_new_context","prompt":"同一條食物鏈中，蚱蜢通常是幾級消費者？","answer":["一級","一級消費者"],"solution":"蚱蜢直接吃草，所以是一級消費者。","verified":true},{"id":"s01-c03-r2","variant_role":"same_concept_different_ask_direction","prompt":"稻米在食物鏈中通常是生產者還是消費者？","answer":["生產者"],"solution":"稻米可行光合作用製造養分。","verified":true}]},{"id":"s01-c04","level":"challenge","unit":"3-2 人類活動對環境的影響","question_type_id":"human-impact-cause","prompt":"沿海地區長期大量抽取地下水，最可能造成哪一種影響？","answer":["地層下陷"],"solution":"沿海地區長期大量抽取地下水可能造成地層下陷，也可能引發土壤鹽化。","trap":"不要只想到單一結果，考題常問人類活動的連鎖影響。","hint":"先找人類行為，再判斷棲地、水土或生物受到什麼影響。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07","A05"],"retry_variants":[{"id":"s01-c04-r1","variant_role":"same_type_new_context","prompt":"沿海地區長期大量抽取地下水也可能引發什麼額外問題？","answer":["土壤鹽化"],"solution":"土壤鹽化是這類人類活動的連鎖影響。","verified":true},{"id":"s01-c04-r2","variant_role":"same_concept_different_ask_direction","prompt":"濕地被填平興建道路可能造成「棲地減少」嗎？請填：是或否。","answer":["是"],"solution":"濕地被填平興建道路會提高棲地減少的風險。","verified":true}]},{"id":"s01-c05","level":"challenge","unit":"3-2 人類活動對環境的影響","question_type_id":"pollution-spread","prompt":"以「工廠廢水直接排入河川」為例，空氣或水會流動，所以污染可能擴散到其他地區，這個敘述正確嗎？","answer":["正確","是"],"solution":"大氣與水體會流動，污染物可能隨風、水流或食物鏈移動到其他地區。","trap":"不要以為污染只影響排放地點旁邊。","hint":"想想風、水流和食物鏈都會讓污染移動。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07"],"retry_variants":[{"id":"s01-c05-r1","variant_role":"same_type_new_context","prompt":"酸雨和空氣汙染完全無關。此敘述正確或錯誤？","answer":["錯誤"],"solution":"酸雨和空氣中的污染物有關。","verified":true},{"id":"s01-c05-r2","variant_role":"same_concept_different_ask_direction","prompt":"水中污染物可能透過食物鏈進入人體嗎？","answer":["會"],"solution":"污染物可能沿食物鏈移動或累積。","verified":true}]},{"id":"s01-c06","level":"challenge","unit":"3-2 人類活動對環境的影響","question_type_id":"invasive-scenario","prompt":"某人把小花蔓澤蘭帶到新環境，牠或它大量繁殖並造成「攀爬並遮蔽其他植物，使原生植物缺光死亡」。這最符合哪個概念？","answer":["外來入侵種","入侵種"],"solution":"外來、能繁殖並造成攀爬並遮蔽其他植物，使原生植物缺光死亡，符合外來入侵種。","trap":"不是所有外來種都一定會危害；本題關鍵是已造成危害。","hint":"用來源、繁殖、危害三步判斷。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P07"],"retry_variants":[{"id":"s01-c06-r1","variant_role":"same_type_new_context","prompt":"防止外來生物進入，機場港口應加強什麼？","answer":["檢疫"],"solution":"檢疫可降低外來入侵種風險。","verified":true},{"id":"s01-c06-r2","variant_role":"same_concept_different_ask_direction","prompt":"美國螯蝦造成危害後，仍可以任意放生更多嗎？請填：可以或不可以。","answer":["不可以","不能"],"solution":"任意放生可能擴大外來入侵種問題。","verified":true}]},{"id":"s01-c07","level":"challenge","unit":"3-2 人類活動對環境的影響","question_type_id":"AQI-reading","prompt":"某日甲地 AQI 42、乙地 AQI 88、丙地 AQI 156。哪一地空氣品質最差？","answer":["丙"],"solution":"AQI 數值越高表示污染越嚴重；丙地 156 最高，所以空氣品質最差。","trap":"題目問最差，不是最好。","hint":"AQI 越大越差，越小越好。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07","P08"],"retry_variants":[{"id":"s01-c07-r1","variant_role":"same_type_new_context","prompt":"同一天哪一地空氣品質最好？甲 42、乙 88、丙 156。","answer":["甲"],"solution":"甲地 AQI 42 最低，所以最好。","verified":true},{"id":"s01-c07-r2","variant_role":"same_concept_different_ask_direction","prompt":"AQI 高時，戶外劇烈運動應增加還是減少？","answer":["減少"],"solution":"AQI 高表示污染較嚴重，應減少戶外劇烈活動。","verified":true}]},{"id":"s01-c08","level":"challenge","unit":"3-3 珍惜自然資源","question_type_id":"resource-counting","prompt":"石油、風、鐵礦、陽光、水 這 5 項中，屬於可再生資源的有幾項？","answer":["3","三"],"solution":"可再生的是風、陽光、水，共 3 項。","trap":"礦產和化石燃料短期無法再生；水和生物資源可再生但仍要合理使用。","hint":"先把每一項打勾或叉，再計數。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07","A05"],"retry_variants":[{"id":"s01-c08-r1","variant_role":"same_type_new_context","prompt":"石油、風、鐵礦、陽光、水 中，請填一項非再生資源。","answer":["石油","鐵礦"],"solution":"非再生資源包含石油、鐵礦。","verified":true},{"id":"s01-c08-r2","variant_role":"same_concept_different_ask_direction","prompt":"可再生資源就可以任意浪費。此敘述正確或錯誤？","answer":["錯誤"],"solution":"可再生也需要合理使用，污染後仍會造成問題。","verified":true}]},{"id":"s01-c09","level":"challenge","unit":"3-3 珍惜自然資源","question_type_id":"energy-table","prompt":"下列哪一項最適合描述水力發電？A 受水量、地形和季節影響、B 一定完全沒有環境限制、C 主要使用沙漠動物、D 會讓外來種自然消失。","answer":["A","受水量、地形和季節影響"],"solution":"水力發電利用水位落差與水流，常見限制是受水量、地形和季節影響。","trap":"再生或低污染能源也有條件限制，不是完全沒有影響。","hint":"把發電方式、能源來源和限制配起來。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07"],"retry_variants":[{"id":"s01-c09-r1","variant_role":"same_type_new_context","prompt":"火力發電的能源來源是什麼？","answer":["燃燒煤、石油或天然氣"],"solution":"火力發電主要利用燃燒煤、石油或天然氣。","verified":true},{"id":"s01-c09-r2","variant_role":"same_concept_different_ask_direction","prompt":"水力發電的優點是「可再生且運轉污染少」嗎？請填：是或否。","answer":["是"],"solution":"水力發電有可再生且運轉污染少的優點。","verified":true}]},{"id":"s01-c10","level":"challenge","unit":"3 綜合素養","question_type_id":"reading-reasoning","prompt":"閱讀情境：社區淨溪時發現塑膠袋、廢油和魚蝦死亡，志工建議減少一次性用品並避免廢油倒入水槽。這些行動或現象主要和哪個問題有關？","answer":["水汙染"],"solution":"情境中的關鍵線索是污染物進入溪流，所以主要問題是水汙染。","trap":"素養題不要只抓單一名詞，要看情境中的原因和結果。","hint":"先圈出行為、污染物或生物變化，再判斷問題。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07"],"retry_variants":[{"id":"s01-c10-r1","variant_role":"same_type_new_context","prompt":"閱讀情境：家庭選購當地當季食物、自備餐具，並選擇碳足跡較低的飲料。主要問題是什麼？","answer":["節能減碳"],"solution":"線索是降低運輸、包裝和碳排，所以是節能減碳。","verified":true},{"id":"s01-c10-r2","variant_role":"same_concept_different_ask_direction","prompt":"這題的關鍵線索是「污染物進入溪流」嗎？請填：是或否。","answer":["是"],"solution":"判斷水汙染時，要抓住污染物進入溪流。","verified":true}]}]},{"run_id":"run02","label":"第 2 回","confidence_band":"high_confidence","questions":[{"id":"s02-b01","level":"basic","unit":"3-1 生物生長的環境","question_type_id":"environment-feature","prompt":"哪一種環境通常具有「全年溫暖潮溼、雨量豐沛，生物種類非常豐富」的特徵？請填：沙漠、草原、熱帶雨林、極地、河口溼地或高山。","answer":["熱帶雨林"],"solution":"熱帶雨林的典型線索是全年溫暖潮溼、雨量豐沛，生物種類非常豐富，常見例子有樹懶、巨嘴鳥。","trap":"熱帶雨林不是乾燥炎熱；重點是高溫多雨和物種豐富。","hint":"先抓環境壓力，再選環境名稱。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07","A05"],"retry_variants":[{"id":"s02-b01-r1","variant_role":"same_type_new_context","prompt":"看到「河川和海洋交界，水位與鹽分變化大」，最可能是哪一種環境？","answer":["河口溼地"],"solution":"河口溼地的線索是河川和海洋交界，水位與鹽分變化大。","verified":true},{"id":"s02-b01-r2","variant_role":"same_concept_different_ask_direction","prompt":"熱帶雨林常見的生物例子包含「樹懶、巨嘴鳥」嗎？請填：是或否。","answer":["是"],"solution":"樹懶、巨嘴鳥可作為熱帶雨林的代表例子。","verified":true}]},{"id":"s02-b02","level":"basic","unit":"3-1 生物生長的環境","question_type_id":"adaptation-reason","prompt":"駱駝的「駝峰儲存脂肪」主要能幫助它適應什麼？","answer":["提供能量並幫助耐旱"],"solution":"駱駝面對乾燥與缺水的環境壓力，駝峰儲存脂肪可以提供能量並幫助耐旱。","trap":"同一種生物可能有多種構造，答題時要看清楚題目問哪一個構造。","hint":"先圈出構造，再想它解決哪個環境壓力。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P07","P08"],"retry_variants":[{"id":"s02-b02-r1","variant_role":"same_type_new_context","prompt":"駱駝的「長睫毛」主要功能是什麼？","answer":["阻擋風沙","防風沙"],"solution":"長睫毛可幫助駱駝適應乾燥與缺水。","verified":true},{"id":"s02-b02-r2","variant_role":"same_concept_different_ask_direction","prompt":"水筆仔主要面對的環境壓力是什麼？","answer":["水位與鹽分變化"],"solution":"水筆仔的構造和水位與鹽分變化有關。","verified":true}]},{"id":"s02-b03","level":"basic","unit":"3-1 生物生長的環境","question_type_id":"species-habitat","prompt":"臺灣水鹿最適合和哪一種環境或分類配對？請填：高山、河口溼地生物或沙漠。","answer":["高山"],"solution":"臺灣水鹿是臺灣高山地區生物，適合配到高山。","trap":"不要只憑名字猜，要把生物和棲地特徵配起來。","hint":"看到臺灣生物，先想牠是高山、溪流、河口、海洋或森林。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07"],"retry_variants":[{"id":"s02-b03-r1","variant_role":"same_type_new_context","prompt":"水筆仔較適合和哪一種環境配對？","answer":["河口溼地"],"solution":"水筆仔常和河口溼地連在一起考。","verified":true},{"id":"s02-b03-r2","variant_role":"same_concept_different_ask_direction","prompt":"臺灣水鹿比較接近「臺灣高山地區生物」還是「河口溼地生物」？","answer":["臺灣高山地區生物"],"solution":"臺灣水鹿的重點是臺灣高山地區生物。","verified":true}]},{"id":"s02-b04","level":"basic","unit":"3-1 生物生長的環境","question_type_id":"endemic-conservation","prompt":"如果題目說臺灣水鹿「只自然分布在某一地區，其他地方沒有」，這個分類概念稱為什麼？","answer":["特有種"],"solution":"特有種強調自然分布範圍，只出現在某特定地區。","trap":"特有種不一定等於保育類；保育類重點是數量或生存受到威脅，需要保護。","hint":"分清楚：特有種看分布，保育類看保護需求。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P02","P03","P07"],"retry_variants":[{"id":"s02-b04-r1","variant_role":"same_type_new_context","prompt":"「數量稀少或生存受威脅，需要法律保護」比較接近哪個概念？","answer":["保育類"],"solution":"保育類著重保護需求，不是分布範圍。","verified":true},{"id":"s02-b04-r2","variant_role":"same_concept_different_ask_direction","prompt":"只要是特有種，就一定是外來入侵種嗎？請填：是或否。","answer":["否","不是"],"solution":"特有種是原本自然分布在某地的生物，和外來入侵種不同。","verified":true}]},{"id":"s02-b05","level":"basic","unit":"3-1 生物生長的環境","question_type_id":"cold-dry-adaptation","prompt":"若題目說生物有「胎生苗」，通常是在適應哪一種環境壓力？","answer":["水位與鹽分變化"],"solution":"胎生苗可幫助水筆仔適應水位與鹽分變化。","trap":"不要只背生物名稱，要把構造、功能、環境壓力三者連起來。","hint":"用「構造 -> 功能 -> 環境」三步判斷。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07","A04"],"retry_variants":[{"id":"s02-b05-r1","variant_role":"same_type_new_context","prompt":"水筆仔的構造可以幫助牠或它適應環境嗎？請填：是或否。","answer":["是"],"solution":"生物的構造常與環境適應有關。","verified":true},{"id":"s02-b05-r2","variant_role":"same_concept_different_ask_direction","prompt":"若環境壓力是乾燥與缺水，駱駝的哪個構造有幫助？","answer":["駝峰儲存脂肪"],"solution":"駝峰儲存脂肪能幫助駱駝適應乾燥與缺水。","verified":true}]},{"id":"s02-b06","level":"basic","unit":"3-1 生物生長的環境","question_type_id":"food-chain-role","prompt":"在「水草 → 小魚 → 大魚 → 鷺鷥」中，水草能利用陽光製造養分，這個角色稱為什麼？","answer":["生產者"],"solution":"水草能行光合作用製造養分，是這條食物鏈的生產者。","trap":"消費者靠吃其他生物取得能量；分解者分解遺骸、枯枝落葉和排泄物。","hint":"看到光合作用和製造養分，就想到生產者。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07"],"retry_variants":[{"id":"s02-b06-r1","variant_role":"same_type_new_context","prompt":"小魚吃水草取得能量，小魚通常是什麼者？","answer":["消費者","一級消費者"],"solution":"小魚吃生產者，所以是消費者。","verified":true},{"id":"s02-b06-r2","variant_role":"same_concept_different_ask_direction","prompt":"真菌分解枯木取得養分，通常稱為什麼者？","answer":["分解者"],"solution":"分解遺骸和枯木的角色是分解者。","verified":true}]},{"id":"s02-b07","level":"basic","unit":"3-2 人類活動對環境的影響","question_type_id":"invasive-definition","prompt":"像銀合歡這類外來生物若能大量繁殖並造成「生命力強，會排擠原生植物生長」，稱為什麼？","answer":["外來入侵種","入侵種"],"solution":"外來入侵種的判斷重點是外來、能繁殖，並造成生態或經濟危害。","trap":"不是所有外來種都一定有害；造成威脅才稱外來入侵種。","hint":"用三個條件檢查：外來、繁殖、危害。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07","A05"],"retry_variants":[{"id":"s02-b07-r1","variant_role":"same_type_new_context","prompt":"紅火蟻造成「攻擊人畜並影響原生昆蟲生存」，比較接近哪一類生物？","answer":["外來入侵種","入侵種"],"solution":"紅火蟻會威脅原生生物或環境，是外來入侵種題型。","verified":true},{"id":"s02-b07-r2","variant_role":"same_concept_different_ask_direction","prompt":"只要不是臺灣原生的生物，都一定會造成危害嗎？請填：是或否。","answer":["否","不是"],"solution":"外來種不一定有害，要造成危害才是外來入侵種。","verified":true}]},{"id":"s02-b08","level":"basic","unit":"3-2 人類活動對環境的影響","question_type_id":"conservation-action","prompt":"下列哪一項不是保育環境的適當做法？A 設置保留區、B 復育瀕危生物、C 任意放生銀合歡、D 加強檢疫。","answer":["C","任意放生銀合歡"],"solution":"任意放生銀合歡可能破壞原生生態，不是正確保育行為。","trap":"看到放生不要立刻判斷為保育，要看是否造成外來種風險。","hint":"保育行動要降低風險，不是把生物隨便放到野外。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07"],"retry_variants":[{"id":"s02-b08-r1","variant_role":"same_type_new_context","prompt":"入境時加強動植物檢疫，有助於預防外來入侵種嗎？","answer":["是"],"solution":"檢疫能降低外來生物進入與擴散的風險。","verified":true},{"id":"s02-b08-r2","variant_role":"same_concept_different_ask_direction","prompt":"不想養的寵物可以直接放到野外嗎？請填：可以或不可以。","answer":["不可以","不能"],"solution":"棄養或放生可能造成外來入侵種問題。","verified":true}]},{"id":"s02-b09","level":"basic","unit":"3-2 人類活動對環境的影響","question_type_id":"air-pollution","prompt":"若今天甲地 AQI 31、乙地 AQI 104、丙地 AQI 78，AQI 數值越低通常代表空氣品質越好還是越差？","answer":["越好","好"],"solution":"AQI 是空氣品質指標，數值越低代表污染程度較低，空氣品質較好。","trap":"不要把數字大誤認為比較好；AQI 像警示燈，越高越要注意。","hint":"比較 AQI 時，先記住低是好、高是差。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07","P08"],"retry_variants":[{"id":"s02-b09-r1","variant_role":"same_type_new_context","prompt":"若乙地 AQI 104，戶外劇烈活動應增加還是減少？","answer":["減少"],"solution":"AQI 偏高時應減少戶外劇烈活動。","verified":true},{"id":"s02-b09-r2","variant_role":"same_concept_different_ask_direction","prompt":"PM2.5 主要影響人體哪個系統？","answer":["呼吸系統"],"solution":"細懸浮微粒會影響呼吸道，也可能影響心血管。","verified":true}]},{"id":"s02-b10","level":"basic","unit":"3-2 人類活動對環境的影響","question_type_id":"water-soil-pollution","prompt":"汽機車和工廠排放廢氣，最直接可能造成哪一類污染？","answer":["空氣汙染"],"solution":"汽機車和工廠排放廢氣會造成空氣汙染，可能導致PM2.5 增加並影響呼吸道。","trap":"不要以為只有工廠才會造成污染；家庭、農業、交通和能源使用也可能造成污染。","hint":"看污染物進入空氣、水、土壤或海洋。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07","P08"],"retry_variants":[{"id":"s02-b10-r1","variant_role":"same_type_new_context","prompt":"露天燃燒垃圾，可能造成什麼結果？","answer":["產生有害氣體和懸浮微粒"],"solution":"露天燃燒垃圾會造成空氣汙染，進而讓產生有害氣體和懸浮微粒。","verified":true},{"id":"s02-b10-r2","variant_role":"same_concept_different_ask_direction","prompt":"要減少這個問題，可採取「多搭大眾交通工具並定期排氣檢驗」嗎？請填：是或否。","answer":["是"],"solution":"多搭大眾交通工具並定期排氣檢驗能降低空氣汙染。","verified":true}]},{"id":"s02-b11","level":"basic","unit":"3-3 珍惜自然資源","question_type_id":"renewable-resource","prompt":"煤、天然氣、太陽能、風力 中，哪幾項屬於可再生資源？請至少填一項。","answer":["太陽能","風力"],"solution":"太陽能、風力可在合理使用下持續供應或循環利用；其他項目短時間內無法再生。","trap":"石油、煤、天然氣和礦產形成時間很長，不能因為自然界有就算可再生。","hint":"一項一項分類，不要憑感覺。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07"],"retry_variants":[{"id":"s02-b11-r1","variant_role":"same_type_new_context","prompt":"天然氣、煤、森林、水、鐵礦 中，可再生資源有幾項？","answer":["2","二"],"solution":"可再生的是森林、水，共 2 項。","verified":true},{"id":"s02-b11-r2","variant_role":"same_concept_different_ask_direction","prompt":"水是可再生資源，所以完全不用節約。此敘述正確或錯誤？","answer":["錯誤"],"solution":"水會循環，但仍可能因污染或使用不當而短缺。","verified":true}]},{"id":"s02-b12","level":"basic","unit":"3-3 珍惜自然資源","question_type_id":"energy-source","prompt":"太陽能發電的主要限制或環境問題是什麼？","answer":["受日照影響"],"solution":"太陽能發電利用日照，優點是低污染且可再生，但受日照與天氣影響。","trap":"不能只背優點；考題常把發電方式、來源、污染和限制一起考。","hint":"先判斷能源來源，再想它的優點和限制。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07"],"retry_variants":[{"id":"s02-b12-r1","variant_role":"same_type_new_context","prompt":"核能發電主要利用什麼？","answer":["核燃料"],"solution":"核能發電的能源來源是核燃料。","verified":true},{"id":"s02-b12-r2","variant_role":"same_concept_different_ask_direction","prompt":"太陽能發電的優點是「低污染且可再生」嗎？請填：是或否。","answer":["是"],"solution":"太陽能發電確實有低污染且可再生這項優點，但也有受日照與天氣影響。","verified":true}]},{"id":"s02-b13","level":"basic","unit":"3-3 珍惜自然資源","question_type_id":"eco-label","prompt":"哪一種標章或標示重點是「能源效率較佳、用心節約能源」？","answer":["節能標章"],"solution":"節能標章的重點是能源效率較佳、用心節約能源。","trap":"不要和「產品碳排數字」混淆；標章題要抓關鍵字。","hint":"先分清楚環保、節能、碳足跡、回收各自代表什麼。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P08","A03"],"retry_variants":[{"id":"s02-b13-r1","variant_role":"same_type_new_context","prompt":"「可回收或應回收處理」對應哪一種標章或標示？","answer":["回收標誌"],"solution":"回收標誌的重點是可回收或應回收處理。","verified":true},{"id":"s02-b13-r2","variant_role":"same_concept_different_ask_direction","prompt":"節能標章的重點是「能源效率較佳、用心節約能源」嗎？請填：是或否。","answer":["是"],"solution":"節能標章就是用來表示能源效率較佳、用心節約能源。","verified":true}]},{"id":"s02-b14","level":"basic","unit":"3-3 珍惜自然資源","question_type_id":"green-action","prompt":"Bobo 要去戶外教學，下列哪一項最符合節能減碳？A 購買過度包裝商品、B 自備餐具或購物袋、C 長時間開冰箱、D 短程也請家人開車。","answer":["B","自備餐具","自備購物袋"],"solution":"自備餐具或購物袋可減少一次性用品使用，屬於日常綠色行動。","trap":"包裝精美不代表環保；方便也不一定節能。","hint":"綠色行動常見線索是減少、重複使用、回收和節能。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P07","A03"],"retry_variants":[{"id":"s02-b14-r1","variant_role":"same_type_new_context","prompt":"購買當地、當季食物通常能減少運輸能源，這是節能減碳嗎？","answer":["是"],"solution":"減少長途運輸可降低能源消耗與碳排。","verified":true},{"id":"s02-b14-r2","variant_role":"same_concept_different_ask_direction","prompt":"選購過度包裝禮盒通常符合綠色消費嗎？請填：是或否。","answer":["否","不是"],"solution":"過度包裝會增加資源消耗和垃圾量。","verified":true}]},{"id":"s02-c01","level":"challenge","unit":"3-1 生物生長的環境","question_type_id":"wrong-statement-ecosystem","prompt":"下列哪一個敘述不正確？A 熱帶雨林常見線索是全年溫暖潮溼、雨量豐沛，生物種類非常豐富、B 河口溼地常見例子有彈塗魚、招潮蟹、C 臺灣自然環境包含沙漠和極地、D 生物構造常和環境適應有關。","answer":["C","臺灣自然環境包含沙漠和極地"],"solution":"臺灣有高山、森林、河口、溪流、海洋等環境，但沒有自然的沙漠和極地。","trap":"高山寒冷不等於極地；乾季不等於沙漠。","hint":"找出太絕對或不符合臺灣地理的選項。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07","A05"],"retry_variants":[{"id":"s02-c01-r1","variant_role":"same_type_new_context","prompt":"臺灣高山氣溫低，所以臺灣就有極地環境。此敘述正確或錯誤？","answer":["錯誤"],"solution":"高山和極地是不同環境。","verified":true},{"id":"s02-c01-r2","variant_role":"same_concept_different_ask_direction","prompt":"熱帶雨林的線索是「全年溫暖潮溼、雨量豐沛，生物種類非常豐富」嗎？請填：是或否。","answer":["是"],"solution":"熱帶雨林可以用這些線索判斷。","verified":true}]},{"id":"s02-c02","level":"challenge","unit":"3-1 生物生長的環境","question_type_id":"species-habitat-trap","prompt":"哪一組生物與環境配對最合理？A 臺灣水鹿—高山、B 水筆仔—極地植物、C 樹懶、巨嘴鳥—河口溼地、D 銀合歡—臺灣特有種。","answer":["A","臺灣水鹿—高山","臺灣水鹿-高山"],"solution":"臺灣水鹿適合配到高山；其他選項把棲地或分類混淆。","trap":"考古題常把正確生物放到錯誤棲地，或把外來種寫成特有種。","hint":"先處理最有把握的一組，再排除明顯錯誤。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07"],"retry_variants":[{"id":"s02-c02-r1","variant_role":"same_type_new_context","prompt":"水筆仔較適合配到河口溼地還是極地植物？","answer":["河口溼地"],"solution":"水筆仔和河口溼地較合理。","verified":true},{"id":"s02-c02-r2","variant_role":"same_concept_different_ask_direction","prompt":"銀合歡是臺灣特有種嗎？請填：是或否。","answer":["否","不是"],"solution":"銀合歡在本範圍常作為外來入侵種例子。","verified":true}]},{"id":"s02-c03","level":"challenge","unit":"3-1 生物生長的環境","question_type_id":"food-chain-arrow","prompt":"水草 → 小魚 → 大魚 → 鷺鷥。這條食物鏈中，大魚通常是幾級消費者？","answer":["二級","二級消費者"],"solution":"小魚吃水草，是一級消費者；大魚吃小魚，所以是二級消費者。","trap":"不要把生產者也算成一級消費者。","hint":"從生產者後第一個吃植物的動物開始數一級。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07"],"retry_variants":[{"id":"s02-c03-r1","variant_role":"same_type_new_context","prompt":"同一條食物鏈中，小魚通常是幾級消費者？","answer":["一級","一級消費者"],"solution":"小魚直接吃水草，所以是一級消費者。","verified":true},{"id":"s02-c03-r2","variant_role":"same_concept_different_ask_direction","prompt":"藻類在食物鏈中通常是生產者還是消費者？","answer":["生產者"],"solution":"藻類可行光合作用製造養分。","verified":true}]},{"id":"s02-c04","level":"challenge","unit":"3-2 人類活動對環境的影響","question_type_id":"human-impact-cause","prompt":"大量砍伐山坡地森林，最可能造成哪一種影響？","answer":["土石流機會增加"],"solution":"大量砍伐山坡地森林可能造成土石流機會增加，也可能引發水土保持變差。","trap":"不要只想到單一結果，考題常問人類活動的連鎖影響。","hint":"先找人類行為，再判斷棲地、水土或生物受到什麼影響。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07"],"retry_variants":[{"id":"s02-c04-r1","variant_role":"same_type_new_context","prompt":"大量砍伐山坡地森林也可能引發什麼額外問題？","answer":["水土保持變差"],"solution":"水土保持變差是這類人類活動的連鎖影響。","verified":true},{"id":"s02-c04-r2","variant_role":"same_concept_different_ask_direction","prompt":"山坡地過度開墾種茶樹可能造成「水土保持變差」嗎？請填：是或否。","answer":["是"],"solution":"山坡地過度開墾種茶樹會提高水土保持變差的風險。","verified":true}]},{"id":"s02-c05","level":"challenge","unit":"3-2 人類活動對環境的影響","question_type_id":"pollution-spread","prompt":"以「汽機車和工廠排放廢氣」為例，空氣或水會流動，所以污染可能擴散到其他地區，這個敘述正確嗎？","answer":["正確","是"],"solution":"大氣與水體會流動，污染物可能隨風、水流或食物鏈移動到其他地區。","trap":"不要以為污染只影響排放地點旁邊。","hint":"想想風、水流和食物鏈都會讓污染移動。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07"],"retry_variants":[{"id":"s02-c05-r1","variant_role":"same_type_new_context","prompt":"酸雨和空氣汙染完全無關。此敘述正確或錯誤？","answer":["錯誤"],"solution":"酸雨和空氣中的污染物有關。","verified":true},{"id":"s02-c05-r2","variant_role":"same_concept_different_ask_direction","prompt":"水中污染物可能透過食物鏈進入人體嗎？","answer":["會"],"solution":"污染物可能沿食物鏈移動或累積。","verified":true}]},{"id":"s02-c06","level":"challenge","unit":"3-2 人類活動對環境的影響","question_type_id":"invasive-scenario","prompt":"某人把銀合歡帶到新環境，牠或它大量繁殖並造成「生命力強，會排擠原生植物生長」。這最符合哪個概念？","answer":["外來入侵種","入侵種"],"solution":"外來、能繁殖並造成生命力強，會排擠原生植物生長，符合外來入侵種。","trap":"不是所有外來種都一定會危害；本題關鍵是已造成危害。","hint":"用來源、繁殖、危害三步判斷。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07","A05"],"retry_variants":[{"id":"s02-c06-r1","variant_role":"same_type_new_context","prompt":"防止外來生物進入，機場港口應加強什麼？","answer":["檢疫"],"solution":"檢疫可降低外來入侵種風險。","verified":true},{"id":"s02-c06-r2","variant_role":"same_concept_different_ask_direction","prompt":"紅火蟻造成危害後，仍可以任意放生更多嗎？請填：可以或不可以。","answer":["不可以","不能"],"solution":"任意放生可能擴大外來入侵種問題。","verified":true}]},{"id":"s02-c07","level":"challenge","unit":"3-2 人類活動對環境的影響","question_type_id":"AQI-reading","prompt":"某日甲地 AQI 31、乙地 AQI 104、丙地 AQI 78。哪一地空氣品質最差？","answer":["乙"],"solution":"AQI 數值越高表示污染越嚴重；乙地 104 最高，所以空氣品質最差。","trap":"題目問最差，不是最好。","hint":"AQI 越大越差，越小越好。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07","P08"],"retry_variants":[{"id":"s02-c07-r1","variant_role":"same_type_new_context","prompt":"同一天哪一地空氣品質最好？甲 31、乙 104、丙 78。","answer":["甲"],"solution":"甲地 AQI 31 最低，所以最好。","verified":true},{"id":"s02-c07-r2","variant_role":"same_concept_different_ask_direction","prompt":"AQI 高時，戶外劇烈運動應增加還是減少？","answer":["減少"],"solution":"AQI 高表示污染較嚴重，應減少戶外劇烈活動。","verified":true}]},{"id":"s02-c08","level":"challenge","unit":"3-3 珍惜自然資源","question_type_id":"resource-counting","prompt":"煤、天然氣、太陽能、風力 這 4 項中，屬於可再生資源的有幾項？","answer":["2","二"],"solution":"可再生的是太陽能、風力，共 2 項。","trap":"礦產和化石燃料短期無法再生；水和生物資源可再生但仍要合理使用。","hint":"先把每一項打勾或叉，再計數。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07"],"retry_variants":[{"id":"s02-c08-r1","variant_role":"same_type_new_context","prompt":"煤、天然氣、太陽能、風力 中，請填一項非再生資源。","answer":["煤","天然氣"],"solution":"非再生資源包含煤、天然氣。","verified":true},{"id":"s02-c08-r2","variant_role":"same_concept_different_ask_direction","prompt":"可再生資源就可以任意浪費。此敘述正確或錯誤？","answer":["錯誤"],"solution":"可再生也需要合理使用，污染後仍會造成問題。","verified":true}]},{"id":"s02-c09","level":"challenge","unit":"3-3 珍惜自然資源","question_type_id":"energy-table","prompt":"下列哪一項最適合描述核能發電？A 核廢料需要妥善處理、B 一定完全沒有環境限制、C 主要使用沙漠動物、D 會讓外來種自然消失。","answer":["A","核廢料需要妥善處理"],"solution":"核能發電利用核燃料，常見限制是核廢料需要妥善處理。","trap":"再生或低污染能源也有條件限制，不是完全沒有影響。","hint":"把發電方式、能源來源和限制配起來。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P03"],"retry_variants":[{"id":"s02-c09-r1","variant_role":"same_type_new_context","prompt":"太陽能發電的能源來源是什麼？","answer":["日照"],"solution":"太陽能發電主要利用日照。","verified":true},{"id":"s02-c09-r2","variant_role":"same_concept_different_ask_direction","prompt":"核能發電的優點是「發電時空氣污染較少」嗎？請填：是或否。","answer":["是"],"solution":"核能發電有發電時空氣污染較少的優點。","verified":true}]},{"id":"s02-c10","level":"challenge","unit":"3 綜合素養","question_type_id":"reading-reasoning","prompt":"閱讀情境：學校附近 AQI 升高，老師提醒減少戶外劇烈活動，並討論汽機車廢氣和工廠排放。這些行動或現象主要和哪個問題有關？","answer":["空氣汙染"],"solution":"情境中的關鍵線索是AQI 高和廢氣排放，所以主要問題是空氣汙染。","trap":"素養題不要只抓單一名詞，要看情境中的原因和結果。","hint":"先圈出行為、污染物或生物變化，再判斷問題。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07","P08"],"retry_variants":[{"id":"s02-c10-r1","variant_role":"same_type_new_context","prompt":"閱讀情境：沿海地區長期超抽地下水，地面逐漸下陷，海水也可能進入地下水層。主要問題是什麼？","answer":["地層下陷與土壤鹽化"],"solution":"線索是超抽地下水，所以是地層下陷與土壤鹽化。","verified":true},{"id":"s02-c10-r2","variant_role":"same_concept_different_ask_direction","prompt":"這題的關鍵線索是「AQI 高和廢氣排放」嗎？請填：是或否。","answer":["是"],"solution":"判斷空氣汙染時，要抓住AQI 高和廢氣排放。","verified":true}]}]},{"run_id":"run03","label":"第 3 回","confidence_band":"high_confidence","questions":[{"id":"s03-b01","level":"basic","unit":"3-1 生物生長的環境","question_type_id":"environment-feature","prompt":"哪一種環境通常具有「乾季和雨季分明、地形開闊，常有大型草食和肉食動物」的特徵？請填：沙漠、草原、熱帶雨林、極地、河口溼地或高山。","answer":["草原"],"solution":"草原的典型線索是乾季和雨季分明、地形開闊，常有大型草食和肉食動物，常見例子有羚羊、獅子。","trap":"草原不是沒有生物的荒地；開闊和奔跑能力是常見線索。","hint":"先抓環境壓力，再選環境名稱。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07","A05"],"retry_variants":[{"id":"s03-b01-r1","variant_role":"same_type_new_context","prompt":"看到「氣溫低、風力強、土壤較少，仍有特化植物與動物」，最可能是哪一種環境？","answer":["高山"],"solution":"高山的線索是氣溫低、風力強、土壤較少，仍有特化植物與動物。","verified":true},{"id":"s03-b01-r2","variant_role":"same_concept_different_ask_direction","prompt":"草原常見的生物例子包含「羚羊、獅子」嗎？請填：是或否。","answer":["是"],"solution":"羚羊、獅子可作為草原的代表例子。","verified":true}]},{"id":"s03-b02","level":"basic","unit":"3-1 生物生長的環境","question_type_id":"adaptation-reason","prompt":"北極熊的「厚毛和厚脂肪」主要能幫助它適應什麼？","answer":["保暖"],"solution":"北極熊面對寒冷的環境壓力，厚毛和厚脂肪可以保暖。","trap":"同一種生物可能有多種構造，答題時要看清楚題目問哪一個構造。","hint":"先圈出構造，再想它解決哪個環境壓力。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P08"],"retry_variants":[{"id":"s03-b02-r1","variant_role":"same_type_new_context","prompt":"北極熊的「白色外表」主要功能是什麼？","answer":["保護色","隱蔽"],"solution":"白色外表可幫助北極熊適應寒冷。","verified":true},{"id":"s03-b02-r2","variant_role":"same_concept_different_ask_direction","prompt":"彈塗魚主要面對的環境壓力是什麼？","answer":["水陸交界"],"solution":"彈塗魚的構造和水陸交界有關。","verified":true}]},{"id":"s03-b03","level":"basic","unit":"3-1 生物生長的環境","question_type_id":"species-habitat","prompt":"櫻花鉤吻鮭最適合和哪一種環境或分類配對？請填：溪流、沙漠生物或沙漠。","answer":["溪流"],"solution":"櫻花鉤吻鮭是保育類，適合配到溪流。","trap":"不要只憑名字猜，要把生物和棲地特徵配起來。","hint":"看到臺灣生物，先想牠是高山、溪流、河口、海洋或森林。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P02","P03"],"retry_variants":[{"id":"s03-b03-r1","variant_role":"same_type_new_context","prompt":"珊瑚較適合和哪一種環境配對？","answer":["溫暖清澈海域"],"solution":"珊瑚常和溫暖清澈海域連在一起考。","verified":true},{"id":"s03-b03-r2","variant_role":"same_concept_different_ask_direction","prompt":"櫻花鉤吻鮭比較接近「保育類」還是「沙漠生物」？","answer":["保育類"],"solution":"櫻花鉤吻鮭的重點是保育類。","verified":true}]},{"id":"s03-b04","level":"basic","unit":"3-1 生物生長的環境","question_type_id":"endemic-conservation","prompt":"如果題目說櫻花鉤吻鮭「只自然分布在某一地區，其他地方沒有」，這個分類概念稱為什麼？","answer":["特有種"],"solution":"特有種強調自然分布範圍，只出現在某特定地區。","trap":"特有種不一定等於保育類；保育類重點是數量或生存受到威脅，需要保護。","hint":"分清楚：特有種看分布，保育類看保護需求。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P02","P03","P07"],"retry_variants":[{"id":"s03-b04-r1","variant_role":"same_type_new_context","prompt":"「數量稀少或生存受威脅，需要法律保護」比較接近哪個概念？","answer":["保育類"],"solution":"保育類著重保護需求，不是分布範圍。","verified":true},{"id":"s03-b04-r2","variant_role":"same_concept_different_ask_direction","prompt":"只要是特有種，就一定是外來入侵種嗎？請填：是或否。","answer":["否","不是"],"solution":"特有種是原本自然分布在某地的生物，和外來入侵種不同。","verified":true}]},{"id":"s03-b05","level":"basic","unit":"3-1 生物生長的環境","question_type_id":"cold-dry-adaptation","prompt":"若題目說生物有「潮溼皮膚輔助呼吸」，通常是在適應哪一種環境壓力？","answer":["水陸交界"],"solution":"潮溼皮膚輔助呼吸可幫助彈塗魚適應水陸交界。","trap":"不要只背生物名稱，要把構造、功能、環境壓力三者連起來。","hint":"用「構造 -> 功能 -> 環境」三步判斷。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07"],"retry_variants":[{"id":"s03-b05-r1","variant_role":"same_type_new_context","prompt":"彈塗魚的構造可以幫助牠或它適應環境嗎？請填：是或否。","answer":["是"],"solution":"生物的構造常與環境適應有關。","verified":true},{"id":"s03-b05-r2","variant_role":"same_concept_different_ask_direction","prompt":"若環境壓力是寒冷，北極熊的哪個構造有幫助？","answer":["厚毛和厚脂肪"],"solution":"厚毛和厚脂肪能幫助北極熊適應寒冷。","verified":true}]},{"id":"s03-b06","level":"basic","unit":"3-1 生物生長的環境","question_type_id":"food-chain-role","prompt":"在「稻米 → 老鼠 → 蛇 → 老鷹」中，稻米能利用陽光製造養分，這個角色稱為什麼？","answer":["生產者"],"solution":"稻米能行光合作用製造養分，是這條食物鏈的生產者。","trap":"消費者靠吃其他生物取得能量；分解者分解遺骸、枯枝落葉和排泄物。","hint":"看到光合作用和製造養分，就想到生產者。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07"],"retry_variants":[{"id":"s03-b06-r1","variant_role":"same_type_new_context","prompt":"老鼠吃稻米取得能量，老鼠通常是什麼者？","answer":["消費者","一級消費者"],"solution":"老鼠吃生產者，所以是消費者。","verified":true},{"id":"s03-b06-r2","variant_role":"same_concept_different_ask_direction","prompt":"真菌分解枯木取得養分，通常稱為什麼者？","answer":["分解者"],"solution":"分解遺骸和枯木的角色是分解者。","verified":true}]},{"id":"s03-b07","level":"basic","unit":"3-2 人類活動對環境的影響","question_type_id":"invasive-definition","prompt":"像福壽螺這類外來生物若能大量繁殖並造成「啃食水稻等農作物，造成農業損失」，稱為什麼？","answer":["外來入侵種","入侵種"],"solution":"外來入侵種的判斷重點是外來、能繁殖，並造成生態或經濟危害。","trap":"不是所有外來種都一定有害；造成威脅才稱外來入侵種。","hint":"用三個條件檢查：外來、繁殖、危害。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P08"],"retry_variants":[{"id":"s03-b07-r1","variant_role":"same_type_new_context","prompt":"布袋蓮造成「大量繁殖覆蓋水面，影響水中生物」，比較接近哪一類生物？","answer":["外來入侵種","入侵種"],"solution":"布袋蓮會威脅原生生物或環境，是外來入侵種題型。","verified":true},{"id":"s03-b07-r2","variant_role":"same_concept_different_ask_direction","prompt":"只要不是臺灣原生的生物，都一定會造成危害嗎？請填：是或否。","answer":["否","不是"],"solution":"外來種不一定有害，要造成危害才是外來入侵種。","verified":true}]},{"id":"s03-b08","level":"basic","unit":"3-2 人類活動對環境的影響","question_type_id":"conservation-action","prompt":"下列哪一項不是保育環境的適當做法？A 設置保留區、B 復育瀕危生物、C 任意放生福壽螺、D 加強檢疫。","answer":["C","任意放生福壽螺"],"solution":"任意放生福壽螺可能破壞原生生態，不是正確保育行為。","trap":"看到放生不要立刻判斷為保育，要看是否造成外來種風險。","hint":"保育行動要降低風險，不是把生物隨便放到野外。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07"],"retry_variants":[{"id":"s03-b08-r1","variant_role":"same_type_new_context","prompt":"入境時加強動植物檢疫，有助於預防外來入侵種嗎？","answer":["是"],"solution":"檢疫能降低外來生物進入與擴散的風險。","verified":true},{"id":"s03-b08-r2","variant_role":"same_concept_different_ask_direction","prompt":"不想養的寵物可以直接放到野外嗎？請填：可以或不可以。","answer":["不可以","不能"],"solution":"棄養或放生可能造成外來入侵種問題。","verified":true}]},{"id":"s03-b09","level":"basic","unit":"3-2 人類活動對環境的影響","question_type_id":"air-pollution","prompt":"若今天甲地 AQI 160、乙地 AQI 52、丙地 AQI 96，AQI 數值越低通常代表空氣品質越好還是越差？","answer":["越好","好"],"solution":"AQI 是空氣品質指標，數值越低代表污染程度較低，空氣品質較好。","trap":"不要把數字大誤認為比較好；AQI 像警示燈，越高越要注意。","hint":"比較 AQI 時，先記住低是好、高是差。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07","P08"],"retry_variants":[{"id":"s03-b09-r1","variant_role":"same_type_new_context","prompt":"若甲地 AQI 160，戶外劇烈活動應增加還是減少？","answer":["減少"],"solution":"AQI 偏高時應減少戶外劇烈活動。","verified":true},{"id":"s03-b09-r2","variant_role":"same_concept_different_ask_direction","prompt":"PM2.5 主要影響人體哪個系統？","answer":["呼吸系統"],"solution":"細懸浮微粒會影響呼吸道，也可能影響心血管。","verified":true}]},{"id":"s03-b10","level":"basic","unit":"3-2 人類活動對環境的影響","question_type_id":"water-soil-pollution","prompt":"農藥、肥料滲入土壤和水中，最直接可能造成哪一類污染？","answer":["土壤汙染和水汙染"],"solution":"農藥、肥料滲入土壤和水中會造成土壤汙染和水汙染，可能導致地下水或河川水質變差。","trap":"不要以為只有工廠才會造成污染；家庭、農業、交通和能源使用也可能造成污染。","hint":"看污染物進入空氣、水、土壤或海洋。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P05"],"retry_variants":[{"id":"s03-b10-r1","variant_role":"same_type_new_context","prompt":"在河邊大量飼養家禽，排泄物流入水中，可能造成什麼結果？","answer":["水質惡化並影響水生生物"],"solution":"在河邊大量飼養家禽，排泄物流入水中會造成水汙染，進而讓水質惡化並影響水生生物。","verified":true},{"id":"s03-b10-r2","variant_role":"same_concept_different_ask_direction","prompt":"要減少這個問題，可採取「合理施肥並避免任意噴灑」嗎？請填：是或否。","answer":["是"],"solution":"合理施肥並避免任意噴灑能降低土壤汙染和水汙染。","verified":true}]},{"id":"s03-b11","level":"basic","unit":"3-3 珍惜自然資源","question_type_id":"renewable-resource","prompt":"水力、銅礦、石油、生物資源、陽光 中，哪幾項屬於可再生資源？請至少填一項。","answer":["水力","生物資源","陽光"],"solution":"水力、生物資源、陽光可在合理使用下持續供應或循環利用；其他項目短時間內無法再生。","trap":"石油、煤、天然氣和礦產形成時間很長，不能因為自然界有就算可再生。","hint":"一項一項分類，不要憑感覺。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P06"],"retry_variants":[{"id":"s03-b11-r1","variant_role":"same_type_new_context","prompt":"風、石油、太陽能、鋁礦、潮汐 中，可再生資源有幾項？","answer":["3","三"],"solution":"可再生的是風、太陽能、潮汐，共 3 項。","verified":true},{"id":"s03-b11-r2","variant_role":"same_concept_different_ask_direction","prompt":"水是可再生資源，所以完全不用節約。此敘述正確或錯誤？","answer":["錯誤"],"solution":"水會循環，但仍可能因污染或使用不當而短缺。","verified":true}]},{"id":"s03-b12","level":"basic","unit":"3-3 珍惜自然資源","question_type_id":"energy-source","prompt":"風力發電的主要限制或環境問題是什麼？","answer":["受風況影響"],"solution":"風力發電利用風，優點是低污染且可再生，但受風況和地點影響。","trap":"不能只背優點；考題常把發電方式、來源、污染和限制一起考。","hint":"先判斷能源來源，再想它的優點和限制。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07"],"retry_variants":[{"id":"s03-b12-r1","variant_role":"same_type_new_context","prompt":"地熱發電主要利用什麼？","answer":["地底熱能"],"solution":"地熱發電的能源來源是地底熱能。","verified":true},{"id":"s03-b12-r2","variant_role":"same_concept_different_ask_direction","prompt":"風力發電的優點是「低污染且可再生」嗎？請填：是或否。","answer":["是"],"solution":"風力發電確實有低污染且可再生這項優點，但也有受風況和地點影響。","verified":true}]},{"id":"s03-b13","level":"basic","unit":"3-3 珍惜自然資源","question_type_id":"eco-label","prompt":"哪一種標章或標示重點是「產品生命週期的二氧化碳排放量」？","answer":["碳標籤"],"solution":"碳標籤的重點是產品生命週期的二氧化碳排放量。","trap":"不要和「保育類名單」混淆；標章題要抓關鍵字。","hint":"先分清楚環保、節能、碳足跡、回收各自代表什麼。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07","A03"],"retry_variants":[{"id":"s03-b13-r1","variant_role":"same_type_new_context","prompt":"「可回收、低污染、省資源」對應哪一種標章或標示？","answer":["環保標章"],"solution":"環保標章的重點是可回收、低污染、省資源。","verified":true},{"id":"s03-b13-r2","variant_role":"same_concept_different_ask_direction","prompt":"碳標籤的重點是「產品生命週期的二氧化碳排放量」嗎？請填：是或否。","answer":["是"],"solution":"碳標籤就是用來表示產品生命週期的二氧化碳排放量。","verified":true}]},{"id":"s03-b14","level":"basic","unit":"3-3 珍惜自然資源","question_type_id":"green-action","prompt":"Bobo 要去戶外教學，下列哪一項最符合節能減碳？A 購買過度包裝商品、B 自備餐具或購物袋、C 長時間開冰箱、D 短程也請家人開車。","answer":["B","自備餐具","自備購物袋"],"solution":"自備餐具或購物袋可減少一次性用品使用，屬於日常綠色行動。","trap":"包裝精美不代表環保；方便也不一定節能。","hint":"綠色行動常見線索是減少、重複使用、回收和節能。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P07","A03"],"retry_variants":[{"id":"s03-b14-r1","variant_role":"same_type_new_context","prompt":"購買當地、當季食物通常能減少運輸能源，這是節能減碳嗎？","answer":["是"],"solution":"減少長途運輸可降低能源消耗與碳排。","verified":true},{"id":"s03-b14-r2","variant_role":"same_concept_different_ask_direction","prompt":"選購過度包裝禮盒通常符合綠色消費嗎？請填：是或否。","answer":["否","不是"],"solution":"過度包裝會增加資源消耗和垃圾量。","verified":true}]},{"id":"s03-c01","level":"challenge","unit":"3-1 生物生長的環境","question_type_id":"wrong-statement-ecosystem","prompt":"下列哪一個敘述不正確？A 草原常見線索是乾季和雨季分明、地形開闊，常有大型草食和肉食動物、B 高山常見例子有玉山圓柏、臺灣水鹿、C 臺灣自然環境包含沙漠和極地、D 生物構造常和環境適應有關。","answer":["C","臺灣自然環境包含沙漠和極地"],"solution":"臺灣有高山、森林、河口、溪流、海洋等環境，但沒有自然的沙漠和極地。","trap":"高山寒冷不等於極地；乾季不等於沙漠。","hint":"找出太絕對或不符合臺灣地理的選項。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07","A05"],"retry_variants":[{"id":"s03-c01-r1","variant_role":"same_type_new_context","prompt":"臺灣高山氣溫低，所以臺灣就有極地環境。此敘述正確或錯誤？","answer":["錯誤"],"solution":"高山和極地是不同環境。","verified":true},{"id":"s03-c01-r2","variant_role":"same_concept_different_ask_direction","prompt":"草原的線索是「乾季和雨季分明、地形開闊，常有大型草食和肉食動物」嗎？請填：是或否。","answer":["是"],"solution":"草原可以用這些線索判斷。","verified":true}]},{"id":"s03-c02","level":"challenge","unit":"3-1 生物生長的環境","question_type_id":"species-habitat-trap","prompt":"哪一組生物與環境配對最合理？A 櫻花鉤吻鮭—溪流、B 珊瑚—草原生物、C 羚羊、獅子—高山、D 福壽螺—臺灣特有種。","answer":["A","櫻花鉤吻鮭—溪流","櫻花鉤吻鮭-溪流"],"solution":"櫻花鉤吻鮭適合配到溪流；其他選項把棲地或分類混淆。","trap":"考古題常把正確生物放到錯誤棲地，或把外來種寫成特有種。","hint":"先處理最有把握的一組，再排除明顯錯誤。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P02","P03"],"retry_variants":[{"id":"s03-c02-r1","variant_role":"same_type_new_context","prompt":"珊瑚較適合配到溫暖清澈海域還是草原生物？","answer":["溫暖清澈海域"],"solution":"珊瑚和溫暖清澈海域較合理。","verified":true},{"id":"s03-c02-r2","variant_role":"same_concept_different_ask_direction","prompt":"福壽螺是臺灣特有種嗎？請填：是或否。","answer":["否","不是"],"solution":"福壽螺在本範圍常作為外來入侵種例子。","verified":true}]},{"id":"s03-c03","level":"challenge","unit":"3-1 生物生長的環境","question_type_id":"food-chain-arrow","prompt":"稻米 → 老鼠 → 蛇 → 老鷹。這條食物鏈中，蛇通常是幾級消費者？","answer":["二級","二級消費者"],"solution":"老鼠吃稻米，是一級消費者；蛇吃老鼠，所以是二級消費者。","trap":"不要把生產者也算成一級消費者。","hint":"從生產者後第一個吃植物的動物開始數一級。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07"],"retry_variants":[{"id":"s03-c03-r1","variant_role":"same_type_new_context","prompt":"同一條食物鏈中，老鼠通常是幾級消費者？","answer":["一級","一級消費者"],"solution":"老鼠直接吃稻米，所以是一級消費者。","verified":true},{"id":"s03-c03-r2","variant_role":"same_concept_different_ask_direction","prompt":"樹葉在食物鏈中通常是生產者還是消費者？","answer":["生產者"],"solution":"樹葉可行光合作用製造養分。","verified":true}]},{"id":"s03-c04","level":"challenge","unit":"3-2 人類活動對環境的影響","question_type_id":"human-impact-cause","prompt":"河川砂石被大量開採，最可能造成哪一種影響？","answer":["河床改變與河岸坍方"],"solution":"河川砂石被大量開採可能造成河床改變與河岸坍方，也可能引發水生生物棲地受破壞。","trap":"不要只想到單一結果，考題常問人類活動的連鎖影響。","hint":"先找人類行為，再判斷棲地、水土或生物受到什麼影響。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P05"],"retry_variants":[{"id":"s03-c04-r1","variant_role":"same_type_new_context","prompt":"河川砂石被大量開採也可能引發什麼額外問題？","answer":["水生生物棲地受破壞"],"solution":"水生生物棲地受破壞是這類人類活動的連鎖影響。","verified":true},{"id":"s03-c04-r2","variant_role":"same_concept_different_ask_direction","prompt":"任意棄養外來寵物到池塘可能造成「原生生物生存空間被壓縮」嗎？請填：是或否。","answer":["是"],"solution":"任意棄養外來寵物到池塘會提高原生生物生存空間被壓縮的風險。","verified":true}]},{"id":"s03-c05","level":"challenge","unit":"3-2 人類活動對環境的影響","question_type_id":"pollution-spread","prompt":"以「農藥、肥料滲入土壤和水中」為例，空氣或水會流動，所以污染可能擴散到其他地區，這個敘述正確嗎？","answer":["正確","是"],"solution":"大氣與水體會流動，污染物可能隨風、水流或食物鏈移動到其他地區。","trap":"不要以為污染只影響排放地點旁邊。","hint":"想想風、水流和食物鏈都會讓污染移動。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07"],"retry_variants":[{"id":"s03-c05-r1","variant_role":"same_type_new_context","prompt":"酸雨和空氣汙染完全無關。此敘述正確或錯誤？","answer":["錯誤"],"solution":"酸雨和空氣中的污染物有關。","verified":true},{"id":"s03-c05-r2","variant_role":"same_concept_different_ask_direction","prompt":"水中污染物可能透過食物鏈進入人體嗎？","answer":["會"],"solution":"污染物可能沿食物鏈移動或累積。","verified":true}]},{"id":"s03-c06","level":"challenge","unit":"3-2 人類活動對環境的影響","question_type_id":"invasive-scenario","prompt":"某人把福壽螺帶到新環境，牠或它大量繁殖並造成「啃食水稻等農作物，造成農業損失」。這最符合哪個概念？","answer":["外來入侵種","入侵種"],"solution":"外來、能繁殖並造成啃食水稻等農作物，造成農業損失，符合外來入侵種。","trap":"不是所有外來種都一定會危害；本題關鍵是已造成危害。","hint":"用來源、繁殖、危害三步判斷。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P08"],"retry_variants":[{"id":"s03-c06-r1","variant_role":"same_type_new_context","prompt":"防止外來生物進入，機場港口應加強什麼？","answer":["檢疫"],"solution":"檢疫可降低外來入侵種風險。","verified":true},{"id":"s03-c06-r2","variant_role":"same_concept_different_ask_direction","prompt":"布袋蓮造成危害後，仍可以任意放生更多嗎？請填：可以或不可以。","answer":["不可以","不能"],"solution":"任意放生可能擴大外來入侵種問題。","verified":true}]},{"id":"s03-c07","level":"challenge","unit":"3-2 人類活動對環境的影響","question_type_id":"AQI-reading","prompt":"某日甲地 AQI 160、乙地 AQI 52、丙地 AQI 96。哪一地空氣品質最差？","answer":["甲"],"solution":"AQI 數值越高表示污染越嚴重；甲地 160 最高，所以空氣品質最差。","trap":"題目問最差，不是最好。","hint":"AQI 越大越差，越小越好。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07","P08"],"retry_variants":[{"id":"s03-c07-r1","variant_role":"same_type_new_context","prompt":"同一天哪一地空氣品質最好？甲 160、乙 52、丙 96。","answer":["乙"],"solution":"乙地 AQI 52 最低，所以最好。","verified":true},{"id":"s03-c07-r2","variant_role":"same_concept_different_ask_direction","prompt":"AQI 高時，戶外劇烈運動應增加還是減少？","answer":["減少"],"solution":"AQI 高表示污染較嚴重，應減少戶外劇烈活動。","verified":true}]},{"id":"s03-c08","level":"challenge","unit":"3-3 珍惜自然資源","question_type_id":"resource-counting","prompt":"水力、銅礦、石油、生物資源、陽光 這 5 項中，屬於可再生資源的有幾項？","answer":["3","三"],"solution":"可再生的是水力、生物資源、陽光，共 3 項。","trap":"礦產和化石燃料短期無法再生；水和生物資源可再生但仍要合理使用。","hint":"先把每一項打勾或叉，再計數。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P06"],"retry_variants":[{"id":"s03-c08-r1","variant_role":"same_type_new_context","prompt":"水力、銅礦、石油、生物資源、陽光 中，請填一項非再生資源。","answer":["銅礦","石油"],"solution":"非再生資源包含銅礦、石油。","verified":true},{"id":"s03-c08-r2","variant_role":"same_concept_different_ask_direction","prompt":"可再生資源就可以任意浪費。此敘述正確或錯誤？","answer":["錯誤"],"solution":"可再生也需要合理使用，污染後仍會造成問題。","verified":true}]},{"id":"s03-c09","level":"challenge","unit":"3-3 珍惜自然資源","question_type_id":"energy-table","prompt":"下列哪一項最適合描述地熱發電？A 受地熱資源分布限制、B 一定完全沒有環境限制、C 主要使用沙漠動物、D 會讓外來種自然消失。","answer":["A","受地熱資源分布限制"],"solution":"地熱發電利用地底熱能，常見限制是受地熱資源分布限制。","trap":"再生或低污染能源也有條件限制，不是完全沒有影響。","hint":"把發電方式、能源來源和限制配起來。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P06"],"retry_variants":[{"id":"s03-c09-r1","variant_role":"same_type_new_context","prompt":"風力發電的能源來源是什麼？","answer":["風"],"solution":"風力發電主要利用風。","verified":true},{"id":"s03-c09-r2","variant_role":"same_concept_different_ask_direction","prompt":"地熱發電的優點是「低污染且穩定度較高」嗎？請填：是或否。","answer":["是"],"solution":"地熱發電有低污染且穩定度較高的優點。","verified":true}]},{"id":"s03-c10","level":"challenge","unit":"3 綜合素養","question_type_id":"reading-reasoning","prompt":"閱讀情境：山坡地被大量開墾種植，颱風後發生土石流，溪水也變得混濁。這些行動或現象主要和哪個問題有關？","answer":["棲地破壞與水土保持變差"],"solution":"情境中的關鍵線索是山坡開墾和土石流，所以主要問題是棲地破壞與水土保持變差。","trap":"素養題不要只抓單一名詞，要看情境中的原因和結果。","hint":"先圈出行為、污染物或生物變化，再判斷問題。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07","A05"],"retry_variants":[{"id":"s03-c10-r1","variant_role":"same_type_new_context","prompt":"閱讀情境：社區淨溪時發現塑膠袋、廢油和魚蝦死亡，志工建議減少一次性用品並避免廢油倒入水槽。主要問題是什麼？","answer":["水汙染"],"solution":"線索是污染物進入溪流，所以是水汙染。","verified":true},{"id":"s03-c10-r2","variant_role":"same_concept_different_ask_direction","prompt":"這題的關鍵線索是「山坡開墾和土石流」嗎？請填：是或否。","answer":["是"],"solution":"判斷棲地破壞與水土保持變差時，要抓住山坡開墾和土石流。","verified":true}]}]},{"run_id":"run04","label":"第 4 回","confidence_band":"high_confidence","questions":[{"id":"s04-b01","level":"basic","unit":"3-1 生物生長的環境","question_type_id":"environment-feature","prompt":"哪一種環境通常具有「終年寒冷、冰雪覆蓋，生物常有厚皮毛或脂肪保暖」的特徵？請填：沙漠、草原、熱帶雨林、極地、河口溼地或高山。","answer":["極地"],"solution":"極地的典型線索是終年寒冷、冰雪覆蓋，生物常有厚皮毛或脂肪保暖，常見例子有企鵝、海豹。","trap":"高山寒冷不等於極地；極地位在南北極附近。","hint":"先抓環境壓力，再選環境名稱。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07","A05"],"retry_variants":[{"id":"s04-b01-r1","variant_role":"same_type_new_context","prompt":"看到「日夜溫差大、降雨少，植物常有儲水或減少水分散失的構造」，最可能是哪一種環境？","answer":["沙漠"],"solution":"沙漠的線索是日夜溫差大、降雨少，植物常有儲水或減少水分散失的構造。","verified":true},{"id":"s04-b01-r2","variant_role":"same_concept_different_ask_direction","prompt":"極地常見的生物例子包含「企鵝、海豹」嗎？請填：是或否。","answer":["是"],"solution":"企鵝、海豹可作為極地的代表例子。","verified":true}]},{"id":"s04-b02","level":"basic","unit":"3-1 生物生長的環境","question_type_id":"adaptation-reason","prompt":"水筆仔的「胎生苗」主要能幫助它適應什麼？","answer":["幫助幼苗扎根"],"solution":"水筆仔面對水位與鹽分變化的環境壓力，胎生苗可以幫助幼苗扎根。","trap":"同一種生物可能有多種構造，答題時要看清楚題目問哪一個構造。","hint":"先圈出構造，再想它解決哪個環境壓力。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07","A04"],"retry_variants":[{"id":"s04-b02-r1","variant_role":"same_type_new_context","prompt":"水筆仔的「氣生根」主要功能是什麼？","answer":["幫助呼吸","呼吸"],"solution":"氣生根可幫助水筆仔適應水位與鹽分變化。","verified":true},{"id":"s04-b02-r2","variant_role":"same_concept_different_ask_direction","prompt":"玉山圓柏主要面對的環境壓力是什麼？","answer":["低溫與強風"],"solution":"玉山圓柏的構造和低溫與強風有關。","verified":true}]},{"id":"s04-b03","level":"basic","unit":"3-1 生物生長的環境","question_type_id":"species-habitat","prompt":"玉山杜鵑最適合和哪一種環境或分類配對？請填：高山、熱帶雨林植物或沙漠。","answer":["高山"],"solution":"玉山杜鵑是高山植物，適合配到高山。","trap":"不要只憑名字猜，要把生物和棲地特徵配起來。","hint":"看到臺灣生物，先想牠是高山、溪流、河口、海洋或森林。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07"],"retry_variants":[{"id":"s04-b03-r1","variant_role":"same_type_new_context","prompt":"臺灣藍鵲較適合和哪一種環境配對？","answer":["森林"],"solution":"臺灣藍鵲常和森林連在一起考。","verified":true},{"id":"s04-b03-r2","variant_role":"same_concept_different_ask_direction","prompt":"玉山杜鵑比較接近「高山植物」還是「熱帶雨林植物」？","answer":["高山植物"],"solution":"玉山杜鵑的重點是高山植物。","verified":true}]},{"id":"s04-b04","level":"basic","unit":"3-1 生物生長的環境","question_type_id":"endemic-conservation","prompt":"如果題目說玉山杜鵑「只自然分布在某一地區，其他地方沒有」，這個分類概念稱為什麼？","answer":["特有種"],"solution":"特有種強調自然分布範圍，只出現在某特定地區。","trap":"特有種不一定等於保育類；保育類重點是數量或生存受到威脅，需要保護。","hint":"分清楚：特有種看分布，保育類看保護需求。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P02","P03","P07"],"retry_variants":[{"id":"s04-b04-r1","variant_role":"same_type_new_context","prompt":"「數量稀少或生存受威脅，需要法律保護」比較接近哪個概念？","answer":["保育類"],"solution":"保育類著重保護需求，不是分布範圍。","verified":true},{"id":"s04-b04-r2","variant_role":"same_concept_different_ask_direction","prompt":"只要是特有種，就一定是外來入侵種嗎？請填：是或否。","answer":["否","不是"],"solution":"特有種是原本自然分布在某地的生物，和外來入侵種不同。","verified":true}]},{"id":"s04-b05","level":"basic","unit":"3-1 生物生長的環境","question_type_id":"cold-dry-adaptation","prompt":"若題目說生物有「低矮或彎曲生長」，通常是在適應哪一種環境壓力？","answer":["低溫與強風"],"solution":"低矮或彎曲生長可幫助玉山圓柏適應低溫與強風。","trap":"不要只背生物名稱，要把構造、功能、環境壓力三者連起來。","hint":"用「構造 -> 功能 -> 環境」三步判斷。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P02","P07","A04"],"retry_variants":[{"id":"s04-b05-r1","variant_role":"same_type_new_context","prompt":"玉山圓柏的構造可以幫助牠或它適應環境嗎？請填：是或否。","answer":["是"],"solution":"生物的構造常與環境適應有關。","verified":true},{"id":"s04-b05-r2","variant_role":"same_concept_different_ask_direction","prompt":"若環境壓力是水位與鹽分變化，水筆仔的哪個構造有幫助？","answer":["胎生苗"],"solution":"胎生苗能幫助水筆仔適應水位與鹽分變化。","verified":true}]},{"id":"s04-b06","level":"basic","unit":"3-1 生物生長的環境","question_type_id":"food-chain-role","prompt":"在「藻類 → 蝦子 → 小魚 → 大魚」中，藻類能利用陽光製造養分，這個角色稱為什麼？","answer":["生產者"],"solution":"藻類能行光合作用製造養分，是這條食物鏈的生產者。","trap":"消費者靠吃其他生物取得能量；分解者分解遺骸、枯枝落葉和排泄物。","hint":"看到光合作用和製造養分，就想到生產者。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07"],"retry_variants":[{"id":"s04-b06-r1","variant_role":"same_type_new_context","prompt":"蝦子吃藻類取得能量，蝦子通常是什麼者？","answer":["消費者","一級消費者"],"solution":"蝦子吃生產者，所以是消費者。","verified":true},{"id":"s04-b06-r2","variant_role":"same_concept_different_ask_direction","prompt":"真菌分解枯木取得養分，通常稱為什麼者？","answer":["分解者"],"solution":"分解遺骸和枯木的角色是分解者。","verified":true}]},{"id":"s04-b07","level":"basic","unit":"3-2 人類活動對環境的影響","question_type_id":"invasive-definition","prompt":"像美國螯蝦這類外來生物若能大量繁殖並造成「捕食小魚、水草或水生植物，危害水域生態」，稱為什麼？","answer":["外來入侵種","入侵種"],"solution":"外來入侵種的判斷重點是外來、能繁殖，並造成生態或經濟危害。","trap":"不是所有外來種都一定有害；造成威脅才稱外來入侵種。","hint":"用三個條件檢查：外來、繁殖、危害。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P07"],"retry_variants":[{"id":"s04-b07-r1","variant_role":"same_type_new_context","prompt":"小花蔓澤蘭造成「攀爬並遮蔽其他植物，使原生植物缺光死亡」，比較接近哪一類生物？","answer":["外來入侵種","入侵種"],"solution":"小花蔓澤蘭會威脅原生生物或環境，是外來入侵種題型。","verified":true},{"id":"s04-b07-r2","variant_role":"same_concept_different_ask_direction","prompt":"只要不是臺灣原生的生物，都一定會造成危害嗎？請填：是或否。","answer":["否","不是"],"solution":"外來種不一定有害，要造成危害才是外來入侵種。","verified":true}]},{"id":"s04-b08","level":"basic","unit":"3-2 人類活動對環境的影響","question_type_id":"conservation-action","prompt":"下列哪一項不是保育環境的適當做法？A 設置保留區、B 復育瀕危生物、C 任意放生美國螯蝦、D 加強檢疫。","answer":["C","任意放生美國螯蝦"],"solution":"任意放生美國螯蝦可能破壞原生生態，不是正確保育行為。","trap":"看到放生不要立刻判斷為保育，要看是否造成外來種風險。","hint":"保育行動要降低風險，不是把生物隨便放到野外。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07"],"retry_variants":[{"id":"s04-b08-r1","variant_role":"same_type_new_context","prompt":"入境時加強動植物檢疫，有助於預防外來入侵種嗎？","answer":["是"],"solution":"檢疫能降低外來生物進入與擴散的風險。","verified":true},{"id":"s04-b08-r2","variant_role":"same_concept_different_ask_direction","prompt":"不想養的寵物可以直接放到野外嗎？請填：可以或不可以。","answer":["不可以","不能"],"solution":"棄養或放生可能造成外來入侵種問題。","verified":true}]},{"id":"s04-b09","level":"basic","unit":"3-2 人類活動對環境的影響","question_type_id":"air-pollution","prompt":"若今天甲地 AQI 66、乙地 AQI 141、丙地 AQI 38，AQI 數值越低通常代表空氣品質越好還是越差？","answer":["越好","好"],"solution":"AQI 是空氣品質指標，數值越低代表污染程度較低，空氣品質較好。","trap":"不要把數字大誤認為比較好；AQI 像警示燈，越高越要注意。","hint":"比較 AQI 時，先記住低是好、高是差。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07","P08"],"retry_variants":[{"id":"s04-b09-r1","variant_role":"same_type_new_context","prompt":"若乙地 AQI 141，戶外劇烈活動應增加還是減少？","answer":["減少"],"solution":"AQI 偏高時應減少戶外劇烈活動。","verified":true},{"id":"s04-b09-r2","variant_role":"same_concept_different_ask_direction","prompt":"PM2.5 主要影響人體哪個系統？","answer":["呼吸系統"],"solution":"細懸浮微粒會影響呼吸道，也可能影響心血管。","verified":true}]},{"id":"s04-b10","level":"basic","unit":"3-2 人類活動對環境的影響","question_type_id":"water-soil-pollution","prompt":"油輪漏油流入海面，最直接可能造成哪一類污染？","answer":["海洋汙染"],"solution":"油輪漏油流入海面會造成海洋汙染，可能導致海鳥與海洋生物受害。","trap":"不要以為只有工廠才會造成污染；家庭、農業、交通和能源使用也可能造成污染。","hint":"看污染物進入空氣、水、土壤或海洋。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","A05"],"retry_variants":[{"id":"s04-b10-r1","variant_role":"same_type_new_context","prompt":"工廠廢水直接排入河川，可能造成什麼結果？","answer":["魚蝦大量死亡"],"solution":"工廠廢水直接排入河川會造成水汙染，進而讓魚蝦大量死亡。","verified":true},{"id":"s04-b10-r2","variant_role":"same_concept_different_ask_direction","prompt":"要減少這個問題，可採取「加強運輸管理並清理油汙」嗎？請填：是或否。","answer":["是"],"solution":"加強運輸管理並清理油汙能降低海洋汙染。","verified":true}]},{"id":"s04-b11","level":"basic","unit":"3-3 珍惜自然資源","question_type_id":"renewable-resource","prompt":"天然氣、煤、森林、水、鐵礦 中，哪幾項屬於可再生資源？請至少填一項。","answer":["森林","水"],"solution":"森林、水可在合理使用下持續供應或循環利用；其他項目短時間內無法再生。","trap":"石油、煤、天然氣和礦產形成時間很長，不能因為自然界有就算可再生。","hint":"一項一項分類，不要憑感覺。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07","A03"],"retry_variants":[{"id":"s04-b11-r1","variant_role":"same_type_new_context","prompt":"煤、石油、天然氣、陽光、風 中，可再生資源有幾項？","answer":["2","二"],"solution":"可再生的是陽光、風，共 2 項。","verified":true},{"id":"s04-b11-r2","variant_role":"same_concept_different_ask_direction","prompt":"水是可再生資源，所以完全不用節約。此敘述正確或錯誤？","answer":["錯誤"],"solution":"水會循環，但仍可能因污染或使用不當而短缺。","verified":true}]},{"id":"s04-b12","level":"basic","unit":"3-3 珍惜自然資源","question_type_id":"energy-source","prompt":"水力發電的主要限制或環境問題是什麼？","answer":["受水量影響"],"solution":"水力發電利用水位落差與水流，優點是可再生且運轉污染少，但受水量、地形和季節影響。","trap":"不能只背優點；考題常把發電方式、來源、污染和限制一起考。","hint":"先判斷能源來源，再想它的優點和限制。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07"],"retry_variants":[{"id":"s04-b12-r1","variant_role":"same_type_new_context","prompt":"火力發電主要利用什麼？","answer":["燃燒煤、石油或天然氣"],"solution":"火力發電的能源來源是燃燒煤、石油或天然氣。","verified":true},{"id":"s04-b12-r2","variant_role":"same_concept_different_ask_direction","prompt":"水力發電的優點是「可再生且運轉污染少」嗎？請填：是或否。","answer":["是"],"solution":"水力發電確實有可再生且運轉污染少這項優點，但也有受水量、地形和季節影響。","verified":true}]},{"id":"s04-b13","level":"basic","unit":"3-3 珍惜自然資源","question_type_id":"eco-label","prompt":"哪一種標章或標示重點是「可回收或應回收處理」？","answer":["回收標誌"],"solution":"回收標誌的重點是可回收或應回收處理。","trap":"不要和「空氣品質指標」混淆；標章題要抓關鍵字。","hint":"先分清楚環保、節能、碳足跡、回收各自代表什麼。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P07","A03"],"retry_variants":[{"id":"s04-b13-r1","variant_role":"same_type_new_context","prompt":"「能源效率較佳、用心節約能源」對應哪一種標章或標示？","answer":["節能標章"],"solution":"節能標章的重點是能源效率較佳、用心節約能源。","verified":true},{"id":"s04-b13-r2","variant_role":"same_concept_different_ask_direction","prompt":"回收標誌的重點是「可回收或應回收處理」嗎？請填：是或否。","answer":["是"],"solution":"回收標誌就是用來表示可回收或應回收處理。","verified":true}]},{"id":"s04-b14","level":"basic","unit":"3-3 珍惜自然資源","question_type_id":"green-action","prompt":"Bobo 要去戶外教學，下列哪一項最符合節能減碳？A 購買過度包裝商品、B 自備餐具或購物袋、C 長時間開冰箱、D 短程也請家人開車。","answer":["B","自備餐具","自備購物袋"],"solution":"自備餐具或購物袋可減少一次性用品使用，屬於日常綠色行動。","trap":"包裝精美不代表環保；方便也不一定節能。","hint":"綠色行動常見線索是減少、重複使用、回收和節能。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P07","A03"],"retry_variants":[{"id":"s04-b14-r1","variant_role":"same_type_new_context","prompt":"購買當地、當季食物通常能減少運輸能源，這是節能減碳嗎？","answer":["是"],"solution":"減少長途運輸可降低能源消耗與碳排。","verified":true},{"id":"s04-b14-r2","variant_role":"same_concept_different_ask_direction","prompt":"選購過度包裝禮盒通常符合綠色消費嗎？請填：是或否。","answer":["否","不是"],"solution":"過度包裝會增加資源消耗和垃圾量。","verified":true}]},{"id":"s04-c01","level":"challenge","unit":"3-1 生物生長的環境","question_type_id":"wrong-statement-ecosystem","prompt":"下列哪一個敘述不正確？A 極地常見線索是終年寒冷、冰雪覆蓋，生物常有厚皮毛或脂肪保暖、B 沙漠常見例子有駱駝、跳鼠、C 臺灣自然環境包含沙漠和極地、D 生物構造常和環境適應有關。","answer":["C","臺灣自然環境包含沙漠和極地"],"solution":"臺灣有高山、森林、河口、溪流、海洋等環境，但沒有自然的沙漠和極地。","trap":"高山寒冷不等於極地；乾季不等於沙漠。","hint":"找出太絕對或不符合臺灣地理的選項。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07","A05"],"retry_variants":[{"id":"s04-c01-r1","variant_role":"same_type_new_context","prompt":"臺灣高山氣溫低，所以臺灣就有極地環境。此敘述正確或錯誤？","answer":["錯誤"],"solution":"高山和極地是不同環境。","verified":true},{"id":"s04-c01-r2","variant_role":"same_concept_different_ask_direction","prompt":"極地的線索是「終年寒冷、冰雪覆蓋，生物常有厚皮毛或脂肪保暖」嗎？請填：是或否。","answer":["是"],"solution":"極地可以用這些線索判斷。","verified":true}]},{"id":"s04-c02","level":"challenge","unit":"3-1 生物生長的環境","question_type_id":"species-habitat-trap","prompt":"哪一組生物與環境配對最合理？A 玉山杜鵑—高山、B 臺灣藍鵲—外來入侵種、C 企鵝、海豹—沙漠、D 美國螯蝦—臺灣特有種。","answer":["A","玉山杜鵑—高山","玉山杜鵑-高山"],"solution":"玉山杜鵑適合配到高山；其他選項把棲地或分類混淆。","trap":"考古題常把正確生物放到錯誤棲地，或把外來種寫成特有種。","hint":"先處理最有把握的一組，再排除明顯錯誤。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07"],"retry_variants":[{"id":"s04-c02-r1","variant_role":"same_type_new_context","prompt":"臺灣藍鵲較適合配到森林還是外來入侵種？","answer":["森林"],"solution":"臺灣藍鵲和森林較合理。","verified":true},{"id":"s04-c02-r2","variant_role":"same_concept_different_ask_direction","prompt":"美國螯蝦是臺灣特有種嗎？請填：是或否。","answer":["否","不是"],"solution":"美國螯蝦在本範圍常作為外來入侵種例子。","verified":true}]},{"id":"s04-c03","level":"challenge","unit":"3-1 生物生長的環境","question_type_id":"food-chain-arrow","prompt":"藻類 → 蝦子 → 小魚 → 大魚。這條食物鏈中，小魚通常是幾級消費者？","answer":["二級","二級消費者"],"solution":"蝦子吃藻類，是一級消費者；小魚吃蝦子，所以是二級消費者。","trap":"不要把生產者也算成一級消費者。","hint":"從生產者後第一個吃植物的動物開始數一級。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07"],"retry_variants":[{"id":"s04-c03-r1","variant_role":"same_type_new_context","prompt":"同一條食物鏈中，蝦子通常是幾級消費者？","answer":["一級","一級消費者"],"solution":"蝦子直接吃藻類，所以是一級消費者。","verified":true},{"id":"s04-c03-r2","variant_role":"same_concept_different_ask_direction","prompt":"浮游植物在食物鏈中通常是生產者還是消費者？","answer":["生產者"],"solution":"浮游植物可行光合作用製造養分。","verified":true}]},{"id":"s04-c04","level":"challenge","unit":"3-2 人類活動對環境的影響","question_type_id":"human-impact-cause","prompt":"濕地被填平興建道路，最可能造成哪一種影響？","answer":["棲地減少"],"solution":"濕地被填平興建道路可能造成棲地減少，也可能引發候鳥和水生生物受影響。","trap":"不要只想到單一結果，考題常問人類活動的連鎖影響。","hint":"先找人類行為，再判斷棲地、水土或生物受到什麼影響。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07"],"retry_variants":[{"id":"s04-c04-r1","variant_role":"same_type_new_context","prompt":"濕地被填平興建道路也可能引發什麼額外問題？","answer":["候鳥和水生生物受影響"],"solution":"候鳥和水生生物受影響是這類人類活動的連鎖影響。","verified":true},{"id":"s04-c04-r2","variant_role":"same_concept_different_ask_direction","prompt":"沿海地區長期大量抽取地下水可能造成「地層下陷」嗎？請填：是或否。","answer":["是"],"solution":"沿海地區長期大量抽取地下水會提高地層下陷的風險。","verified":true}]},{"id":"s04-c05","level":"challenge","unit":"3-2 人類活動對環境的影響","question_type_id":"pollution-spread","prompt":"以「油輪漏油流入海面」為例，空氣或水會流動，所以污染可能擴散到其他地區，這個敘述正確嗎？","answer":["正確","是"],"solution":"大氣與水體會流動，污染物可能隨風、水流或食物鏈移動到其他地區。","trap":"不要以為污染只影響排放地點旁邊。","hint":"想想風、水流和食物鏈都會讓污染移動。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07"],"retry_variants":[{"id":"s04-c05-r1","variant_role":"same_type_new_context","prompt":"酸雨和空氣汙染完全無關。此敘述正確或錯誤？","answer":["錯誤"],"solution":"酸雨和空氣中的污染物有關。","verified":true},{"id":"s04-c05-r2","variant_role":"same_concept_different_ask_direction","prompt":"水中污染物可能透過食物鏈進入人體嗎？","answer":["會"],"solution":"污染物可能沿食物鏈移動或累積。","verified":true}]},{"id":"s04-c06","level":"challenge","unit":"3-2 人類活動對環境的影響","question_type_id":"invasive-scenario","prompt":"某人把美國螯蝦帶到新環境，牠或它大量繁殖並造成「捕食小魚、水草或水生植物，危害水域生態」。這最符合哪個概念？","answer":["外來入侵種","入侵種"],"solution":"外來、能繁殖並造成捕食小魚、水草或水生植物，危害水域生態，符合外來入侵種。","trap":"不是所有外來種都一定會危害；本題關鍵是已造成危害。","hint":"用來源、繁殖、危害三步判斷。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P07"],"retry_variants":[{"id":"s04-c06-r1","variant_role":"same_type_new_context","prompt":"防止外來生物進入，機場港口應加強什麼？","answer":["檢疫"],"solution":"檢疫可降低外來入侵種風險。","verified":true},{"id":"s04-c06-r2","variant_role":"same_concept_different_ask_direction","prompt":"小花蔓澤蘭造成危害後，仍可以任意放生更多嗎？請填：可以或不可以。","answer":["不可以","不能"],"solution":"任意放生可能擴大外來入侵種問題。","verified":true}]},{"id":"s04-c07","level":"challenge","unit":"3-2 人類活動對環境的影響","question_type_id":"AQI-reading","prompt":"某日甲地 AQI 66、乙地 AQI 141、丙地 AQI 38。哪一地空氣品質最差？","answer":["乙"],"solution":"AQI 數值越高表示污染越嚴重；乙地 141 最高，所以空氣品質最差。","trap":"題目問最差，不是最好。","hint":"AQI 越大越差，越小越好。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07","P08"],"retry_variants":[{"id":"s04-c07-r1","variant_role":"same_type_new_context","prompt":"同一天哪一地空氣品質最好？甲 66、乙 141、丙 38。","answer":["丙"],"solution":"丙地 AQI 38 最低，所以最好。","verified":true},{"id":"s04-c07-r2","variant_role":"same_concept_different_ask_direction","prompt":"AQI 高時，戶外劇烈運動應增加還是減少？","answer":["減少"],"solution":"AQI 高表示污染較嚴重，應減少戶外劇烈活動。","verified":true}]},{"id":"s04-c08","level":"challenge","unit":"3-3 珍惜自然資源","question_type_id":"resource-counting","prompt":"天然氣、煤、森林、水、鐵礦 這 5 項中，屬於可再生資源的有幾項？","answer":["2","二"],"solution":"可再生的是森林、水，共 2 項。","trap":"礦產和化石燃料短期無法再生；水和生物資源可再生但仍要合理使用。","hint":"先把每一項打勾或叉，再計數。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07","A03"],"retry_variants":[{"id":"s04-c08-r1","variant_role":"same_type_new_context","prompt":"天然氣、煤、森林、水、鐵礦 中，請填一項非再生資源。","answer":["天然氣","煤","鐵礦"],"solution":"非再生資源包含天然氣、煤、鐵礦。","verified":true},{"id":"s04-c08-r2","variant_role":"same_concept_different_ask_direction","prompt":"可再生資源就可以任意浪費。此敘述正確或錯誤？","answer":["錯誤"],"solution":"可再生也需要合理使用，污染後仍會造成問題。","verified":true}]},{"id":"s04-c09","level":"challenge","unit":"3-3 珍惜自然資源","question_type_id":"energy-table","prompt":"下列哪一項最適合描述火力發電？A 會排放污染物和二氧化碳、B 一定完全沒有環境限制、C 主要使用沙漠動物、D 會讓外來種自然消失。","answer":["A","會排放污染物和二氧化碳"],"solution":"火力發電利用燃燒煤、石油或天然氣，常見限制是會排放污染物和二氧化碳。","trap":"再生或低污染能源也有條件限制，不是完全沒有影響。","hint":"把發電方式、能源來源和限制配起來。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P03","P07","A05"],"retry_variants":[{"id":"s04-c09-r1","variant_role":"same_type_new_context","prompt":"水力發電的能源來源是什麼？","answer":["水位落差與水流"],"solution":"水力發電主要利用水位落差與水流。","verified":true},{"id":"s04-c09-r2","variant_role":"same_concept_different_ask_direction","prompt":"火力發電的優點是「供電較穩定」嗎？請填：是或否。","answer":["是"],"solution":"火力發電有供電較穩定的優點。","verified":true}]},{"id":"s04-c10","level":"challenge","unit":"3 綜合素養","question_type_id":"reading-reasoning","prompt":"閱讀情境：同學為了愛護動物，把外來寵物放到池塘，幾年後原生魚蝦變少。這些行動或現象主要和哪個問題有關？","answer":["外來入侵種"],"solution":"情境中的關鍵線索是外來寵物野放並壓縮原生生物，所以主要問題是外來入侵種。","trap":"素養題不要只抓單一名詞，要看情境中的原因和結果。","hint":"先圈出行為、污染物或生物變化，再判斷問題。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07"],"retry_variants":[{"id":"s04-c10-r1","variant_role":"same_type_new_context","prompt":"閱讀情境：學校附近 AQI 升高，老師提醒減少戶外劇烈活動，並討論汽機車廢氣和工廠排放。主要問題是什麼？","answer":["空氣汙染"],"solution":"線索是AQI 高和廢氣排放，所以是空氣汙染。","verified":true},{"id":"s04-c10-r2","variant_role":"same_concept_different_ask_direction","prompt":"這題的關鍵線索是「外來寵物野放並壓縮原生生物」嗎？請填：是或否。","answer":["是"],"solution":"判斷外來入侵種時，要抓住外來寵物野放並壓縮原生生物。","verified":true}]}]},{"run_id":"run05","label":"第 5 回","confidence_band":"high_confidence","questions":[{"id":"s05-b01","level":"basic","unit":"3-1 生物生長的環境","question_type_id":"environment-feature","prompt":"哪一種環境通常具有「河川和海洋交界，水位與鹽分變化大」的特徵？請填：沙漠、草原、熱帶雨林、極地、河口溼地或高山。","answer":["河口溼地"],"solution":"河口溼地的典型線索是河川和海洋交界，水位與鹽分變化大，常見例子有彈塗魚、招潮蟹。","trap":"不要把所有魚都歸到海洋；泥灘和鹽分變化常指河口溼地。","hint":"先抓環境壓力，再選環境名稱。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07","A05"],"retry_variants":[{"id":"s05-b01-r1","variant_role":"same_type_new_context","prompt":"看到「全年溫暖潮溼、雨量豐沛，生物種類非常豐富」，最可能是哪一種環境？","answer":["熱帶雨林"],"solution":"熱帶雨林的線索是全年溫暖潮溼、雨量豐沛，生物種類非常豐富。","verified":true},{"id":"s05-b01-r2","variant_role":"same_concept_different_ask_direction","prompt":"河口溼地常見的生物例子包含「彈塗魚、招潮蟹」嗎？請填：是或否。","answer":["是"],"solution":"彈塗魚、招潮蟹可作為河口溼地的代表例子。","verified":true}]},{"id":"s05-b02","level":"basic","unit":"3-1 生物生長的環境","question_type_id":"adaptation-reason","prompt":"彈塗魚的「潮溼皮膚輔助呼吸」主要能幫助它適應什麼？","answer":["適應河口溼地"],"solution":"彈塗魚面對水陸交界的環境壓力，潮溼皮膚輔助呼吸可以適應河口溼地。","trap":"同一種生物可能有多種構造，答題時要看清楚題目問哪一個構造。","hint":"先圈出構造，再想它解決哪個環境壓力。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07"],"retry_variants":[{"id":"s05-b02-r1","variant_role":"same_type_new_context","prompt":"彈塗魚的「身體顏色接近泥地」主要功能是什麼？","answer":["保護色","隱蔽"],"solution":"身體顏色接近泥地可幫助彈塗魚適應水陸交界。","verified":true},{"id":"s05-b02-r2","variant_role":"same_concept_different_ask_direction","prompt":"仙人掌主要面對的環境壓力是什麼？","answer":["缺水"],"solution":"仙人掌的構造和缺水有關。","verified":true}]},{"id":"s05-b03","level":"basic","unit":"3-1 生物生長的環境","question_type_id":"species-habitat","prompt":"水筆仔最適合和哪一種環境或分類配對？請填：河口溼地、極地植物或沙漠。","answer":["河口溼地"],"solution":"水筆仔是河口溼地植物，適合配到河口溼地。","trap":"不要只憑名字猜，要把生物和棲地特徵配起來。","hint":"看到臺灣生物，先想牠是高山、溪流、河口、海洋或森林。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07","A04"],"retry_variants":[{"id":"s05-b03-r1","variant_role":"same_type_new_context","prompt":"臺灣水鹿較適合和哪一種環境配對？","answer":["高山"],"solution":"臺灣水鹿常和高山連在一起考。","verified":true},{"id":"s05-b03-r2","variant_role":"same_concept_different_ask_direction","prompt":"水筆仔比較接近「河口溼地植物」還是「極地植物」？","answer":["河口溼地植物"],"solution":"水筆仔的重點是河口溼地植物。","verified":true}]},{"id":"s05-b04","level":"basic","unit":"3-1 生物生長的環境","question_type_id":"endemic-conservation","prompt":"如果題目說水筆仔「只自然分布在某一地區，其他地方沒有」，這個分類概念稱為什麼？","answer":["特有種"],"solution":"特有種強調自然分布範圍，只出現在某特定地區。","trap":"特有種不一定等於保育類；保育類重點是數量或生存受到威脅，需要保護。","hint":"分清楚：特有種看分布，保育類看保護需求。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P02","P03","P07"],"retry_variants":[{"id":"s05-b04-r1","variant_role":"same_type_new_context","prompt":"「數量稀少或生存受威脅，需要法律保護」比較接近哪個概念？","answer":["保育類"],"solution":"保育類著重保護需求，不是分布範圍。","verified":true},{"id":"s05-b04-r2","variant_role":"same_concept_different_ask_direction","prompt":"只要是特有種，就一定是外來入侵種嗎？請填：是或否。","answer":["否","不是"],"solution":"特有種是原本自然分布在某地的生物，和外來入侵種不同。","verified":true}]},{"id":"s05-b05","level":"basic","unit":"3-1 生物生長的環境","question_type_id":"cold-dry-adaptation","prompt":"若題目說生物有「肥厚的莖」，通常是在適應哪一種環境壓力？","answer":["缺水"],"solution":"肥厚的莖可幫助仙人掌適應缺水。","trap":"不要只背生物名稱，要把構造、功能、環境壓力三者連起來。","hint":"用「構造 -> 功能 -> 環境」三步判斷。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P01","P07","A05"],"retry_variants":[{"id":"s05-b05-r1","variant_role":"same_type_new_context","prompt":"仙人掌的構造可以幫助牠或它適應環境嗎？請填：是或否。","answer":["是"],"solution":"生物的構造常與環境適應有關。","verified":true},{"id":"s05-b05-r2","variant_role":"same_concept_different_ask_direction","prompt":"若環境壓力是水陸交界，彈塗魚的哪個構造有幫助？","answer":["潮溼皮膚輔助呼吸"],"solution":"潮溼皮膚輔助呼吸能幫助彈塗魚適應水陸交界。","verified":true}]},{"id":"s05-b06","level":"basic","unit":"3-1 生物生長的環境","question_type_id":"food-chain-role","prompt":"在「樹葉 → 毛毛蟲 → 小鳥 → 老鷹」中，樹葉能利用陽光製造養分，這個角色稱為什麼？","answer":["生產者"],"solution":"樹葉能行光合作用製造養分，是這條食物鏈的生產者。","trap":"消費者靠吃其他生物取得能量；分解者分解遺骸、枯枝落葉和排泄物。","hint":"看到光合作用和製造養分，就想到生產者。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P03","P07"],"retry_variants":[{"id":"s05-b06-r1","variant_role":"same_type_new_context","prompt":"毛毛蟲吃樹葉取得能量，毛毛蟲通常是什麼者？","answer":["消費者","一級消費者"],"solution":"毛毛蟲吃生產者，所以是消費者。","verified":true},{"id":"s05-b06-r2","variant_role":"same_concept_different_ask_direction","prompt":"真菌分解枯木取得養分，通常稱為什麼者？","answer":["分解者"],"solution":"分解遺骸和枯木的角色是分解者。","verified":true}]},{"id":"s05-b07","level":"basic","unit":"3-2 人類活動對環境的影響","question_type_id":"invasive-definition","prompt":"像紅火蟻這類外來生物若能大量繁殖並造成「攻擊人畜並影響原生昆蟲生存」，稱為什麼？","answer":["外來入侵種","入侵種"],"solution":"外來入侵種的判斷重點是外來、能繁殖，並造成生態或經濟危害。","trap":"不是所有外來種都一定有害；造成威脅才稱外來入侵種。","hint":"用三個條件檢查：外來、繁殖、危害。","verified":true,"verification_status":"high_confidence_source_pattern_verified","source_evidence":["P07"
