  <style>

  <script>
    const BANK = {"project": "bobo-math-graduation-20260528", "scope": "康軒六下第五、六單元", "generated_at": "2026-05-23", "policy": "pre_generated_verified_only", "run_count": 12, "questions_per_run": 24, "retry_variants_per_question": 2, "runs": [{"run_id": "run01", "label": "第 1 回", "questions": [{"id": "r01-b01", "level": "basic", "unit": "5-1 和差問題", "question_type_id": "sumdiff-total-difference-big", "prompt": "六年級兩個社團共有 50 人，甲社團比乙社團多 10 人。甲社團有幾人？", "answer": ["30"], "solution": "甲社團=(50+10)÷2=30。", "trap": "求比較多的一邊，用（和+差）÷2。", "hint": null, "verified": true, "retry_variants": [{"id": "r01-b01-r1", "variant_role": "same_type_new_context", "prompt": "兩班共借書 62 本，六甲比六乙多 12 本。六甲借幾本？", "answer": ["37"], "solution": "(62+12)÷2=37。", "verified": true}, {"id": "r01-b01-r2", "variant_role": "same_concept_different_ask_direction", "prompt": "兩個數的和是 50，差是 10。較小的數是多少？", "answer": ["20"], "solution": "較小的數=(50-10)÷2=20。", "verified": true}]}, {"id": "r01-b02", "level": "basic", "unit": "5-1 和差問題", "question_type_id": "sumdiff-total-difference-small", "prompt": "哥哥和妹妹共有 72 元，哥哥比妹妹多 18 元。妹妹有多少元？", "answer": ["27"], "solution": "妹妹=(72-18)÷2=27。", "trap": "求比較少的一邊，用（和-差）÷2。", "hint": null, "verified": true, "retry_variants": [{"id": "r01-b02-r1", "variant_role": "same_type_new_context", "prompt": "兩條彩帶共長 82 公分，紅彩帶比藍彩帶多 18 公分。藍彩帶長幾公分？", "answer": ["32"], "solution": "(82-18)÷2=32。", "verified": true}, {"id": "r01-b02-r2", "variant_role": "same_concept_different_ask_direction", "prompt": "兩個數的和是 72，差是 18。較大的數是多少？", "answer": ["45"], "solution": "較大的數=(72+18)÷2=45。", "verified": true}]}, {"id": "r01-b03", "level": "basic", "unit": "5-2 年齡問題", "question_type_id": "age-future-multiple", "prompt": "媽媽今年 55 歲，小安今年 11 歲。幾年後，媽媽的年齡會是小安的 3 倍？", "answer": ["11"], "solution": "55+x=3(11+x)，解得 x=11。", "trap": "兩個人都要同時加上 x 年。", "hint": null, "verified": true, "retry_variants": [{"id": "r01-b03-r1", "variant_role": "same_type_new_context", "prompt": "爸爸今年 58 歲，小宇今年 12 歲。幾年後爸爸是小宇的 3 倍？", "answer": ["11"], "solution": "設 x 年後，58+x=3(12+x)。", "verified": true}, {"id": "r01-b03-r2", "variant_role": "same_concept_different_ask_direction", "prompt": "姐姐和弟弟相差 22 歲，今年姐姐是弟弟的 3 倍。弟弟今年幾歲？", "answer": ["11"], "solution": "3 份和 1 份相差 2 份，所以弟弟=11。", "verified": true}]}, {"id": "r01-b04", "level": "basic", "unit": "5-2 年齡問題", "question_type_id": "age-current-multiple-difference", "prompt": "哥哥和妹妹相差 36 歲，今年哥哥的年齡是妹妹的 5 倍。哥哥今年幾歲？", "answer": ["45"], "solution": "相差的是 5-1=4 份，1 份=36÷4=9，哥哥=45。", "trap": "年齡差對應的是倍數差，不是直接除以倍數。", "hint": null, "verified": true, "retry_variants": [{"id": "r01-b04-r1", "variant_role": "same_type_new_context", "prompt": "甲乙相差 44 歲，甲是乙的 5 倍。乙幾歲？", "answer": ["11"], "solution": "乙=差÷4=11。", "verified": true}, {"id": "r01-b04-r2", "variant_role": "same_concept_different_ask_direction", "prompt": "爸爸比孩子大 36 歲，爸爸是孩子的 5 倍。兩人合起來幾歲？", "answer": ["54"], "solution": "孩子=9，爸爸=45，合起來 54。", "verified": true}]}, {"id": "r01-b05", "level": "basic", "unit": "5-3 雞兔問題", "question_type_id": "chicken-total-legs-ask-high", "prompt": "農場裡雞和兔共有 20 隻，共有 62 隻腳。兔有幾隻？", "answer": ["11"], "solution": "假設全是雞有 40 隻腳，差 22；每隻兔多 2 隻腳，所以兔=11。", "trap": "題目問兔，不要填成雞。", "hint": null, "verified": true, "retry_variants": [{"id": "r01-b05-r1", "variant_role": "same_type_new_context", "prompt": "腳踏車和汽車共 23 輛，共 68 個輪子。汽車幾輛？", "answer": ["11"], "solution": "全部先當腳踏車，再用輪子差除以 2。", "verified": true}, {"id": "r01-b05-r2", "variant_role": "same_concept_different_ask_direction", "prompt": "雞兔共 20 隻，兔有 11 隻，雞有幾隻？", "answer": ["9"], "solution": "20-11=9。", "verified": true}]}, {"id": "r01-b06", "level": "basic", "unit": "5-3 雞兔問題", "question_type_id": "chicken-price-total-ask-expensive", "prompt": "點心 A 一份 40 元，點心 B 一份 55 元。共買 21 份，一共 975 元。點心 B 買了幾份？", "answer": ["9"], "solution": "假設全買 A 是 840 元，差 135；每份 B 多 15 元，所以 B=9。", "trap": "用總價差除以單價差。", "hint": null, "verified": true, "retry_variants": [{"id": "r01-b06-r1", "variant_role": "same_type_new_context", "prompt": "兒童票 40 元，成人票 55 元，共 21 張共 975 元。成人 ie-part-to-percent", "prompt": "果園共有 400 平方公尺，其中芒果占 140 平方公尺。芒果占全部的百分之幾？", "answer": ["35", "35%"], "solution": "140÷400=35%。", "trap": "百分率=部分量÷總量。", "hint": null, "verified": true, "retry_variants": [{"id": "r01-b09-r1", "variant_role": "same_type_new_context", "prompt": "六年級共有 400 人，其中 140 人喜歡籃球。占百分之幾？", "answer": ["35", "35%"], "solution": "140÷400=35%。", "verified": true}, {"id": "r01-b09-r2", "variant_role": "same_concept_different_ask_direction", "prompt": "400 的 35% 是多少？", "answer": ["140"], "solution": "400×35%=140。", "verified": true}]}, {"id": "r01-b10", "level": "basic", "unit": "6-1 圓形百分圖", "question_type_id": "percentpie-percent-to-part", "prompt": "全校 360 人投票，喜歡科學展的占 25%。喜歡科學展的約有幾人？", "answer": ["90"], "solution": "360×25%=90。", "trap": "求部分量，用總量×百分率。", "hint": null, "verified": true, "retry_variants": [{"id": "r01-b10-r1", "variant_role": "same_type_new_context", "prompt": "活動清除垃圾 360 公斤，其中塑膠類占 25%。塑膠類約幾公斤？", "answer": ["90"], "solution": "360×25%=90。", "verified": true}, {"id": "r01-b10-r2", "variant_role": "same_concept_different_ask_direction", "prompt": "若 90 人占全部的 25%，全部約有幾人？", "answer": ["360"], "solution": "90÷25%=360。", "verified": true}]}, {"id": "r01-b11", "level": "basic", "unit": "6-2 圓形圖", "question_type_id": "pie-part-to-angle", "prompt": "六年級共有 240 人，喜歡自然的有 120 人。畫成圓形圖時，自然的扇形圓心角是幾度？", "answer": ["180"], "solution": "120÷240×360=180 度。", "trap": "圓形圖全部是 360 度。", "hint": null, "verified": true, "retry_variants": [{"id": "r01-b11-r1", "variant_role": "same_type_new_context", "prompt": "社團共 240 人，美術社 120 人。美術社圓心角幾度？", "answer": ["180"], "solution": "120÷240×360=180。", "verified": true}, {"id": "r01-b11-r2", "variant_role": "same_concept_different_ask_direction", "prompt": "某扇形圓心角 180 度，占全部的百分之幾？", "answer": ["50", "50%"], "solution": "180÷360=50%。", "verified": true}]}, {"id": "r01-b12", "level": "basic", "unit": "6-4 認識可能性", "question_type_id": "probability-same-total-compare", "prompt": "A 疊有 13 張數字牌和 7 張顏色牌，B 疊有 10 張數字牌和 10 張顏色牌，C 疊有 5       let done=0, clean=0, retry=0;
      questions().forEach(q => { const st=get(q.id); if(st.value && st.value.trim()) done++; if(st.checked && st.correct && !st.hinted && !st.shown && !st.tainted) clean++; if(isRetryItem(q)) retry++; });
      document.getElementById("doneCount").textContent=done; document.getElementById("correctCount").textContent=clean; document.getElementById("retryCount").textContent=retry; document.getElementById("totalCount").textContent=questions().length; document.getElementById("progressText").textContent=`${run().label}：精熟 ${clean} / ${questions().length}，再練 ${retry} 題`; document.getElementById("progressBar").style.width=`${Math.round(clean/questions().length*100)}%`;
      maybeNotifyCompletion(done, clean, retry);
    }
    document.getElementById("retryMode").addEventListener("click", () => { filter = filter === "retry" ? "all" : "retry"; reportBox.classList.remove("show"); renderAll(true); });
    document.getElementById("checkAll").addEventListener("click", () => document.querySelectorAll(".q[data-id]").forEach(card => card.querySelector('[data-action="check"]')?.click()));
    document.getElementById("resetRun").addEventListener("click", () => {
      if(!confirm("確定清除本回填寫內容嗎？看過提示、詳解或答錯的紀錄會保留，不能用重來躲過再練。")) return;
      Object.keys(state).filter(k => k.startsWith(activeRunId + ":")).forEach(k => {
        const item = state[k];
        const isMeta = k.includes(":_meta:");
        const isRetryDetail = k.split(":").length > 2 && !isMeta;
        if(isMeta || isRetryDetail){ delete state[k]; return; }
        if(item && (item.tainted || item.hinted || item.shown || item.retryReason)){
          state[k] = {tainted:true, hinted:!!item.hinted, shown:!!item.shown, retryReason:item.retryReason || retryReasonFor(item)};
        } else {
          delete state[k];
        }
      });
      saveState(); reportBox.classList.remove("show"); renderAll();
    });
    document.getElementById("printPage").addEventListener("click", () => window.print());
    async function sendTgMessage(text){
      if(!NOTIFY_ENDPOINT || NOTIFY_ENDPOINT.includes("YOUR_WORKER")) return false;
      try {
        const res = await fetch(NOTIFY_ENDPOINT, {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({text, source:"bobo-math-graduation", student:"Bobo"})
        });
        return res.ok;
      } catch(error) {
        console.warn("Telegram notification failed", error);
        return false;
      }
    }
    function retrySources(){
      return questions().filter(q => isRetryItem(q));
    }
    function retryFlowDone(q){
      const original = get(`${q.id}:${q.id}`);
      const variants = q.retry_variants.map(v => get(`${q.id}:${v.id}`));
      return original.checked && original.correct && variants.every(v => v.checked && v.correct);
    }
    function runSummary(){
      const retryItems = retrySources();
      const clean = questions().filter(q => { const st=get(q.id); return st.checked && st.correct && !st.hinted && !st.shown && !st.tainted; }).length;
      const attempted = questions().filter(q => get(q.id).checked).length;
      return { attempted, clean, retryCount: retryItems.length, retryItems };
    }
    function runProgressText(){
      const currentIndex = BANK.runs.findIndex(r => r.run_id === activeRunId) + 1;
      const completedNow = BANK.runs.filter(r => runCompleteForRawState(r)).length;
      const currentWillComplete = runComplete(run()) ? 1 : 0;
      const completed = Math.max(completedNow, currentIndex && runComplete(run()) ? currentIndex : completedNow);
      const remaining = Math.max(0, BANK.runs.length - completed);
      return `目前回合：第 ${currentIndex} / ${BANK.runs.length} 回\n剩餘未完成：${remaining} 回`;
    }
    function maybeNotifyCompletion(done, clean, retry){
      const attempted = questions().filter(q => get(q.id).checked).length;
      if(attempted === questions().length && !meta("run_attempted_sent")){
        setMeta("run_attempted_sent", true);
        const summary = runSummary();
        const retryLines = summary.retryItems.map((q, index) => {
          const st = get(q.id);
          const reason = retryReasonFor(st);
          return `${index + 1}. ${q.unit}｜${reason}\n${q.prompt}\n正解：${q.answer[0]}`;
        }).join("\n\n");
        sendTgMessage(`Bobo 數學完成一回練習\n${runProgressText()}\n回合：${run().label}\n範圍：康軒六下第五、六單元\n本回題數：${questions().length}\n未提示答對：${summary.clean}\n需補洞：${summary.retryCount}\n\n錯題/待補洞清單：\n${retryLines || "沒有錯題，今日練習完成。"}\n\n${summary.retryCount ? "請完成網頁的「再練」補洞。" : ""}`);
        if(!summary.retryCount && !meta("daily_complete_sent")){
          setMeta("daily_complete_sent", true);
          sendTgMessage(`Bobo 今日數學練習完成\n${runProgressText()}\n回合：${run().label}\n狀態：沒有待補洞題。`);
        }
      }
      const sources = retrySources();
      if(sources.length && sources.every(retryFlowDone) && !meta("retry_complete_sent")){
        setMeta("retry_complete_sent", true);
        setMeta("daily_complete_sent", true);
        sendTgMessage(`Bobo 錯題補洞完成\n${runProgressText()}\n回合：${run().label}\n完成補洞題組：${sources.length} 組\n每組已完成：原錯題 + 補洞題 1 + 補洞題 2\n今日數學練習完成。`);
      }
      if(advanceRunIfNeeded()) renderAll();
    }
    function buildReport(){
      const lines=["Bobo 數學畢業考練習回報",`回合：${run().label}`,`時間：${new Date().toLocaleString("zh-TW")}`,""];
      [...new Set(questions().map(q => q.unit))].forEach(unit => {
        const qs=questions().filter(q => q.unit===unit);
        const clean=qs.filter(q => {const st=get(q.id); return st.checked && st.correct && !st.hinted && !st.shown && !st.tainted;}).length;
        const retry=qs.filter(q => isRetryItem(q)).length;
        lines.push(`${unit}：精熟 ${clean}/${qs.length}，再練 ${retry}`);
      });
      const retryItems=questions().filter(q => isRetryItem(q)).map(q => {const st=get(q.id); const reason=retryReasonFor(st); return `- ${q.unit}｜${reason}｜${q.prompt}`;});
      lines.push("","待補洞：",retryItems.join("\n") || "目前沒有待補洞題。","", "再練規則：每題會安排原錯題 + 補洞題 1 + 補洞題 2。");
      return lines.join("\n");
    }
    renderAll();
  </script>
</body>
</html>
