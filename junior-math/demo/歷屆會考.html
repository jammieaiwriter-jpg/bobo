<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bobo 數學任務</title>
  <link rel="stylesheet" href="../app.css">
</head>
<body data-page="practice" data-demo-mode="past_exam"><div class="demo-ribbon">本機示範：歷屆會考</div>
  <main class="shell practice-shell">
    <header class="practice-header"><a class="back-link" href="../index.html">‹ 回入口</a><span id="practice-mode" class="mode-label"></span><span id="practice-progress" class="progress-label"></span></header>
    <section id="practice-error" class="message-card is-hidden"></section>
    <section id="start-screen" class="start-screen is-hidden"><p class="eyebrow">任務已準備</p><h1 id="start-title"></h1><p id="start-scope"></p><div id="start-meta" class="meta-row"></div><button id="start-button" class="primary-button">開始</button></section>
    <section id="question-screen" class="question-screen is-hidden">
      <div class="question-meta"><span id="question-source" class="source-pill"></span><span id="question-unit" class="unit-pill"></span><span id="question-difficulty" class="difficulty-pill"></span></div>
      <article class="question-card"><div id="question-text" class="question-text"></div><img id="question-image" class="question-image is-hidden" alt="題目圖形"></article>
      <div id="options" class="options" role="group" aria-label="答案選項"></div>
      <div id="assist-panel" class="assist-panel is-hidden"><p class="assist-heading">需要一點幫忙？</p><div class="assist-buttons"><button data-assist="conceptOpened">觀念</button><button data-assist="hintOpened">提示</button><button data-assist="solutionViewed">完整解法／看答案</button></div><div id="assist-content" class="assist-content is-hidden"></div></div>
      <div id="exam-nav" class="exam-nav is-hidden"><button id="prev-button" class="secondary-button">上一題</button><button id="mark-button" class="secondary-button">標記再檢查</button><button id="next-button" class="secondary-button">下一題</button></div>
      <div id="answer-status" class="answer-status is-hidden" aria-live="polite"></div>
      <button id="submit-button" class="primary-button">送出答案</button>
      <p id="submit-note" class="inline-note"></p>
    </section>
    <section id="result-screen" class="result-screen is-hidden"><p class="eyebrow">本回合完成</p><h1 id="result-title"></h1><div id="result-summary" class="result-summary"></div><div id="result-details" class="result-details"></div><a class="primary-button button-link" href="../index.html">重新練一份</a></section>
  </main>
  <script src="../qdata/unit_catalog.js"></script>
  <script src="../qdata/generated_items.js"></script>
  <script src="../qdata/cap_items.js"></script>
  <script src="../qdata/content_support.js"></script>
  <script src="../app.js"></script>
</body>
</html>
