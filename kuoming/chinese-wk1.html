function maskMeaning(d){
  let m=d.m,idm=d.i;
  for(let len=4;len>=2;len--)for(let st=0;st+len<=idm.length;st++){
    const f=idm.substr(st,len);
    if(f.indexOf("一")===0&&len===2)continue;
    if(m.includes(f))m=m.split(f).join("□".repeat(len));
  }
  idm.split("").forEach(c=>{if(!KEEP.has(c)&&m.includes(c))m=m.split(c).join("□")});
  return m;
}
function similarIdioms(d,n){
  const key=new Set(d.i.slice(1).split(""));
  const tiers={};
  DATA.forEach(x=>{if(x.i===d.i)return;let sc=0;x.i.slice(1).split("").forEach(c=>{if(key.has(c))sc++});(tiers[sc]=tiers[sc]||[]).push(x)});
  const out=[];
  Object.keys(tiers).map(Number).sort((a,b)=>b-a).forEach(sc=>{if(out.length<n)out.push(...shuffle(tiers[sc]).slice(0,n-out.length))});
  return out.slice(0,n);
}
function typoVariants(d,n){
  const ch=d.i.split("");
  const spots=ch.map((c,i)=>({c,i})).filter(o=>CONF[o.c]&&CONF[o.c].length>=3);
  if(!spots.length)return[];
  const out=[],used=new Set();
  shuffle(spots).forEach(sp=>shuffle(CONF[sp.c]).forEach(rep=>{
    if(out.length>=n)return;
    const v=ch.slice();v[sp.i]=rep;const str=v.join("");
    if(str!==d.i&&!used.has(str)){used.add(str);out.push(str)}
  }));
  return out.slice(0,n);
}
function fillDistractors(d,idx,right){
  const same=[...new Set(DATA.filter(x=>x.i.length===d.i.length&&x.i!==d.i).map(x=>x.i[idx]).filter(c=>c&&c!==right))];
  const conf=(CONF[right]||[]).filter(c=>c!==right);
  const out=[];
  shuffle(same).forEach(c=>{if(out.length<2&&!out.includes(c))out.push(c)});
  shuffle(conf).forEach(c=>{if(out.length<3&&!out.includes(c))out.push(c)});
  shuffle(same).forEach(c=>{if(out.length<3&&!out.includes(c))out.push(c)});
  pick(ALLCH,3,right).forEach(c=>{if(out.length<3&&!out.includes(c))out.push(c)});
  return out.slice(0,3);
}
function qCY(d,type){
  const TIERS={1:["m2i","i2m"],2:["fill","typo","rel","fill","m2i"],3:["cloze","cloze","cloze","rel","typo","fill"]};
  let pool=(TIERS[Math.min(dayNo(),3)]||TIERS[3]).slice();
  if(!typoVariants(d,3).length)pool=pool.filter(x=>x!=="typo");
  if(!(splitRel(d.n).length&&splitRel(d.f).length))pool=pool.filter(x=>x!=="rel");
  if(!EX[d.i])pool=pool.filter(x=>x!=="cloze");
  if(!pool.length)pool=["i2m"];
  const m=type||pool[Math.floor(Math.random()*pool.length)];
  const NOTE=`<div style="font-size:12px;color:#a89a7c;margin-top:8px">□ 代表被遮住的字</div>`;
  if(m==="cloze")return{label:"應 用 · 選 出 最 適 合 的 成 語",
    html:`<span style="font-size:18px;line-height:2">${EX[d.i].replace("______",'<span class="blank" style="min-width:5em">？</span>')}</span>`,
    opts:shuffle([d.i,...similarIdioms(d,3).map(x=>x.i)]),ans:d.i,cls:""};
  if(m==="m2i")return{label:"看 釋 義 · 選 成 語",html:maskMeaning(d)+NOTE,
    opts:shuffle([d.i,...similarIdioms(d,3).map(x=>x.i)]),ans:d.i,cls:""};
  if(m==="i2m"){
    const a=maskMeaning(d),o=similarIdioms(d,3).map(x=>maskMeaning(x)).filter(x=>x!==a);
    return{label:"看 成 語 · 選 釋 義",
      html:`<span class="big">${d.i}</span>`+(d.z?`<span style="font-size:13px;color:var(--accent2)">${d.z}</span>`:"")+NOTE,
      opts:shuffle([a,...o]),ans:a,cls:""};
  }
  if(m==="typo")return{label:"錯 別 字 · 選 出 完 全 正 確 的",
    html:`<span style="font-size:15px;color:var(--ink2)">${maskMeaning(d)}</span>`,
    opts:shuffle([d.i,...typoVariants(d,3)]),ans:d.i,cls:"char2"};
  if(m==="rel"){
    const near=Math.random()<0.5;
    const right=splitRel(near?d.n:d.f),trap=splitRel(near?d.f:d.n);
    const ans=right[Math.floor(Math.random()*right.length)];
    let dis=shuffle(trap).slice(0,3);
    if(dis.length<3){const bad=new Set([...right,...trap,d.i]);
      dis=dis.concat(shuffle(REL_POOL.filter(x=>!bad.has(x))).slice(0,3-dis.length))}
    return{label:near?"下 列 何 者 與 它 意 思 相 近":"下 列 何 者 與 它 意 思 相 反",
      html:`<span class="big">${d.i}</span><span style="font-size:13px;color:var(--ink2)">${maskMeaning(d)}</span>`,
      opts:shuffle([ans,...dis]),ans:ans,cls:""};
  }
  const ch=d.i.split("");
  const tricky=ch.map((c,i)=>({c,i})).filter(o=>CONF[o.c]&&CONF[o.c].length>=3);
  if(tricky.length>=2&&Math.random()<0.45){
    const two=shuffle(tricky).slice(0,2).sort((a,b)=>a.i-b.i);
    const shown=ch.map((c,k)=>two.some(o=>o.i===k)?'<span class="blank">？</span>':c).join("");
    const right=two.map(o=>o.c).join("");
    const set=new Set([right]);let guard=0;
    while(set.size<4&&guard++<40){
      const a=Math.random()<0.5?two[0].c:pick(CONF[two[0].c],1)[0];
      const b=Math.random()<0.5?two[1].c:pick(CONF[two[1].c],1)[0];
      set.add(a+b);
    }
    return{label:"填 空 · 選 出 正 確 的 兩 個 字",
      html:`<span class="big">${shown}</span><span style="font-size:14px;color:var(--ink2)">${maskMeaning(d)}</span>`,
      opts:shuffle([...set]),ans:right,cls:"char2"};
  }
  const sel=tricky.length?tricky[Math.floor(Math.random()*tricky.length)]:{c:ch[Math.floor(Math.random()*ch.length)],i:-1};
  const idx=sel.i>=0?sel.i:ch.indexOf(sel.c);
  const shown=ch.map((c,k)=>k===idx?'<span class="blank">？</span>':c).join("");
  return{label:"填 空 · 選 出 正 確 的 字",
    html:`<span class="big">${shown}</span><span style="font-size:14px;color:var(--ink2)">${maskMeaning(d)}</span>`,
    opts:shuffle([sel.c,...fillDistractors(d,idx,sel.c)]),ans:sel.c,cls:"char"};
}

/* ══ 文言文出題 ══ */
const ALL_W=[];WY.forEach(L=>L.w.forEach(w=>ALL_W.push(w)));
/* 跨課同字異義（例：懷橘＝藏著／懷璧＝持有）*/
const SAMECH={};
WY.forEach((L,li)=>L.w.forEach(w=>{(SAMECH[w[0]]=SAMECH[w[0]]||[]).push({L,w})}));

function qWY(it){
  const [ch,ctx,ans,dis]=it.w;
  const day=Math.min(dayNo(),3);
  const head=`<span style="font-size:13px;color:var(--ink2)">〈${it.L.t}〉</span>`;
  const fill=n=>{let o=[ans,...dis];
    if(o.length<n){const pool=ALL_W.filter(w=>w[0]!==ch).flatMap(w=>[w[2],...w[3]]).filter(x=>!o.includes(x));
      o=o.concat(shuffle([...new Set(pool)]).slice(0,n-o.length))}
    return o.slice(0,n)};

  const forward=()=>({label:"文 言 字 義 · 音 義 推 敲",
    html:head+`<span class="src">${ctx}</span>`+
         `<span style="font-size:14px;color:var(--ink2)">「${ch}」在這裡是什麼意思？</span>`,
    opts:shuffle(fill(4)),ans:ans,cls:""});

  // D2-a 反向：原文挖字
  const blank=()=>{
    const shown=ctx.replace("「"+ch+"」",'<span class="blank">？</span>');
    const others=[...new Set(ALL_W.map(w=>w[0]).filter(c=>c!==ch))];
    return{label:"文 言 字 義 · 原 文 填 空",
      html:head+`<span class="src">${shown}</span>`+
           `<span style="font-size:14px;color:var(--ink2)">空格應填哪個字？（此處作「${ans}」解）</span>`,
      opts:shuffle([ch,...shuffle(others).slice(0,3)]),ans:ch,cls:"char"};
  };
  // D2-b 給義選字
  const rev=()=>{
    const others=[...new Set(ALL_W.filter(w=>w[0]!==ch&&w[2]!==ans).map(w=>w[0]))];
    return{label:"文 言 字 義 · 由 義 找 字",
      html:head+`<span style="font-size:15px">在本課中，表示「<b>${ans}</b>」的是哪一個字？</span>`+
           `<div style="font-size:13px;color:var(--ink2);margin-top:6px">${ctx}</div>`,
      opts:shuffle([ch,...shuffle(others).slice(0,3)]),ans:ch,cls:"char"};
  };
  // D3-a 同字異義辨析
  const cross=()=>{
    const pair=SAMECH[ch].filter(x=>x.L.t!==it.L.t)[0];
    const same=Math.random()<0.5;
    return{label:"文 言 字 義 · 同 字 異 義 辨 析",leftAlign:true,
      html:`「${ch}」字在下列兩句中的意思：<br>`+
           `（甲）〈${it.L.t}〉${ctx}<br>（乙）〈${pair.L.t}〉${pair.w[1]}<br>`+
           `<span style="font-size:14px;color:var(--ink2)">下列敘述何者正確？</span>`,
      opts:shuffle([`甲作「${ans}」解，乙作「${pair.w[2]}」解`,
                    `甲乙皆作「${ans}」解`,
                    `甲乙皆作「${pair.w[2]}」解`,
                    `甲作「${pair.w[2]}」解，乙作「${ans}」解`]),
      ans:`甲作「${ans}」解，乙作「${pair.w[2]}」解`,cls:""};
  };
  // D3-b 配對找錯
  const mismatch=()=>{
    const pool=shuffle(ALL_W.filter(w=>w[0]!==ch)).slice(0,3);
    const wrongGloss=shuffle(ALL_W.filter(w=>w[2]!==ans).map(w=>w[2]))[0];
    const bad=`${ctx}　→　「${ch}」＝${wrongGloss}`;
    const good=pool.map(w=>`${w[1]}　→　「${w[0]}」＝${w[2]}`);
    return{label:"文 言 字 義 · 選 出 配 對 錯 誤 的",leftAlign:true,
      html:`<span style="font-size:15px">下列字義配對，何者<b>錯誤</b>？</span>`,
      opts:shuffle([bad,...good]),ans:bad,cls:""};
  };

  let bag;
  if(day===1)bag=[forward];
  else if(day===2)bag=[blank,rev,forward];
  else{bag=[mismatch,mismatch,blank,rev];
       if(SAMECH[ch].length>1)bag=[cross,cross,mismatch,blank];}
  return bag[Math.floor(Math.random()*bag.length)]();
}
function qWK(it){
  const L=it.L,day=Math.min(dayNo(),3),others=WY.filter(x=>x.t!==L.t);
  const src=()=>({label:"文 學 常 識 · 出 處",
    html:`<span class="src">〈${L.t}〉</span><span style="font-size:14px;color:var(--ink2)">這一課出自哪一部作品？</span>`,
    opts:shuffle([L.src,...shuffle(others).slice(0,3).map(x=>x.src)]),ans:L.src,cls:""});
  const au=()=>{const me=L.dy+"·"+L.au;
    return{label:"文 學 常 識 · 作 者 朝 代",
      html:`<span class="src">〈${L.t}〉</span><span style="font-size:14px;color:var(--ink2)">作者與朝代是？</span>`,
      opts:shuffle([me,...shuffle(others).slice(0,3).map(x=>x.dy+"·"+x.au)]),ans:me,cls:""}};
  // D2 主旨句配對
  const gist=()=>({label:"文 學 常 識 · 主 旨 句 配 對",leftAlign:true,
    html:`<span class="src" style="font-size:22px">〈${L.t}〉</span>`+
         `<span style="font-size:14px;color:var(--ink2)">這一課的主旨句是下列何者？</span>`,
    opts:shuffle([L.gist,...shuffle(others).slice(0,3).map(x=>x.gist)]),ans:L.gist,cls:""});
  // D2 反向：由主旨找課
  const which=()=>({label:"文 學 常 識 · 由 主 旨 找 課 次",leftAlign:true,
    html:`<span style="font-size:16px">「${L.gist}」</span>`+
         `<div style="font-size:14px;color:var(--ink2);margin-top:8px">這是哪一課的主旨？</div>`,
    opts:shuffle([L.t,...shuffle(others).slice(0,3).map(x=>x.t)]),ans:L.t,cls:""});
  // D3 課次×作者×出處 混搭辨析
  const mix=()=>{
    const good=`〈${L.t}〉—— ${L.dy}·${L.au}《${L.src.replace(/[《》]/g,"")}》`;
    const bad=shuffle(others).slice(0,3).map((x,i)=>{
      const w=others.filter(y=>y.t!==x.t)[i%Math.max(1,others.length-1)]||L;
      return `〈${x.t}〉—— ${w.dy}·${w.au}《${x.src.replace(/[《》]/g,"")}》`;
    });
    return{label:"文 學 常 識 · 選 出 正 確 的 一 組",leftAlign:true,
      html:`<span style="font-size:15px">下列「課次 —— 朝代·作者·出處」的配對，何者<b>完全正確</b>？</span>`,
      opts:shuffle([good,...new Set(bad)].slice(0,4)),ans:good,cls:""};
  };
  let bag;
  if(day===1)bag=[src,au];
  else if(day===2)bag=[gist,which,src];
  else bag=[mix,mix,gist,au];
  return bag[Math.floor(Math.random()*bag.length)]();
}
function qWT(it){
  const [li,stem,opts,an]=it.t;
  return{label:"課 內 閱 讀 測 驗",leftAlign:true,
    html:`<span style="font-size:13px;color:var(--ink2)">〈${WY[li].t}〉</span><br>${stem}`,
    opts:["A","B","C","D"].filter(k=>opts[k]).map(k=>`<span class="lab">(${k})</span>`+esc(opts[k])),
    ans:`<span class="lab">(${an})</span>`+esc(opts[an]),cls:"",html_opts:true};
}
/* 會考真題 */
function qCAP(c){
  const keys=["A","B","C","D"].filter(k=>c.op[k]);
  const notes=[...(c.gn||[]),...(c.nt||[])];
  return{label:`會 考 真 題 · ${c.df||"未分級"}`,leftAlign:true,
    meta:`${c.y} 年 第 ${c.n} 題${c.pr!=null?"　·　全國通過率 "+Math.round(c.pr*100)+"%":""}`,
    ctx:(c.gc?`<div class="ctx">${c.gi?`<div class="gi">${esc(c.gi)}</div>`:""}${esc(c.gc).replace(/\n/g,"<br>")}</div>`:"")+
        (notes.length?`<div class="gloss">${notes.map(x=>"註："+esc(x)).join("<br>")}</div>`:""),
    html:esc(c.st).replace(/\n/g,"<br>"),
    opts:keys.map(k=>`<span class="lab">(${k})</span>`+esc(c.op[k])),
    ans:`<span class="lab">(${c.an})</span>`+esc(c.op[c.an]),cls:"",html_opts:true};
}

function makeQ(it){
  if(it.kind==="cy")return Object.assign({it},qCY(it.d));
  if(it.kind==="wy")return Object.assign({it},qWY(it));
  if(it.kind==="wk")return Object.assign({it},qWK(it));
  return Object.assign({it},qWT(it));
}

/* ══ 答錯攤開的卡 ══ */
function cardHTML(it){
  if(it.kind==="cy"){const d=it.d;
    return `<div class="fcard">`+(d.z?`<div class="fz">${d.z}</div>`:"")+
      `<div class="fm"><b>${d.i}</b>　${d.m}</div>`+
      (d.n?`<div class="fr"><span>近義</span>${d.n}</div>`:"")+
      (d.f?`<div class="fr"><span>反義</span>${d.f}</div>`:"")+
      (d.t?`<div class="ft">⚠️ ${d.t}</div>`:"")+`</div>`;
  }
  const L=it.L||WY[it.t?it.t[0]:0];
  let extra="";
  if(it.kind==="wy")extra=`<div class="fm"><b>${it.w[1]}</b>　「${it.w[0]}」＝${it.w[2]}</div>`;
  return `<div class="fcard">`+
    `<div class="fz">${L.dy}·${L.au}　${L.src}　（p.${L.p}）</div>`+
    extra+
    `<div class="fm">${L.note}</div>`+
    `<div class="fr"><span>主旨</span>${L.gist}</div>`+
    (L.kw?`<div class="ft">💡 ${L.kw}</div>`:"")+`</div>`;
}
function capCardHTML(c){
  return `<div class="fcard"><div class="fz">${c.y} 年會考 第 ${c.n} 題　${c.df||""}${c.pr!=null?"　通過率 "+Math.round(c.pr*100)+"%":""}</div>`+
    `<div class="fm">正解：<b>(${c.an})</b> ${esc(c.op[c.an])}</div>`+
    `<div class="ft">💡 這是會考真題，答錯很正常。把選項一個一個對回原文，想清楚為什麼其他三個不行。</div></div>`;
}

/* ══ 強制閱讀 ══ */
let readTimer=null;const READ_SEC=6;
function forceRead(){
  const b=$("#nx");b.classList.remove("hide");b.disabled=true;
  let sec=READ_SEC;
  const tick=()=>{
    if(sec<=0){b.disabled=false;b.textContent="我讀完了，下一題 →";readTimer=null;return}
    b.textContent=`請先把卡片讀完…（${sec}）`;sec--;readTimer=setTimeout(tick,1000);
  };tick();
}

/* ══ 主流程 ══ */
let mode="run",cur=null,locked=false,lastDrill=null;
const DRILL_PASS=2;
const drillPool=()=>S.everWrong.filter(x=>(S.drill[x]||0)<DRILL_PASS);
const capPool=()=>CAP.filter(c=>!(S.capDone||[]).includes(c.id));

function nextQ(){
  if(readTimer){clearTimeout(readTimer);readTimer=null}
  locked=false;$("#fb").className="fb";
  $("#nx").classList.add("hide");$("#nx").disabled=false;
  $("#qctx").innerHTML="";$("#qt").className="qtext";
  if(mode==="cap"){
    const pool=capPool();
    if(!pool.length){paintNone();show("none");return}
    // 先基礎 → 進階 → 挑戰
    const rank={"基礎":0,"進階":1,"挑戰":2};
    const best=Math.min(...pool.map(c=>rank[c.df]!=null?rank[c.df]:3));
    const tierPool=pool.filter(c=>(rank[c.df]!=null?rank[c.df]:3)===best);
    cur=qCAP(tierPool[Math.floor(Math.random()*tierPool.length)]);
    cur.capItem=tierPool.find(c=>`<span class="lab">(${c.an})</span>`+esc(c.op[c.an])===cur.ans)||null;
    $("#qr").textContent=`已完成 ${(S.capDone||[]).length}/149`;
  }else if(mode==="run"){
    if(!S.queue.length){finishRound();return}
    cur=makeQ(BY[S.queue[0]]);
    $("#qr").textContent=`還剩 ${S.queue.length} 題`;
  }else{
    const pool=drillPool();
    if(!pool.length){paintNone();show("none");return}
    let cand=pool.filter(x=>x!==lastDrill);if(!cand.length)cand=pool;
    const id=cand[Math.floor(Math.random()*cand.length)];lastDrill=id;
    cur=makeQ(BY[id]);
    const need=pool.reduce((a,x)=>a+(DRILL_PASS-(S.drill[x]||0)),0);
    $("#qr").textContent=`待畢業 ${pool.length} 題 · 還需答對 ${need} 次`;
  }
  $("#ql").textContent=cur.label;
  if(cur.ctx)$("#qctx").innerHTML=cur.ctx;
  $("#qt").innerHTML=cur.html+(cur.meta?`<div class="qmeta">${cur.meta}</div>`:"");
  if(cur.leftAlign)$("#qt").className="qtext left";
  const box=$("#op");box.innerHTML="";
  cur.opts.forEach(o=>{
    const b=document.createElement("button");
    b.className="opt "+(cur.cls||"");
    if(cur.html_opts)b.innerHTML=o;else b.textContent=o;
    b.dataset.v=o;
    b.onclick=()=>answer(b,o);box.appendChild(b);
  });
}

function answer(btn,val){
  if(locked)return;locked=true;
  const ok=(val===cur.ans);
  S.tt++;if(ok)S.sc++;
  document.querySelectorAll(".opt").forEach(b=>{
    b.disabled=true;
    if(b.dataset.v===cur.ans)b.classList.add("right");
    else if(b===btn)b.classList.add("wrong");
  });
  const fb=$("#fb");
  if(mode==="cap"){
    const c=cur.capItem;
    if(ok){
      if(c&&!(S.capDone||[]).includes(c.id)){S.capDone=S.capDone||[];S.capDone.push(c.id)}
      fb.className="fb show good";
      fb.innerHTML=`<span class="fi">✓ 答對</span>${cur.ans}`+
        `<div class="again">已完成 ${(S.capDone||[]).length}/149</div>`;
      save();paint();
      $("#nx").classList.remove("hide");$("#nx").disabled=false;$("#nx").textContent="下一題 →";
    }else{
      fb.className="fb show no";
      fb.innerHTML=`<span class="fi">✗ 答錯</span>`+(c?capCardHTML(c):"")+
        `<div class="readnote">📖 讀完再繼續（這題會再出現）</div>`;
      save();paint();forceRead();
    }
    return;
  }
  const it=cur.it,id=it.id;
  if(ok){
    S.queue=S.queue.filter(x=>x!==id);
    S.wrong=S.wrong.filter(x=>x!==id);
    if(!S.cleared.includes(id))S.cleared.push(id);
    if(mode==="wrong"&&S.everWrong.includes(id))S.drill[id]=(S.drill[id]||0)+1;
    fb.className="fb show good";
    fb.innerHTML=`<span class="fi">✓ 答對</span>`+
      (it.kind==="cy"?`${it.d.i}　${it.d.m}`:`${cur.ans}`)+
      (mode==="run"?`<div class="again">🏅 過關！還剩 ${S.queue.length} 題</div>`
        :(S.everWrong.includes(id)?((S.drill[id]||0)>=DRILL_PASS
            ?`<div class="again">🎓 這題畢業了！剩 ${drillPool().length} 題</div>`
            :`<div class="again">再答對 ${DRILL_PASS-(S.drill[id]||0)} 次就畢業</div>`):""));
    save();paint();
    $("#nx").classList.remove("hide");$("#nx").disabled=false;
    $("#nx").textContent=(mode==="run"&&!S.queue.length)?"🏆 看成果 →":"下一題 →";
  }else{
    if(mode==="run"){S.queue=S.queue.filter(x=>x!==id);S.queue.push(id);S.cleared=S.cleared.filter(x=>x!==id)}
    if(!S.wrong.includes(id))S.wrong.push(id);
    if(!S.everWrong.includes(id))S.everWrong.push(id);
    S.drill[id]=0;
    fb.className="fb show no";
    fb.innerHTML=`<span class="fi">✗ 正解：</span>${cur.ans}`+cardHTML(it)+
      `<div class="again">↩︎ 這題排到最後，等一下會再考你一次</div>`+
      `<div class="readnote">📖 讀完這張卡才能繼續</div>`;
    save();paint();forceRead();
  }
}

/* ══ 完成與通知 ══ */
function finishRound(){
  show("done");
  const pc=S.tt?Math.round(S.sc/S.tt*100):0;
  $("#d-tt").textContent=S.tt;$("#d-pc").textContent=pc+"%";$("#d-wr").textContent=S.everWrong.length;
  const t=$("#d-tough");
  if(S.everWrong.length){
    t.classList.remove("hide");
    t.innerHTML="<b>⚠️ 這幾題曾經答錯，考前再看一次：</b>"+
      S.everWrong.map(id=>{const x=BY[id];if(!x)return"";
        return `<i>${x.kind==="cy"?x.d.i:(x.kind==="wy"?x.L.t+"「"+x.w[0]+"」":(x.kind==="wk"?x.L.t+"·常識":WY[x.t[0]].t+"·閱讀"))}</i>`}).join("");
  }else t.classList.add("hide");
  if(!S.history)S.history=[];
  if(!S.history.includes(TODAY)){S.history.push(TODAY);save()}
  const nb=$("#d-notify");
  if(S.notified===TODAY){nb.className="notify sent";nb.textContent="✓ 今天的完成通知已經傳給媽媽了";return}
  nb.className="notify wait";nb.textContent="📨 正在通知媽媽…";
  const dt=new Date();
  const cyW=S.everWrong.filter(x=>x.startsWith("cy:")).map(x=>BY[x].d.i);
  const wyW=S.everWrong.filter(x=>!x.startsWith("cy:")).map(x=>{const y=BY[x];
    return y.kind==="wy"?y.L.t+"「"+y.w[0]+"」":(y.kind==="wk"?y.L.t+"·常識":WY[y.t[0]].t+"·閱讀")});
  const msg=
    `📚 Bobo 完成今日國文闖關\n`+
    `${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,"0")}:${String(dt.getMinutes()).padStart(2,"0")}\n`+
    `關卡：${tierLabel()}\n`+
    `範圍：成語 p.20–29 ＋ 文言文 p.14–25（共 ${N} 題）\n`+
    `── 全部過關 ✓\n`+
    `作答 ${S.tt} 題 · 一次答對率 ${pc}%\n`+
    (S.everWrong.length?`曾答錯 ${S.everWrong.length} 題：\n`+
       (cyW.length?`· 成語：${cyW.join("、")}\n`:"")+
       (wyW.length?`· 文言文：${wyW.join("、")}\n`:""):`全部一次就對，零失誤 👏\n`)+
    `會考文言累計：${(S.capDone||[]).length}/149`;
  fetch(NOTIFY_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:msg})})
    .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);S.notified=TODAY;save();
      nb.className="notify sent";nb.textContent="✓ 已通知媽媽"})
    .catch(e=>{nb.className="notify fail";
      nb.innerHTML="⚠️ 通知沒送出去（"+e.message+"）<br><span style='font-size:12px'>把結果截圖給媽媽即可</span>"});
}

/* ══ 速記卡 ══ */
let scope="cy";
function buildFilters(){
  const f=$("#pf");f.innerHTML="";
  [["cy","成語 49 則"],["wy","文言文 6 課"]].forEach(([v,label])=>{
    const b=document.createElement("button");
    b.textContent=label;b.className=(v===scope)?"on":"";
    b.onclick=()=>{scope=v;buildFilters();buildGrid()};
    f.appendChild(b);
  });
}
function buildGrid(){
  const g=$("#grid");g.innerHTML="";
  if(scope==="cy"){
    DATA.forEach(d=>{
      const done=S.cleared.includes("cy:"+d.i);
      const c=document.createElement("div");c.className="card"+(done?" cleared":"");
      c.innerHTML=`<div class="idm"><span class="pg">p.${d.p}${done?" ✓":""}</span>${d.i}</div>`+
        (d.z?`<div class="zy">${d.z}</div>`:"")+
        `<div class="body"><div class="mean">${d.m}</div>`+
        (d.n?`<div class="rel"><span>近義</span>${d.n}</div>`:"")+
        (d.f?`<div class="rel"><span>反義</span>${d.f}</div>`:"")+
        (d.t?`<div class="tip">⚠️ ${d.t}</div>`:"")+`</div>`;
      c.onclick=()=>c.classList.toggle("open");g.appendChild(c);
    });
    return;
  }
  WY.forEach((L,li)=>{
    const ids=L.w.map(w=>"wy:"+li+":"+w[0]).concat(["wk:"+li]);
    const done=ids.every(x=>S.cleared.includes(x));
    const c=document.createElement("div");c.className="card wy"+(done?" cleared":"");
    c.innerHTML=`<div class="idm sm"><span class="pg">p.${L.p}${done?" ✓":""}</span>${L.t}</div>`+
      `<div class="zy">${L.dy}·${L.au}　${L.src}</div>`+
      `<div class="body"><div class="mean">${L.note}</div>`+
      `<div class="rel"><span>主旨</span>${L.gist}</div>`+
      (L.w.length?`<div class="rel"><span>字義</span>${L.w.map(w=>w[0]+"＝"+w[2]).join("、")}</div>`:"")+
      (L.kw?`<div class="tip">💡 ${L.kw}</div>`:"")+`</div>`;
    c.onclick=()=>c.classList.toggle("open");g.appendChild(c);
  });
}

/* ══ 切換 ══ */
function paintNone(){
  const b=$("#none-body");
  if(mode==="cap"){b.innerHTML=`<span class="em">🎓</span>149 題會考文言全部做完了<br><span style="font-size:14px">這是長期目標，做完等於把近十年文言題掃過一遍</span>`;return}
  if(S.everWrong.length)b.innerHTML=`<span class="em">🎓</span>曾錯的 ${S.everWrong.length} 題都畢業了<br><span style="font-size:14px">每題都再答對 ${DRILL_PASS} 次</span>`;
  else b.innerHTML=`<span class="em">✨</span>錯題本是空的<br><span style="font-size:14px">闖關時答錯的題目會自動收進來</span>`;
}
function show(w){
  $("#sec-learn").classList.toggle("hide",w!=="learn");
  $("#sec-quiz").classList.toggle("hide",w!=="quiz");
  $("#sec-done").classList.toggle("hide",w!=="done");
  $("#sec-none").classList.toggle("hide",w!=="none");
  $("#rs").classList.toggle("hide",w!=="quiz"||mode!=="run");
}
function setNav(m){document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x.dataset.m===m))}
function go(m){
  setNav(m);mode=m;lastDrill=null;
  if(m==="learn"){buildGrid();show("learn")}
  else if(m==="run"){S.queue.length?(show("quiz"),nextQ()):finishRound()}
  else if(m==="cap"){capPool().length?(show("quiz"),nextQ()):(paintNone(),show("none"))}
  else{drillPool().length?(show("quiz"),nextQ()):(paintNone(),show("none"))}
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.m));
$("#nx").onclick=nextQ;
$("#rs").onclick=()=>{if(!confirm("重新開始今天這一輪？已過關的 "+S.cleared.length+" 題會歸零。"))return;
  newRound();save();paint();buildGrid();go("run")};
$("#d-again").onclick=()=>{newRound();save();paint();buildGrid();go("run")};
$("#d-cap").onclick=()=>go("cap");
$("#d-wrongonly").onclick=()=>{
  if(!S.everWrong.length){alert("今天沒有答錯過任何一題 👏");return}
  S.everWrong.forEach(x=>S.drill[x]=0);save();paint();go("wrong")};

buildFilters();buildGrid();paint();
S.queue.length?(show("quiz"),nextQ()):finishRound();
</script>
