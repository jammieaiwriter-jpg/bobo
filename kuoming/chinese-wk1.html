<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>國文闖關 · 第一次週考</title>
<style>
:root{
  --paper:#f5efdf; --paper2:#fbf7ec; --ink:#2e2a24; --ink2:#6b6255;
  --line:#d9cfb6; --accent:#9c3d2e; --accent2:#c8785c;
  --ok:#2f7a4f; --okbg:#e3f2e8; --bad:#b03030; --badbg:#fbe6e4; --gold:#c9a227;
  --blue:#2f5f7a; --bluebg:#e6eff4;
  --shadow:0 2px 10px rgba(80,66,40,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:"Noto Serif TC","Songti TC","PingFang TC","Heiti TC",serif;line-height:1.75;padding:0 0 60px}
header{background:linear-gradient(180deg,#efe6cf,#f5efdf);border-bottom:2px solid var(--line);
  padding:15px 16px 11px;text-align:center;position:sticky;top:0;z-index:20}
h1{margin:0;font-size:21px;letter-spacing:2px}
.sub{margin:3px 0 0;font-size:12.5px;color:var(--ink2);letter-spacing:1px}
.wrap{max-width:880px;margin:0 auto;padding:0 14px}
.prog{margin:9px auto 0;max-width:560px}
.ptrack{height:11px;background:#e4d9bd;border-radius:99px;overflow:hidden;border:1px solid #d2c4a3;display:flex}
.pseg{height:100%;transition:width .45s ease}
.pseg.cy{background:linear-gradient(90deg,#b4692f,#d99b3f)}
.pseg.wy{background:linear-gradient(90deg,#2f5f7a,#4d8aab)}
.ptext{font-size:12.5px;color:var(--ink2);margin-top:4px;letter-spacing:.5px}
.ptext b{color:var(--accent);font-size:15px}
.ptext .w{color:var(--blue)}
.ptext .done{color:var(--ok);font-weight:700}
nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:16px 0 14px}
nav button{font-family:inherit;font-size:14.5px;padding:9px 15px;border-radius:999px;cursor:pointer;
  border:1.5px solid var(--line);background:var(--paper2);color:var(--ink2);transition:.15s}
nav button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
nav button.cap.on{background:var(--blue);border-color:var(--blue)}
.filters{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.filters button{font-family:inherit;font-size:13px;padding:5px 12px;border-radius:6px;cursor:pointer;
  border:1px solid var(--line);background:var(--paper2);color:var(--ink2)}
.filters button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hintbtn{text-align:center;font-size:12px;color:#a89a7c;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px}
.card{background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;
  box-shadow:var(--shadow);cursor:pointer;transition:.15s}
.card:active{transform:scale(.985)}
.card.cleared{border-color:#a9d6ba;background:#f3f9f4}
.card.wy{border-left:4px solid var(--blue)}
.card .idm{font-size:24px;font-weight:700;letter-spacing:3px}
.card .idm.sm{font-size:19px;letter-spacing:1px}
.card .zy{font-size:12px;color:var(--accent2);letter-spacing:1px;margin-top:2px}
.card .body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.card.open .body{max-height:1400px}
.card .mean{margin:10px 0 0;font-size:15px;border-top:1px dashed var(--line);padding-top:9px}
.card .rel{font-size:13px;color:var(--ink2);margin-top:7px}
.card .rel span{display:inline-block;background:#ece2c9;border-radius:4px;padding:1px 6px;margin-right:5px;font-size:11px;color:#7a6a48}
.card .pg{float:right;font-size:11px;color:#a89a7c;font-weight:400;letter-spacing:0}
.tip{background:#fdf3d6;border-left:3px solid #d9a441;padding:6px 9px;font-size:12.5px;margin-top:8px;border-radius:0 5px 5px 0;color:#6b5520}
.qbox{background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:20px 18px;box-shadow:var(--shadow)}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--accent2);letter-spacing:1.5px;margin-bottom:4px;gap:8px}
.qhead .rem{color:var(--ink2);letter-spacing:0;white-space:nowrap}
.qmeta{text-align:center;font-size:11.5px;color:#a89a7c;letter-spacing:1px;margin-top:2px}
.ctx{background:#f2ecdc;border:1px solid var(--line);border-radius:9px;padding:13px 15px;
  font-size:15.5px;line-height:2;text-align:left;margin:14px 0 4px;max-height:340px;overflow-y:auto}
.ctx .gi{font-size:12.5px;color:var(--ink2);margin-bottom:7px;letter-spacing:1px}
.gloss{font-size:12.5px;color:var(--ink2);text-align:left;background:#fdf9ee;border-radius:7px;padding:8px 11px;margin-top:8px;line-height:1.85}
.gloss b{color:var(--accent);font-weight:700}
.qtext{font-size:18px;text-align:center;margin:14px 0 18px;line-height:1.9}
.qtext.left{text-align:left;font-size:16.5px}
.qtext .blank{display:inline-block;min-width:1.3em;border-bottom:3px solid var(--accent);color:var(--accent);font-weight:700}
.qtext .big{font-size:31px;letter-spacing:6px;font-weight:700;display:block;margin:6px 0}
.qtext .src{font-size:26px;letter-spacing:3px;font-weight:700;display:block;margin:6px 0}
.opts{display:grid;gap:9px}
.opt{font-family:inherit;font-size:16px;text-align:left;padding:13px 15px;border-radius:9px;cursor:pointer;
  border:1.5px solid var(--line);background:var(--paper);color:var(--ink);transition:.12s;line-height:1.65}
.opt.char{font-size:29px;text-align:center;letter-spacing:3px;font-weight:700}
.opt.char2{font-size:23px;text-align:center;letter-spacing:4px;font-weight:700}
.opt .lab{display:inline-block;width:1.7em;color:var(--accent2);font-weight:700}
.opt:hover{border-color:var(--accent2)}
.opt.right{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:16px;padding:13px 15px;border-radius:9px;font-size:15px;display:none;text-align:left}
.fb.show{display:block}
.fb.good{background:var(--okbg);color:#1f5c3a;border:1px solid #a9d6ba}
.fb.no{background:var(--badbg);color:#8a2626;border:1px solid #e2b0ab}
.fb .fi{font-size:18px;font-weight:700;letter-spacing:2px;display:block;margin-bottom:3px}
.fb .again{font-size:12.5px;margin-top:7px;font-weight:700;opacity:.85}
.fcard{background:#fff;border:1px solid #e2b0ab;border-radius:9px;padding:13px 15px;margin-top:11px;text-align:left}
.fcard .fz{font-size:12px;color:var(--accent2);letter-spacing:1px;margin-bottom:5px}
.fcard .fm{font-size:15.5px;line-height:1.85}
.fcard .fr{font-size:13px;color:var(--ink2);margin-top:8px}
.fcard .fr span{display:inline-block;background:#ece2c9;border-radius:4px;padding:1px 6px;margin-right:5px;font-size:11px;color:#7a6a48}
.fcard .ft{background:#fdf3d6;border-left:3px solid #d9a441;padding:7px 10px;font-size:13px;margin-top:9px;border-radius:0 5px 5px 0;color:#6b5520}
.readnote{font-size:12.5px;color:#8a2626;margin-top:9px;font-weight:700;letter-spacing:.5px}
.next{display:block;width:100%;margin-top:14px;padding:14px;border:none;border-radius:9px;cursor:pointer;
  background:var(--accent);color:#fff;font-family:inherit;font-size:16px;font-weight:700;letter-spacing:2px}
.next:disabled{background:#c9bda3;cursor:not-allowed;letter-spacing:1px}
.done-box{text-align:center;background:var(--paper2);border:2px solid var(--gold);border-radius:12px;padding:32px 20px;box-shadow:var(--shadow)}
.done-box .em{font-size:52px;display:block;margin-bottom:8px}
.done-box h2{margin:0 0 6px;font-size:23px;letter-spacing:2px;color:var(--accent)}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:10px 18px;min-width:92px}
.stat b{display:block;font-size:24px;color:var(--accent)}
.stat span{font-size:11.5px;color:var(--ink2);letter-spacing:1px}
.tough{text-align:left;background:#fdf3d6;border-radius:9px;padding:13px 15px;margin-top:6px;font-size:14px;color:#6b5520}
.tough b{display:block;margin-bottom:6px;letter-spacing:1px}
.tough i{font-style:normal;display:inline-block;background:#fff;border:1px solid #e0cc95;border-radius:5px;padding:2px 9px;margin:3px 4px 0 0}
.notify{margin-top:16px;font-size:13px;padding:9px 12px;border-radius:8px;letter-spacing:.5px}
.notify.wait{background:#eee6d2;color:var(--ink2)}
.notify.sent{background:var(--okbg);color:#1f5c3a;border:1px solid #a9d6ba;font-weight:700}
.notify.fail{background:var(--badbg);color:#8a2626;border:1px solid #e2b0ab}
.btnrow{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btnrow button{font-family:inherit;font-size:15px;padding:11px 20px;border-radius:9px;cursor:pointer;border:1.5px solid var(--accent);background:var(--accent);color:#fff;font-weight:700}
.btnrow button.ghost{background:transparent;color:var(--accent)}
.btnrow button.blue{border-color:var(--blue);background:var(--blue)}
.empty{text-align:center;color:var(--ink2);padding:48px 20px;font-size:16px}
.empty .em{font-size:40px;display:block;margin-bottom:10px}
footer{text-align:center;font-size:12px;color:#a89a7c;margin-top:34px;padding:0 14px;line-height:1.9}
.reset{border:none;background:none;color:#b5a68a;text-decoration:underline;cursor:pointer;font-family:inherit;font-size:12px;margin-top:14px;display:block;width:100%}
.hide{display:none}
@media(max-width:520px){.grid{grid-template-columns:1fr}h1{font-size:19px}.qtext .big{font-size:27px}.ctx{font-size:15px}}
</style>
</head>
<body>

<header>
  <h1>國文闖關 · 第一次週考</h1>
  <p class="sub">港明國中一年級 · 成語 p.20–29 ＋ 文言文 p.14–25 <span id="todaystr"></span></p>
  <div class="prog">
    <div class="ptrack"><div class="pseg cy" id="segcy"></div><div class="pseg wy" id="segwy"></div></div>
    <div class="ptext" id="ptext"></div>
  </div>
</header>

<div class="wrap">
  <nav>
    <button data-m="learn">📖 速記卡</button>
    <button data-m="run" class="on">🏆 今日闖關</button>
    <button data-m="wrong">🎯 錯題重練 (<span id="wn">0</span>)</button>
    <button data-m="cap" class="cap">📜 會考文言 (<span id="cn">0</span>/149)</button>
  </nav>

  <section id="sec-learn" class="hide">
    <div class="filters" id="pf"></div>
    <p class="hintbtn">點卡片看內容 · 綠色＝今天已過關</p>
    <div class="grid" id="grid"></div>
  </section>

  <section id="sec-quiz" class="hide">
    <div class="qbox">
      <div class="qhead"><span id="ql"></span><span class="rem" id="qr"></span></div>
      <div id="qctx"></div>
      <div class="qtext" id="qt"></div>
      <div class="opts" id="op"></div>
      <div class="fb" id="fb"></div>
      <button class="next hide" id="nx">下一題 →</button>
    </div>
    <button class="reset" id="rs">重新開始今天這一輪</button>
  </section>

  <section id="sec-done" class="hide">
    <div class="done-box">
      <span class="em">🏆</span>
      <h2>今天這一輪完成！</h2>
      <p style="margin:0;font-size:14px;color:var(--ink2)">課內 <span id="d-n">90</span> 題每一題都答對過一次</p>
      <div class="stats">
        <div class="stat"><b id="d-tt">0</b><span>總作答</span></div>
        <div class="stat"><b id="d-pc">0%</b><span>一次答對率</span></div>
        <div class="stat"><b id="d-wr">0</b><span>曾答錯</span></div>
      </div>
      <div class="tough hide" id="d-tough"></div>
      <div class="notify" id="d-notify"></div>
      <div class="btnrow">
        <button class="blue" id="d-cap">📜 加碼會考文言</button>
        <button class="ghost" id="d-wrongonly">🎯 再練曾錯的</button>
        <button class="ghost" id="d-again">🔁 再跑一輪</button>
      </div>
    </div>
  </section>

  <section id="sec-none" class="hide">
    <div class="empty" id="none-body"></div>
  </section>

  <footer>
    成語＝成語辭典 p.20–29（49 則）· 文言文＝《文言文推與敲》p.14–25（6 課）<br>
    會考文言真題 149 題（105–115 年，依著作權法第 9 條屬公共財）<br>
    原始照片存於同資料夾「成語原始圖」「文言文原始圖」
  </footer>
</div>

<script>
const NOTIFY_ENDPOINT="https://bobo-math-notify.bobo-math-grader.workers.dev";
const DATA=[
{i:"一了百了",z:"ㄌㄧㄠˇ",p:20,m:"比喻一件事了結，其他的也跟著解決了。",f:"沒完沒了、層出不窮",t:"「了」讀ㄌㄧㄠˇ，不是ㄌㄜ˙。"},
{i:"一五一十",p:20,m:"古時數銅錢習慣每五枚一數。比喻把事情從頭到尾詳細說出，毫無遺漏。"},
{i:"一介不取",p:20,m:"介，通「芥」，小草。形容人絲毫不取，操守廉潔。",n:"廉潔奉公",f:"貪得無厭、見利忘義、中飽私囊",t:"「介」通「芥」（小草），不是「個」的意思。"},
{i:"一手遮天",p:20,m:"比喻玩弄權術，隱瞞事實。",n:"隻手遮天、欺上瞞下",f:"正大光明、光明磊落"},
{i:"一日三秋",p:20,m:"三秋，三年。一天不見，好像隔了三年，形容思念殷切。",n:"度日如年",t:"「三秋」＝三年，不是三個秋天。"},
{i:"一毛不拔",p:21,m:"連一根毫毛都不肯拔，形容人非常吝嗇。",f:"一擲千金、揮金如土、輕財好施"},
{i:"一丘之貉",z:"ㄏㄜˊ",p:21,m:"貉，獸名，形似狐狸。同一座山丘上的貉，比喻都是同類，沒有差別（貶義）。",t:"「貉」讀ㄏㄜˊ，不寫成「洛、落、駱」。用於罵人，不可用在好人身上。"},
{i:"一目瞭然",p:21,m:"看一眼就完全清楚明白。",n:"瞭如指掌",t:"「瞭」讀ㄌㄧㄠˇ，作「明白」解；寫「一目了然」亦可，考試以課本為準。"},
{i:"一本正經",p:21,m:"原指一部正規的經典，後形容人態度莊重認真。",n:"不苟言笑、正襟危坐",f:"嘻皮笑臉、油腔滑調"},
{i:"一字千金",p:21,m:"形容文辭精妙，價值非常高的作品。",f:"滿紙空文"},
{i:"一年半載",z:"ㄗㄞˇ",p:22,m:"載，年。一年半年，指時間不長也不短。",n:"三年五載",f:"千秋萬代、萬古千年",t:"「載」＝年，讀ㄗㄞˇ。"},
{i:"一成不變",p:22,m:"本指刑罰一經執行就無法改變，引申為事物一經形成，就不輕易改變。",n:"墨守成規",f:"因時制宜、推陳出新"},
{i:"一步登天",p:22,m:"一步就登上青天。比喻突然得志，或達到極高的境界。",n:"平步青雲、扶搖直上",f:"按部就班、循序漸進"},
{i:"一見如故",p:22,m:"形容初次見面就像老朋友一樣投合。",n:"相見恨晚",f:"白頭如新"},
{i:"一言九鼎",z:"ㄉㄧㄥˇ",p:22,m:"九鼎，古代國家的寶器。比喻說話很有分量。",n:"一諾千金",f:"人微言輕",t:"「鼎」不寫成「頂」。"},
{i:"一事無成",p:23,m:"一件事情也沒有做成。",f:"功成名就、卓有成效"},
{i:"一言難盡",p:23,m:"事情複雜，無法用簡單的話說清楚。",f:"一言蔽之、三言兩語"},
{i:"一命嗚呼",z:"ㄨ ㄏㄨ",p:23,m:"嗚呼，嘆詞，借指死亡。指人死了。",n:"與世長辭、蒙主寵召",f:"生龍活虎",t:"是「嗚」（口字旁）不是「鳴」（鳥字旁）！最常考的錯字。"},
{i:"一波三折",p:23,m:"本指寫字時一筆之中有三種筆勢的轉折，今比喻事情進行得不順利。",n:"峰迴路轉",f:"一帆風順、水到渠成"},
{i:"一知半解",p:23,m:"形容知道得不夠透徹，只懂一點皮毛。",n:"不求甚解、囫圇吞棗、淺嘗輒止",f:"心領神會、融會貫通、瞭如指掌"},
{i:"一股腦兒",p:24,m:"指全部、一切地，全部一起。",n:"一切、全部"},
{i:"一哄而散",z:"ㄏㄨㄥ",p:24,m:"形容原本聚集的人群，一下子吵嚷著各自散去。",n:"作鳥獸散",f:"蜂擁而至",t:"「哄」讀ㄏㄨㄥ，不寫成「烘」。"},
{i:"一面之交",p:24,m:"指只見過一次面的交情，形容交情很淺。",n:"一面之雅、一面之緣",f:"刎頸之交、莫逆之交"},
{i:"一氣呵成",z:"ㄏㄜ",p:24,m:"比喻文章或繪畫氣勢流暢，首尾連貫，一次完成。",n:"一鼓作氣",f:"斷斷續續",t:"「呵」讀ㄏㄜ，不寫成「喝」或「何」。"},
{i:"一笑置之",p:24,m:"置，安放。形容對人或事不加計較，笑一笑就算了。",n:"付之一笑",f:"斤斤計較"},
{i:"一針見血",p:24,m:"一針刺入就見到血。比喻說話或文章能抓住主旨，見解透徹。",n:"一語道破、單刀直入",f:"不著邊際"},
{i:"一馬當先",p:25,m:"比喻領導別人向前進，有帶頭的作用。",n:"身先士卒、挺身而出",f:"畏首畏尾、裹足不前"},
{i:"一敗塗地",p:25,m:"塗地，「肝腦塗地」的省略。比喻徹底失敗。",n:"一蹶不振、片甲不留",f:"百戰百勝、所向披靡、勢如破竹",t:"是「塗」不是「途」。"},
{i:"一望無際",p:25,m:"看不到邊際，形容非常廣大遼闊。",n:"漫無邊際、無邊無涯",f:"一隅之地、方寸之地、彈丸之地"},
{i:"一貧如洗",p:25,m:"窮得像水洗過一樣，形容非常窮困，一無所有。",n:"家徒四壁、短褐穿結",f:"金玉滿堂、家財萬貫、富可敵國"},
{i:"一傳眾咻",z:"ㄒㄧㄡ",p:25,m:"傳，教。咻，喧鬧。一個人教，許多人在旁邊喧鬧擾亂。指學習環境的重要。",t:"「咻」讀ㄒㄧㄡ，口字旁。典出《孟子》。"},
{i:"一勞永逸",p:26,m:"一次的辛勞，可以獲得永久的安逸。",f:"徒勞無益、勞而無功",t:"是「逸」不是「意」。"},
{i:"一揮而就",p:26,m:"揮筆一下就完成。形容書畫、文章寫得又快又好。",n:"倚馬可待、下筆成章",f:"搜索枯腸、嘔心瀝血"},
{i:"一朝一夕",z:"ㄓㄠ",p:26,m:"一時半刻，形容時間很短。",n:"一時半刻、俯仰之間、轉瞬之間",f:"千秋萬載、日久年深、天長地久",t:"「朝」讀ㄓㄠ（早晨），不讀ㄔㄠˊ。"},
{i:"一筆勾消",p:26,m:"一筆全部勾除註銷，比喻全部取消。",n:"一筆抹煞",f:"沒齒難忘、刻骨銘心、耿耿於懷",t:"「消」亦作「銷」，寫「一筆勾銷」也通。"},
{i:"一絲不苟",z:"ㄍㄡˇ",p:26,m:"不苟，不馬虎。形容做事態度謹慎認真。",n:"一板一眼、有板有眼",f:"草草了事、馬馬虎虎、虛應故事",t:"是「苟」（草字頭）不是「狗」。"},
{i:"一視同仁",p:27,m:"仁，通「人」。指對人不分親疏，同等看待。",f:"另眼相看、厚此薄彼"},
{i:"一絲不掛",p:27,m:"原為佛家語，指人心中毫無雜念；現多用來指人全身赤裸。",t:"原意是「心無雜念」，與現在的用法差很多，常考本義。"},
{i:"一飯千金",p:27,m:"形容接受別人一點小恩惠，卻給予重大的回報。典出韓信報漂母之恩。",n:"感恩圖報、感恩戴德",f:"忘恩負義、過河拆橋、鳥盡弓藏"},
{i:"一塌糊塗",z:"ㄊㄚ",p:27,m:"形容混亂敗壞到不可收拾的程度。",n:"亂七八糟、雜亂無章",f:"井井有條、井然有序、有條不紊",t:"「塌」讀ㄊㄚ，不寫成「榻」。"},
{i:"一落千丈",p:27,m:"本指琴聲突然由高降低，後多比喻境況、地位、聲譽急速下降。",n:"江河日下、每況愈下",f:"蒸蒸日上、扶搖直上"},
{i:"一葉知秋",p:28,m:"看見一片葉子掉落，就知道一年將要過完。比喻由微小的徵兆，就能推知事情往後的發展。",n:"見微知著",t:"典出《淮南子》：「見一葉落，而知歲之將暮。」"},
{i:"一團和氣",p:28,m:"一片祥和的氣氛；也用來形容人態度和藹可親。",n:"和顏悅色",f:"怒目相視、橫眉豎眼"},
{i:"一塵不染",z:"ㄔㄣˊ",p:28,m:"原為佛教用語，塵比喻物欲。指修道人六根清淨，不受塵俗干擾。後泛指人品純潔，也形容非常乾淨。",n:"冰清玉潔、潔身自愛",f:"同流合汙、藏汙納垢",t:"「塵」不寫成「陳」。原是佛家語，本義指心無物欲。"},
{i:"一網打盡",p:28,m:"指捕捉獵物一個不漏，全部捕獲。比喻完全捕捉或消滅。",t:"「網」不寫成「綱」。"},
{i:"一暴十寒",z:"ㄆㄨˋ",p:29,m:"曬一天，凍十天。比喻學習、做事沒有恆心，時常間斷。",n:"三天打魚，兩天曬網",f:"持之以恆、鍥而不舍",t:"「暴」通「曝」，讀ㄆㄨˋ（曬），不讀ㄅㄠˋ！典出《孟子‧告子上》，最常考的破音字。"},
{i:"一鳴驚人",p:29,m:"一出聲就令人吃驚。比喻平時默默無聞，突然做出令人驚訝的表現。",n:"一舉成名、石破天驚",f:"平凡無奇、默默無聞、庸庸碌碌",t:"是「鳴」（鳥字旁，鳥叫）—— 跟「一命嗚呼」的「嗚」（口字旁）不要搞混！"},
{i:"一箭雙鵰",z:"ㄉㄧㄠ",p:29,m:"一箭同時射得兩隻鵰。比喻做一件事而同時獲得兩種效果。",n:"一石二鳥、一舉兩得",f:"事倍功半、徒勞無功、顧此失彼",t:"「鵰」是猛禽（鳥字旁），不寫成「雕」刻的「雕」。"},
{i:"一諾千金",z:"ㄋㄨㄛˋ",p:29,m:"諾，允諾。形容說話極有信用、極有價值。",n:"一言九鼎、言而有信",f:"信口開河、輕諾寡信、食言而肥",t:"典出《史記‧季布欒布列傳》：「得黃金百斤，不如得季布一諾。」"}

const WY=[{"t":"覆水難收","src":"《拾遺記》","au":"王嘉","dy":"晉","p":"14–15","unit":"萬物皆有情","no":1,"gist":"若能離更合，覆水定難收。","note":"姜太公（太公望）與馬氏的故事。馬氏因太公讀書不事產而求去，太公封齊後又求復合，太公傾水於地令其收回，以「覆水難收」拒絕。","kw":"覆水難收：(1)比喻離異的夫妻很難再復合。(2)指既定的事實很難再改變。","w":[["去","馬求「去」","離開",["前往","放棄"]],["合","馬求再「合」","復合",["合作","和諧"]],["惟","「惟」得其泥","只有",["希望","因為"]],["離","若能「離」更合","分開",["相隔","背叛"]],["覆","「覆」水定難收","傾倒",["反轉","遮蓋"]]]},{"t":"鳥","src":"（唐詩）","au":"白居易","dy":"唐","p":"16–17","unit":"萬物皆有情","no":2,"gist":"誰道群生性命微？一般骨肉一般皮。勸君莫打枝頭鳥，子在巢中望母歸。","note":"體裁：七言絕句（四句、28 字）。韻腳：微、皮、歸。主張眾生平等，勸人愛護生命。","kw":"寫作手法：把鳥「子待母歸」擬人化，以母子之情讓讀者感同身受。用了設問、轉化、類疊，沒有用感嘆。","w":[]},{"t":"白娘子永鎮雷峰塔","src":"《警世通言》","au":"馮夢龍","dy":"明","p":"18–19","unit":"萬物皆有情","no":3,"gist":"人無害虎心，虎有傷人意。","note":"白話小說。人物：白娘子、戴先生（捉蛇人）、許宣、法海禪師。地點：杭州西湖許宅。","kw":"文章特色：用字淺顯，劇情高潮迭起、環環相扣，人物形象鮮明。","w":[["發落","三回五次「發落」不去","打發",["處理","命令"]],["量","「量」道一條蛇有何難捉","估量",["商量","評量"]],["望","「望」後便倒","向",["看","希望"]],["照顧","二位自去「照顧」別人","光顧",["看顧","注意"]]]},{"t":"懷橘遺親","src":"《二十四孝》","au":"郭居敬","dy":"元","p":"20–21","unit":"典型在夙昔","no":1,"gist":"吾母性之所愛，欲歸以遺母。","note":"後漢陸績，字公紀，六歲時至九江見袁術，藏橘二枚欲帶回給母親。「遺」音ㄨㄟˋ，給予。","kw":"陸績懷橘之舉孝心可貴，但「偷竊」畢竟違法，一定有更合乎情理的方式可以表達孝心。六歲＝齠齔之年。","w":[["懷","績「懷」橘二枚","藏著",["感傷","想念"]],["待","術出橘「待」之","款待",["等候","逗留"]],["墮","及歸拜辭「墮」地","掉落",["喪失","拋擲"]]]},{"t":"子罕辭寶","src":"《左傳》","au":"左丘明","dy":"春秋","p":"22–23","unit":"典型在夙昔","no":2,"gist":"我以不貪為寶，爾以玉為寶。","note":"宋人獻玉給子罕，子罕不受。先敘事、後記言，透過對話表現獻玉者的謹慎與子罕謙厚待人的態度。","kw":"相關詞語：匹夫無罪，懷璧其罪 —— 比喻擁有珍寶容易招來禍害。子罕性格：清廉高潔。","w":[["示","以「示」玉人","展示",["命令","教導"]],["故","「故」敢獻之","所以",["有意","原因"]],["若","「若」以與我","如果",["你","如此"]],["懷","小人「懷」璧","持有",["想念","哀憐"]],["越","不可以「越」鄉","穿越",["宣揚","超過"]],["納","「納」此以請死也","獻",["收","受"]],["復","富而後使「復」其所","返回",["還原","回報"]]]},{"t":"晏子使楚","src":"《晏子春秋》","au":"（佚名）","dy":"戰國","p":"24–25","unit":"典型在夙昔","no":3,"gist":"齊命使各有所主，其賢者使使賢王，不肖者使使不肖王。","note":"楚人因晏子身材矮小而開小門羞辱，晏子以「使狗國者從狗門入」反擊；楚王譏齊無人，晏子以「張袂成帷、揮汗成雨、比肩繼踵」回應。","kw":"相關詞語：人不可貌相、以貌取人。晏子機智善辯、外交手腕高超，穿越到現代最適合當外交官。","w":[["使","晏子「使」楚","出使",["派遣","使者"]],["以","楚人「以」晏子短","因為",["以為","憑藉"]],["延","而「延」晏子","引導",["遲緩","招攬"]],["比","「比」肩繼踵而在","相並",["媲美","等到"]]]}];
const WT=[[0,"讀完這則故事後，請判斷「覆水難收」的意思，與下列何者有異曲同工之妙？",{"A":"覆巢之下，焉有完卵","B":"一言既出，駟馬難追","C":"病從口入，禍從口出","D":"刀劍傷身，言語傷心"},"B"],[0,"「讀書不事產」的「事」字意思與下列何者相同？",{"A":"他整日無所「事」事","B":"他們要地方上平安無「事」，過太平日子","C":"這王小玉也醉了，不省人「事」","D":"以「事」人者，色衰而愛弛"},"A"],[1,"下列何者最適合用來詮釋〈鳥〉這首詩的詩旨？",{"A":"百善孝為先","B":"麻雀雖小，五臟俱全","C":"螳螂捕蟬，黃雀在後","D":"萬物有情，寶愛生命"},"D"],[1,"白居易〈鳥〉所運用的修辭手法，不包括下列何者？",{"A":"設問","B":"轉化","C":"類疊","D":"感嘆"},"D"],[1,"作者透過〈鳥〉勸誡世人應以何種胸懷來對待自然萬物？",{"A":"惻隱之心","B":"羞惡之心","C":"是非之心","D":"辭讓之心"},"A"],[2,"捉蛇人戴先生與白娘子交手後，嚇得迅速逃離現場，還把原先收下的銀兩退還。讓他急急離去的原因，可用下列哪個歇後語說明？",{"A":"八仙過海——各顯神通","B":"泥菩薩過江——自身難保","C":"關公面前耍大刀——自不量力","D":"黃鼠狼給雞拜年——不安好心"},"B"],[3,"陸績「懷橘遺親」之舉，在今日已不值得仿效，請推測原因為何？",{"A":"孝順父母的價值觀已不受重視","B":"偷取他人財物之舉違反法律規範","C":"橘子價值不高，沒有拿取價值","D":"以上皆是"},"B"],[3,"根據文中記載，陸績當時的年紀與下列何者最接近？",{"A":"齠齔之年","B":"總角之年","C":"二八年華","D":"志學之年"},"B"],[4,"「小人懷璧，不可以越鄉，納此以請死也。」由此可知，下列何者最適合形容宋人心中的想法？",{"A":"尺璧非寶，寸陰是競","B":"匹夫無罪，懷璧其罪","C":"物歸原主，完璧歸趙","D":"是福不是禍，是禍躲不過"},"B"],[4,"下列哪個詞語，最適合用來形容子罕的性格？",{"A":"口是心非","B":"口蜜腹劍","C":"清廉高潔","D":"貪生怕死"},"C"],[5,"「楚人以晏子短，為小門於大門側，而延晏子。」從這句話看來，楚人對晏嬰的態度為何？",{"A":"畢恭畢敬","B":"白眼頻加","C":"誠惶誠恐","D":"不亢不卑"},"B"],[5,"若晏嬰穿越時空從古代來到現代，他最適合從事下列哪一種行業？",{"A":"工程師","B":"老師","C":"外交官","D":"建築師"},"C"]];
const CAP=[{"id":"CAP-105-國文-10","y":"105","n":10,"ax":"S-classical","df":"進階","pr":0.74,"gc":"","gi":"","st":"「君子如抱美玉而深藏不市，小人則以石為玉而又炫之。」根據這句話，君子不同於小人的特質是下列何者？","op":{"A":"臨財不苟","B":"真實坦率","C":"見多識廣","D":"沉潛含蓄"},"an":"D","nt":[],"gn":[]},{"id":"CAP-105-國文-19","y":"105","n":19,"ax":"S-classical","df":"進階","pr":0.71,"gc":"","gi":"","st":"「北風吹，吹我庭前柏樹枝。樹堅不怕風吹動，節操稜稜 1 還自持。冰霜歷盡心不移，況復陽和景漸宜。閒花野草尚葳蕤 2，風吹柏枝將何為？北風吹，能幾時！」詩中事物所象徵的意涵，下列說明何者最恰當？","op":{"A":"北風 ―― 心中的疑慮","B":"柏樹 ―― 國家的運勢","C":"冰霜 ―― 隱逸的心志","D":"陽和 ―― 轉好的境況"},"an":"D","nt":[{"n":1,"term":"稜稜","text":"威嚴耿直"},{"n":2,"term":"葳蕤","text":"音ㄨㄟ ㄖㄨㄟˊ，草木茂盛的樣子"}],"gn":[]},{"id":"CAP-105-國文-22","y":"105","n":22,"ax":"S-classical","df":"進階","pr":0.65,"gc":"","gi":"","st":"朱熹云：「程子曰：『《大學》，孔氏之遺書，而初學入德之門也。』於今可見古人為學次第者，獨賴此篇之存，而《論》、《孟》次之。學者必由是而學焉，則庶乎其不差矣。」根據這段文字，下列何者最接近朱熹的看法？","op":{"A":"《大學》的成書年代早於《論》、《孟》","B":"《大學》的內容遠較《論》、《孟》來得深奧","C":"儒家《論》、《孟》的思想，是以《大學》為本衍生而出","D":"欲知古人為學修德的次第，首推《大學》，其次《論》、《孟》"},"an":"D","nt":[],"gn":[]},{"id":"CAP-105-國文-27","y":"105","n":27,"ax":"S-classical","df":"進階","pr":0.71,"gc":"","gi":"","st":"「思量、能幾許？憂愁風雨，一半相妨。又何須，抵死說短論長。幸對清風皓月，苔茵展、雲幕高張。江南好，千鍾美酒，一曲滿庭芳。」作者在這段文字中展現出的生命態度，與下列何者最接近？","op":{"A":"生於憂患，死於安樂","B":"隱遁出世，成道求仙","C":"豁達自適，及時行樂","D":"縱論時局，憂以天下"},"an":"C","nt":[],"gn":[]},{"id":"CAP-105-國文-30","y":"105","n":30,"ax":"S-classical","df":"挑戰","pr":0.48,"gc":"","gi":"","st":"「人之學文，其功力所能至者，陳理義必明當，布置取捨、繁簡廉肉 1 不失法，吐辭雅馴不蕪而已。古今至此者，蓋不數數 2 得。」這段話主要在說明下列何者？","op":{"A":"好文章所需具備的條件","B":"說理議論文的創作步驟","C":"古今學文者的文章樣貌","D":"文體形式的運用與取捨"},"an":"A","nt":[{"n":1,"term":"廉肉","text":"指文章之疏略與豐腴"},{"n":2,"term":"數數","text":"音ㄕㄨㄛˋㄕㄨㄛˋ，常常"}],"gn":[]},{"id":"CAP-105-國文-31","y":"105","n":31,"ax":"S-classical","df":"挑戰","pr":0.52,"gc":"","gi":"","st":"「夫投膠 1 以變濁，不如澄其源而濁變之愈也；揚湯以止沸，不如絕其薪而沸止之速也。是以勞心於服遠者，莫若修近而其遠自來；多方以救失者，莫若改行而其失自去。」根據這段文字，下列何者最符合作者的觀點？","op":{"A":"投膠變濁，勝於澄源","B":"揚湯止沸，不如絕薪","C":"勞心服遠，近者自來","D":"多方救失，其失自去"},"an":"B","nt":[{"n":1,"term":"膠","text":"阿膠。據云以阿膠攪濁水則水清"}],"gn":[]},{"id":"CAP-105-國文-32","y":"105","n":32,"ax":"S-classical","df":"挑戰","pr":0.5,"gc":"","gi":"","st":"歐陽脩：「蔡君謨既為余書〈集古錄目序〉刻石，其字尤精勁，為世所珍。今饋以鼠鬚栗尾筆、銅錄筆格、大小龍茶、惠山泉等物為潤筆。」根據這段文字，下列敘述何者正確？","op":{"A":"蔡君謨文筆已甚精勁，經歐陽脩稍加潤飾，即成世所稱道的佳文","B":"蔡君謨為〈集古錄目序〉書刻石，歐陽脩贈予許多物品以為酬謝","C":"為作〈集古錄目序〉，歐陽脩耗費財物蒐求蔡君謨珍奇稀有的刻石","D":"刻寫〈集古錄目序〉需使用鼠鬚栗尾筆、銅錄筆格，方成上乘之作"},"an":"B","nt":[],"gn":[]},{"id":"CAP-105-國文-34","y":"105","n":34,"ax":"S-classical","df":null,"pr":null,"gc":"","gi":"","st":"趙以數困於秦兵，趙王思復得廉頗，廉頗亦思復用於趙。趙王使使者視廉頗尚可用否。廉頗之仇郭開多與使者金，令毀之。趙使者既見廉頗，廉頗為之一飯斗米，肉十斤，被甲上馬，以示尚可用。趙使還報王曰：「廉將軍雖老，尚善飯。然與臣坐，頃之三遺矢 1 矣。」趙王以為老，遂不召。根據這段文字，廉頗不復重用的原因，最可能是下列何者？","op":{"A":"不知禮數，席間得罪使者","B":"老態畢現，難以征戰沙場","C":"趙王憫其年老，賜歸還鄉","D":"郭開挾怨報復，陰謀陷害"},"an":"D","nt":[{"n":1,"term":"矢","text":"通「屎」"}],"gn":[]},{"id":"CAP-105-國文-35","y":"105","n":35,"ax":"S-classical","df":"挑戰","pr":0.36,"gc":"","gi":"","st":"「呵凍提篙手未蘇 1，滿船涼月雪模糊。畫家不解漁家苦，好作寒江釣雪圖。」本詩的主旨與下列何者最接近？","op":{"A":"對於漁民生活的疾苦，作者寄予關切同情","B":"漁民雖然生活艱辛，卻大多能夠苦中作樂","C":"畫家擅於從藝術角度來捕捉漁民的閒情逸趣","D":"畫家透過寫實的筆法來呈現漁民生活的甘苦"},"an":"A","nt":[{"n":1,"term":"手未蘇","text":"雙手尚未活絡"}],"gn":[]},{"id":"CAP-105-國文-45","y":"105","n":45,"ax":"G-classical","df":"進階","pr":0.61,"gc":"高宗嘗宴大臣，見張循王持扇，有玉孩兒扇墜，上識是舊物，昔往四明，誤墜於水，屢尋不獲，乃詢於張循王，對曰：「臣從清河坊鋪家買得。」召問鋪家，云：「得於提籃人。」復遣問，回奏云：「於候潮門外陳宅廚娘處買得。」又遣問廚娘，云：「破黃花魚腹中得之。」奏聞，上大悅，以為失物復還之兆。鋪家及提籃人補校尉，廚娘封孺人，張循王賞賜甚厚。\n―― 改寫自田汝成《西湖遊覽志餘》","gi":"請閱讀以下短文，並回答45～46題：","st":"根據本文的內容，下列敘述何者正確？","op":{"A":"張循王尋回皇上舊物，特意奉還","B":"高宗遣鋪家尋找失物，屢尋不獲","C":"廚娘之語，可佐證扇墜曾落水中","D":"廚娘得到扇墜，售予清河坊鋪家"},"an":"C","nt":[],"gn":[]},{"id":"CAP-105-國文-46","y":"105","n":46,"ax":"G-classical","df":"進階","pr":0.68,"gc":"高宗嘗宴大臣，見張循王持扇，有玉孩兒扇墜，上識是舊物，昔往四明，誤墜於水，屢尋不獲，乃詢於張循王，對曰：「臣從清河坊鋪家買得。」召問鋪家，云：「得於提籃人。」復遣問，回奏云：「於候潮門外陳宅廚娘處買得。」又遣問廚娘，云：「破黃花魚腹中得之。」奏聞，上大悅，以為失物復還之兆。鋪家及提籃人補校尉，廚娘封孺人，張循王賞賜甚厚。\n―― 改寫自田汝成《西湖遊覽志餘》","gi":"請閱讀以下短文，並回答45～46題：","st":"關於本文的寫作方式，下列敘述何者正確？","op":{"A":"藉對話凸顯故事中所有人物的個性","B":"以諷喻手法，勸告世人當拾金不昧","C":"以抽絲剝繭的方式，層層鋪敘情節","D":"文末未提故事結局，製造懸疑效果"},"an":"C","nt":[],"gn":[]},{"id":"CAP-105-國文-47","y":"105","n":47,"ax":"G-classical","df":"挑戰","pr":0.43,"gc":"王次仲者，以為世之篆文，工多而用寡，難以速就。四海多事，筆札 1 為先，乃變篆籀 2 之體為隸書。秦始皇以次仲所易文簡，其功利於人而召之，三徵入秦，不至。次仲履真懷道 3，窮數術 4 之美。始皇怒其不恭，令檻車送之。次仲化為大鳥，翻飛出車外，落二翮於峰巒，故有大翮、小翮之名矣。\n―― 改寫自《仙傳拾遺》、《水經注》","gi":"請閱讀以下短文，並回答47～48題：","st":"下列文句（ ）中所應填入的主語，何者正確？","op":{"A":"（ ）工多而用寡 ―― 秦始皇","B":"（ ）乃變篆籀之體為隸書 ―― 筆札","C":"（ ）三徵入秦 ―― 王次仲","D":"（ ）落二翮於峰巒 ―― 大鳥"},"an":"D","nt":[{"n":1,"term":"筆札","text":"公文書信"},{"n":2,"term":"篆籀","text":"周、秦間通行之字體。籀，音ㄓㄡˋ"},{"n":3,"term":"履真懷道","text":"修習道家之學"},{"n":4,"term":"數術","text":"關於天文、曆法、占卜等學問"}],"gn":[]},{"id":"CAP-105-國文-48","y":"105","n":48,"ax":"G-classical","df":"進階","pr":0.6,"gc":"王次仲者，以為世之篆文，工多而用寡，難以速就。四海多事，筆札 1 為先，乃變篆籀 2 之體為隸書。秦始皇以次仲所易文簡，其功利於人而召之，三徵入秦，不至。次仲履真懷道 3，窮數術 4 之美。始皇怒其不恭，令檻車送之。次仲化為大鳥，翻飛出車外，落二翮於峰巒，故有大翮、小翮之名矣。\n―― 改寫自《仙傳拾遺》、《水經注》","gi":"請閱讀以下短文，並回答47～48題：","st":"根據本文內容，下列敘述何者正確？","op":{"A":"次仲因擅自改革文字觸怒始皇，而遭逮捕","B":"始皇過於急功好利，故次仲出走轉而修道","C":"次仲將篆籀之體改為隸書，方便世人使用","D":"仙鳥中始皇之箭，落羽成大翮、小翮二山 13 試題結束"},"an":"C","nt":[],"gn":[]},{"id":"CAP-106-國文-5","y":"106","n":5,"ax":"S-classical","df":"基礎","pr":0.82,"gc":"","gi":"","st":"下列文句，何者旨在強調學習的樂趣？","op":{"A":"學而時習之，不亦說乎","B":"凡事不宜刻，若讀書則不可不刻","C":"不自限其昏與庸而力學不倦，自立者也","D":"吾材之庸，不逮人也。旦旦而學之，久而不怠焉"},"an":"A","nt":[],"gn":[]},{"id":"CAP-106-國文-6","y":"106","n":6,"ax":"S-classical","df":"基礎","pr":0.84,"gc":"","gi":"","st":"「一般十月懷胎，吃盡辛苦，不論男女，總是骨血，何忍淹棄。為父者你自想，若不收女，你妻從何而來？為母者你自想，若不收女，你身從何而活？且生男未必孝順，生女未必忤逆。」這段文字主要是說明下列何者？","op":{"A":"父母養育子女的辛勞","B":"婦女懷胎十月的辛苦","C":"重男輕女乃不智之舉","D":"養兒防老乃過時觀念"},"an":"C","nt":[],"gn":[]},{"id":"CAP-106-國文-13","y":"106","n":13,"ax":"S-classical","df":"進階","pr":0.72,"gc":"","gi":"","st":"曾國藩自述：「早歲有志著述，自馳驅戎馬，此念久廢，然亦不敢遂置詩書於不問也。每日稍閑，則取班、馬、韓、歐 1 諸家文，舊日所酷好者，一溫習之，用此以養吾心而凝吾神。」根據這段話，下列關於曾國藩的說明何者最恰當？","op":{"A":"認為養心凝神之道，就是與舊友切磋溫習詩文","B":"每日仿效班、馬、韓、歐等名家的文章來寫作","C":"在戎馬之際仍堅持創作，終於成就不朽的著作司馬遷、韓愈、歐陽脩","D":"即便工作繁忙，依舊趁暇閱覽詩書，修養心性"},"an":"D","nt":[{"n":1,"term":"班、馬、韓、歐","text":"指班固、"}],"gn":[]},{"id":"CAP-106-國文-15","y":"106","n":15,"ax":"S-classical","df":"基礎","pr":0.8,"gc":"","gi":"","st":"「 1 冷淡是秋花，更比秋花冷淡些。 2 到處芙蓉供醉賞，從他。自有幽人處士誇。 \u0001 3 寂寞兩三葩，晝日無風也帶斜。 4 一片西窗殘照裡，誰家。捲卻湘裙薄薄紗。」詞中畫線處，何者最能表達作者不隨流俗、終能獲得賞識的想法？","op":{"A":"1","B":"2","C":"3","D":"4"},"an":"B","nt":[],"gn":[]},{"id":"CAP-106-國文-17","y":"106","n":17,"ax":"S-classical","df":"進階","pr":0.67,"gc":"","gi":"","st":"有客語：「馬肝大毒，能殺人，故漢武帝云：『文成食馬肝而死。』」迂公適聞之，發笑曰：「客誑語耳，肝故在馬腹中，馬何以不死？」客戲曰：「馬無百年之壽，以有肝故也。」公大悟，家有畜馬，便刳其肝，馬立斃。公擲刀歎曰：「信哉，毒也。去之尚不可活，況留肝乎？」根據這則笑話，下列敘述何者正確？","op":{"A":"漢武帝因食馬肝而死","B":"馬肝很毒，所以馬不長壽","C":"迂公原本不相信客人所說的話","D":"從迂公殺馬的結果可知客人所言不虛"},"an":"C","nt":[],"gn":[]},{"id":"CAP-106-國文-18","y":"106","n":18,"ax":"S-classical","df":"進階","pr":0.65,"gc":"","gi":"","st":"「豔冶之貌，代有之矣；潔朗之操，則人鮮聞。故士矜才則德薄，女衒 1 色則情私。若能如執盈，如臨深，則皆為端士淑女矣。」這段文字的觀點，與下列何者最接近？","op":{"A":"端士淑女應才色兼備","B":"人宜謹飭德操，莫炫耀才色","C":"美貌女子與高潔端士均屬少見","D":"端士不近美色，淑女不矜才德"},"an":"B","nt":[{"n":1,"term":"衒","text":"炫示、誇耀"}],"gn":[]},{"id":"CAP-106-國文-23","y":"106","n":23,"ax":"S-classical","df":"挑戰","pr":0.53,"gc":"","gi":"","st":"唐宣宗時，相國令狐綯以故事訪於溫岐，對以「其事出《南華》1。」且曰：「非僻書也。或冀相公燮理 2 之暇，時宜覽古。」綯怒。根據這段文字，下列敘述何者正確？","op":{"A":"令狐綯向溫岐求問無解，故勃然大怒","B":"令狐綯因施政遇到困難，找溫岐商量","C":"溫岐回答問題後，勸令狐綯要多讀書","D":"溫岐以《南華》中的故事指正令狐綯"},"an":"C","nt":[{"n":1,"term":"《南華》","text":"指《莊子》"},{"n":2,"term":"燮理","text":"治理國事"}],"gn":[]},{"id":"CAP-106-國文-26","y":"106","n":26,"ax":"S-classical","df":"挑戰","pr":0.52,"gc":"","gi":"","st":"蘇東坡自述 ：「自今日以往，不過一爵一肉。有尊客，盛饌則三之，可損不可增。有召我者，預以此先之，主人不從而過是者，乃止。一曰安分以養福，二曰寬胃以養氣，三曰省費以養財。」根據這段文字，下列何者最符合東坡的飲食原則？","op":{"A":"對己待客，飲食皆須有所節制","B":"招待尊客，最少須準備三道盛饌","C":"受邀作客時，抱持客隨主便的態度","D":"宴請賓客前，必先告知自家飲食原則"},"an":"A","nt":[],"gn":[]},{"id":"CAP-106-國文-29","y":"106","n":29,"ax":"S-classical","df":"挑戰","pr":0.51,"gc":"","gi":"","st":"下列詩句前後兩句的關係，何者說明正確？","op":{"A":"美酒飲教微醉後，好花看到半開時――前句為因，後句為果","B":"戲掬清泉灑蕉葉，兒童誤認雨聲來――前句泉灑蕉葉的假設引發後句的雨聲","C":"書冊埋頭無了日，不如拋卻去尋春――將前句的讀書與後句的尋春互作比較","D":"梅須遜雪三分白，雪卻輸梅一段香――前句由梅至雪，後句由雪至香，層層遞進"},"an":"C","nt":[],"gn":[]},{"id":"CAP-106-國文-32","y":"106","n":32,"ax":"S-classical","df":"挑戰","pr":0.48,"gc":"","gi":"","st":"「桃符仰視艾人而罵曰：『汝何等草芥，輒居我上？』艾人俯而應曰：『自元日至端午以來，汝已半截入土，猶爭高下乎？』桃符怒，往復紛然不已。門神解之曰：『吾輩不肖，方傍人門戶，何暇爭閒氣耶？』」根據這段文字，下列敘述何者正確？","op":{"A":"艾人以「半截入土」暗譏桃符有過時之嫌","B":"門神指責桃符愛爭閒氣，所以只能傍人門戶","C":"三者位置由高而低依序是：門神、桃符、艾人","D":"桃符與艾人為了元日、端午的重要性而爭吵不休"},"an":"A","nt":[],"gn":[]},{"id":"CAP-106-國文-45","y":"106","n":45,"ax":"G-classical","df":"挑戰","pr":0.46,"gc":"佟中丞鳳彩巡撫河南，年已老，每日五鼓，燃燭治文書，或坐倦假寐，少頃，輒矍然 1 起，自呼其名曰：「佟某，汝為朝廷大臣，封疆之重，皆汝肩之，奈何不任事若此！」輒以手批頰數四。侍者為之悚慄。\n中丞在豫，恩澤普及，豫人感其德，猶繪像祀之。\n――改寫自葛虛存《清代名人軼事》","gi":"請閱讀以下短文，並回答45～46題：","st":"「佟中丞鳳彩巡撫河南」句中「巡撫」二字的詞性，與下列何者相同？","op":{"A":"燃「燭」治文書","B":"皆汝「肩」之","C":"輒以手批「頰」數四","D":"侍者「為」之悚慄"},"an":"B","nt":[{"n":1,"term":"矍然","text":"驚視貌。矍，音ㄐㄩㄝˊ"}],"gn":[]},{"id":"CAP-106-國文-46","y":"106","n":46,"ax":"G-classical","df":"進階","pr":0.55,"gc":"佟中丞鳳彩巡撫河南，年已老，每日五鼓，燃燭治文書，或坐倦假寐，少頃，輒矍然 1 起，自呼其名曰：「佟某，汝為朝廷大臣，封疆之重，皆汝肩之，奈何不任事若此！」輒以手批頰數四。侍者為之悚慄。\n中丞在豫，恩澤普及，豫人感其德，猶繪像祀之。\n――改寫自葛虛存《清代名人軼事》","gi":"請閱讀以下短文，並回答45～46題：","st":"根據本文的敘述，可推知佟中丞的為人如何？","op":{"A":"自許甚高，治事嚴謹","B":"嫉惡如仇，律下嚴厲","C":"貧賤不移，威武不屈","D":"豁達大度，不拘小節"},"an":"A","nt":[],"gn":[]},{"id":"CAP-106-國文-47","y":"106","n":47,"ax":"G-classical","df":"挑戰","pr":0.51,"gc":"甲：扶桑 1 已在渺茫中，家在扶桑東更東。\n此去與師誰共到？一船明月一帆風。\n――韋莊〈送日本國僧敬龍歸〉乙：揚子江頭楊柳春，楊花愁煞渡江人。\n數聲風笛離亭晚，君向瀟湘我向秦。\n――鄭谷〈淮上與友人別〉","gi":"請閱讀以下詩文，並回答47～48題：","st":"關於這兩首詩的內容，下列敘述何者正確？","op":{"A":"甲詩描寫時間為晚上，乙詩描寫時間是清晨","B":"甲詩送別地點在扶桑，乙詩分別地點在揚子江","C":"甲詩作者將與友人同行，乙詩作者送友人獨往","D":"甲詩友人以船為交通工具，乙詩友人亦是如此"},"an":"D","nt":[{"n":1,"term":"扶桑","text":"相傳東海外有神木名為扶桑，是日出之地。亦為日本別名"}],"gn":[]},{"id":"CAP-106-國文-48","y":"106","n":48,"ax":"G-classical","df":"挑戰","pr":0.42,"gc":"甲：扶桑 1 已在渺茫中，家在扶桑東更東。\n此去與師誰共到？一船明月一帆風。\n――韋莊〈送日本國僧敬龍歸〉乙：揚子江頭楊柳春，楊花愁煞渡江人。\n數聲風笛離亭晚，君向瀟湘我向秦。\n――鄭谷〈淮上與友人別〉","gi":"請閱讀以下詩文，並回答47～48題：","st":"關於這兩首詩的寫作手法，下列敘述何者正確？","op":{"A":"甲乙兩詩皆遲至末句才點出友人前行的目的地","B":"甲乙兩詩各自重複某些字詞，增添詩的節奏感","C":"甲詩由眼前景寫到想像景，乙詩從想像景寫到眼前景","D":"甲詩只有二、四句用韻，乙詩是一、二、四句皆用韻 13 試題結束"},"an":"B","nt":[],"gn":[]},{"id":"CAP-107-國文-10","y":"107","n":10,"ax":"S-classical","df":"基礎","pr":0.75,"gc":"","gi":"","st":"「九宮格內用細線界一井字，以均布字之點畫，凡字無論疏密斜正，必有精神挽結之處，是為字之中宮。然中宮有在實畫，有在虛白，必審其字之精神所注，而安置於格內之中宮。然後以其字之頭目手足分布於旁之八宮，則隨其長短虛實而上下左右皆相得矣。」這段文字所要說明的內容不包含下列何者？","op":{"A":"強調墨色的層次變化","B":"精究字體精神之所在","C":"重視字體的均衡美感","D":"指出筆畫的布局原則"},"an":"A","nt":[],"gn":[]},{"id":"CAP-107-國文-17","y":"107","n":17,"ax":"S-classical","df":"進階","pr":0.59,"gc":"","gi":"","st":"「家國身猶負，星霜鬢已侵。」句中以「霜」來形容鬢髮變白。下列詩句中的「霜」字，何者也是指鬢髮變白？","op":{"A":"不知明鏡裡，何處得秋霜","B":"遙夜一美人，羅衣霑秋霜","C":"心隨朗日高，志與秋霜潔","D":"五月思貂裘，謂言秋霜落"},"an":"A","nt":[],"gn":[]},{"id":"CAP-107-國文-22","y":"107","n":22,"ax":"S-classical","df":"挑戰","pr":0.54,"gc":"","gi":"","st":"「今之士俗，無不好詩，甫就小學，必甘心而馳騖焉。於是庸音雜體，人各為容。至使膏腴子弟，恥文不逮，終朝點綴，分夜呻吟。獨觀謂為警策 1，眾睹終淪平鈍。」作者寫作這段文字的用意，最可能是下列何者？","op":{"A":"歌頌詩風鼎盛，雅俗共賞","B":"憂心以詩取士，難得真才","C":"慨嘆詩風雖盛，但少有佳作","D":"讚嘆各類詩體兼備，蔚為大觀"},"an":"C","nt":[{"n":1,"term":"警策","text":"作品中精彩扼要足以驚動讀者的部分"}],"gn":[]},{"id":"CAP-107-國文-24","y":"107","n":24,"ax":"S-classical","df":"挑戰","pr":0.45,"gc":"","gi":"","st":"「秦王與中期爭論，不勝。秦王大怒，中期徐行而去。或為中期說秦王曰：『悍人也，中期！適遇明君故也。向者遇桀、紂，必殺之矣。』秦王因不罪。」根據這段文字，下列敘述何者正確？","op":{"A":"中期說服秦王不加罪於他","B":"秦王因中期與人爭論不勝而大怒","C":"中期徐行而去，表現其謙和的應對態度","D":"秦王不怪罪中期的原因是不願被比做桀、紂"},"an":"D","nt":[],"gn":[]},{"id":"CAP-107-國文-28","y":"107","n":28,"ax":"S-classical","df":"挑戰","pr":0.49,"gc":"","gi":"","st":"「去新城之北三十里，山漸深，草木泉石漸幽。初猶騎行石齒間，旁皆大松，曲者如蓋，直者如幢，立者如人，臥者如虯。松下草間有泉，沮洳伏見 1，墮石井，鏘然而鳴。松間藤數十尺，蜿蜒如大螈。其上有鳥，黑如鴝鵒，赤冠長喙，俯而啄，磔然有聲。」關於這段文字的寫作手法，下列敘述何者正確？","op":{"A":"文中寫松最為詳盡，有聲有色有形有狀","B":"以譬喻的手法描繪山間林木泉石與鳥鳴","C":"由小景寫至大景，層層推進，井然有序","D":"藉鏘然泉聲、磔然鳥聲反襯山林的幽靜"},"an":"D","nt":[{"n":1,"term":"沮洳伏見","text":"指泉水涓涓滲流在松下草間。沮洳，音ㄐㄩˋㄖㄨˋ"}],"gn":[]},{"id":"CAP-107-國文-29","y":"107","n":29,"ax":"S-classical","df":"挑戰","pr":0.46,"gc":"","gi":"","st":"「有客謂子野曰：『人皆謂公張三中，即心中事、眼中淚、意中人也。』公曰：『何不目之為張三影？』客不曉，公曰：『雲破月來花弄影；嬌柔懶起，簾壓捲花影；柳徑無人，墜輕絮無影：此余平生所得意也』。」根據這段文字，下列敘述何者錯誤？","op":{"A":"子野詞作風格以婉約、柔美為主","B":"寫作用字，子野有其特殊的喜好","C":"子野自認平生佳作無多，僅此三則","D":"世人稱許之處，子野未必全盤同意"},"an":"C","nt":[],"gn":[]},{"id":"CAP-107-國文-30","y":"107","n":30,"ax":"S-classical","df":"挑戰","pr":0.49,"gc":"","gi":"","st":"「一人疾焉而醫者十，並使之歟？」曰：「使其尤良者一人焉爾。」「烏知其尤良而使之？」曰：「眾人之所謂尤良者，而隱 1 之以吾心，其可也。夫材不相逮，不相為謀，又相忌也。人之愚不能者常多，而智能者常少，醫者十，愚不能者烏知其不九邪？並使之，一日而病且亡，誰者任 2 其咎邪？」作者在這段文字中雖論使醫治病，但用意卻在談用人治國之理。據此，作者主張在上位者應該如何？","op":{"A":"眾口交譽之人，直接任用","B":"善於汰劣擢優，委賢重任","C":"務求廣納眾議，興利除弊","D":"使愚智不相忌，同心為國"},"an":"B","nt":[{"n":1,"term":"隱","text":"詳細考量"},{"n":2,"term":"任","text":"擔當、承受"}],"gn":[]},{"id":"CAP-107-國文-31","y":"107","n":31,"ax":"S-classical","df":"挑戰","pr":0.51,"gc":"","gi":"","st":"【甲】春雪滿空來，觸處似花開。不知園裡樹，若個 1 是真梅？【乙】牆角數枝梅，凌寒獨自開。遙知不是雪，為有暗香來。根據甲、乙兩詩的內涵，下列敘述何者最恰當？","op":{"A":"甲詩以梅喻雪，乙詩以雪喻梅","B":"甲詩主題是詠雪，乙詩主題是詠梅","C":"兩詩所描繪的都是暮春夜晚的景致","D":"兩詩作者都無法分辨眼前所見是雪還是梅"},"an":"B","nt":[{"n":1,"term":"若個","text":"哪個"}],"gn":[]},{"id":"CAP-107-國文-32","y":"107","n":32,"ax":"S-classical","df":"挑戰","pr":0.39,"gc":"","gi":"","st":"子胥出逃，邊候 1 得之。子胥曰：「上索我者，以我有美珠也。今我已亡之矣，我將謂子取而吞之。」候因釋之。根據這段文字，下列敘述何者正確？","op":{"A":"子胥用言語威脅邊候以求自保","B":"子胥以美珠賄賂邊候換取自由","C":"邊候侵吞子胥的美珠又誣陷他","D":"邊候相信子胥的清白而釋放他"},"an":"A","nt":[{"n":1,"term":"邊候","text":"邊吏"}],"gn":[]},{"id":"CAP-107-國文-33","y":"107","n":33,"ax":"S-classical","df":"挑戰","pr":0.24,"gc":"","gi":"","st":"隋煬帝善屬文 1 ，而不欲人出其右，司隸薛道衡由是得罪。後因事誅之，曰：「更能作『空梁落燕泥』否？」根據這段文字，可以推知下列何者？","op":{"A":"煬帝命薛道衡作詩，薛因抗命而被殺","B":"薛道衡死後，煬帝感嘆再也無人能出其右","C":"薛道衡因事被誅，臨刑以「空梁」一詩明志","D":"煬帝嫉妒薛道衡能有「空梁落燕泥」這等佳句"},"an":"D","nt":[{"n":1,"term":"屬文","text":"連綴字句而成文，指寫文章"}],"gn":[]},{"id":"CAP-107-國文-44","y":"107","n":44,"ax":"G-classical","df":"進階","pr":0.67,"gc":"朱梁時，青州有賈客泛海遇風，飄至一處，遠望有山川城郭。海師曰：「往昔遭風，未嘗至此。吾聞鬼國在是，莫非此耶？」頃之，舟至岸，因登岸，向城而去。其廬舍田畝，不殊中國。見人皆揖之，而人皆不見己。至城，有守門者，揖之，亦不應。入城，屋室人物甚殷，遂至王宮。正值大宴，群臣侍宴者數十，其器用絲竹陳設之類，多類中國。客因升殿，俯逼王座以窺之。俄而王有疾，左右扶還，亟召巫者視之。巫至，曰：「有陽地人至此，陽氣逼人，故王病。其人偶來爾，無心為祟，以飲食車馬謝遣之，可矣。」即具酒食，設座於別室，巫及其群臣皆來祀祝，客據案而食。俄有僕夫馭馬而至，客亦乘馬而歸，至岸登舟，國人竟不見己，復遇便風得歸。時賀德儉為青州節度，與魏博節度楊師厚有親，因遣此客使魏，其為師厚言之。魏人范宣古親聞其事，為余言。\n――改寫自《太平廣記．青州客》","gi":"請閱讀以下短文，並回答44～46題：","st":"故事中雙底線處所省略的主詞，何者不是 青州客？","op":{"A":"向城而去","B":"見人皆揖之","C":"亦不應","D":"復遇便風得歸"},"an":"C","nt":[],"gn":[]},{"id":"CAP-107-國文-45","y":"107","n":45,"ax":"G-classical","df":"挑戰","pr":0.42,"gc":"朱梁時，青州有賈客泛海遇風，飄至一處，遠望有山川城郭。海師曰：「往昔遭風，未嘗至此。吾聞鬼國在是，莫非此耶？」頃之，舟至岸，因登岸，向城而去。其廬舍田畝，不殊中國。見人皆揖之，而人皆不見己。至城，有守門者，揖之，亦不應。入城，屋室人物甚殷，遂至王宮。正值大宴，群臣侍宴者數十，其器用絲竹陳設之類，多類中國。客因升殿，俯逼王座以窺之。俄而王有疾，左右扶還，亟召巫者視之。巫至，曰：「有陽地人至此，陽氣逼人，故王病。其人偶來爾，無心為祟，以飲食車馬謝遣之，可矣。」即具酒食，設座於別室，巫及其群臣皆來祀祝，客據案而食。俄有僕夫馭馬而至，客亦乘馬而歸，至岸登舟，國人竟不見己，復遇便風得歸。時賀德儉為青州節度，與魏博節度楊師厚有親，因遣此客使魏，其為師厚言之。魏人范宣古親聞其事，為余言。\n――改寫自《太平廣記．青州客》","gi":"請閱讀以下短文，並回答44～46題：","st":"根據故事內容，下列敘述何者正確？","op":{"A":"青州客登岸所見的房舍田畝，皆與中國不同","B":"國王生病的原因是青州客接近王座窺探","C":"巫師建議大肆祝祀並齋戒沐浴以接待青州客","D":"青州客遠離時，王國中的人皆避而不見"},"an":"B","nt":[],"gn":[]},{"id":"CAP-107-國文-46","y":"107","n":46,"ax":"G-classical","df":"挑戰","pr":0.53,"gc":"朱梁時，青州有賈客泛海遇風，飄至一處，遠望有山川城郭。海師曰：「往昔遭風，未嘗至此。吾聞鬼國在是，莫非此耶？」頃之，舟至岸，因登岸，向城而去。其廬舍田畝，不殊中國。見人皆揖之，而人皆不見己。至城，有守門者，揖之，亦不應。入城，屋室人物甚殷，遂至王宮。正值大宴，群臣侍宴者數十，其器用絲竹陳設之類，多類中國。客因升殿，俯逼王座以窺之。俄而王有疾，左右扶還，亟召巫者視之。巫至，曰：「有陽地人至此，陽氣逼人，故王病。其人偶來爾，無心為祟，以飲食車馬謝遣之，可矣。」即具酒食，設座於別室，巫及其群臣皆來祀祝，客據案而食。俄有僕夫馭馬而至，客亦乘馬而歸，至岸登舟，國人竟不見己，復遇便風得歸。時賀德儉為青州節度，與魏博節度楊師厚有親，因遣此客使魏，其為師厚言之。魏人范宣古親聞其事，為余言。\n――改寫自《太平廣記．青州客》","gi":"請閱讀以下短文，並回答44～46題：","st":"文末「時賀德儉為青州節度，與魏博節度楊師厚有親，因遣此客使魏，其為師厚言之。魏人范宣古親聞其事，為余言。」這段文字的作用最可能是下列何者？","op":{"A":"顯示作者的交遊廣闊","B":"點出故事發生的地點","C":"表明作者的身分、來歷","D":"強調故事內容言而有據"},"an":"D","nt":[],"gn":[]},{"id":"CAP-107-國文-47","y":"107","n":47,"ax":"G-classical","df":"挑戰","pr":0.47,"gc":"有疑陶淵明詩篇篇有酒，吾觀其意不在酒，亦寄酒為跡者也。其文章不群，辭采精拔，跌宕昭彰，獨超眾類，抑揚爽朗，莫之與京 1。橫素波而傍流，干青雲而直上。語時事則指而可想，論懷抱則曠而且真。加以貞志不休，安道苦節，不以躬耕為恥，不以無財為病。自非大賢篤志，孰能如此乎？余愛嗜其文，不能釋手，尚想其德，恨不同時。\n――改寫自蕭統〈陶淵明集序〉","gi":"請閱讀以下短文，並回答47～48題：","st":"根據本文，下列句意說明何者正確？","op":{"A":"亦寄酒為跡者也――有酒之處必有陶淵明蹤跡","B":"抑揚爽朗，莫之與京――文章起伏跌宕、清朗通達，無人能及","C":"干青雲而直上――志向遠大，在仕途上也曾飛黃騰達","D":"尚想其德，恨不同時――感嘆自己德行高潔卻生不逢時"},"an":"B","nt":[{"n":1,"term":"莫之與「京」","text":"齊等"}],"gn":[]},{"id":"CAP-107-國文-48","y":"107","n":48,"ax":"G-classical","df":"進階","pr":0.68,"gc":"有疑陶淵明詩篇篇有酒，吾觀其意不在酒，亦寄酒為跡者也。其文章不群，辭采精拔，跌宕昭彰，獨超眾類，抑揚爽朗，莫之與京 1。橫素波而傍流，干青雲而直上。語時事則指而可想，論懷抱則曠而且真。加以貞志不休，安道苦節，不以躬耕為恥，不以無財為病。自非大賢篤志，孰能如此乎？余愛嗜其文，不能釋手，尚想其德，恨不同時。\n――改寫自蕭統〈陶淵明集序〉","gi":"請閱讀以下短文，並回答47～48題：","st":"根據本文，無法得知下列何者？","op":{"A":"陶淵明詩多以酒為寫作題材","B":"陶淵明詩文在當時獨樹一格","C":"作者對陶淵明極為欣賞崇敬","D":"後世文壇深受陶淵明的影響 13 試題結束"},"an":"D","nt":[],"gn":[]},{"id":"CAP-108-國文-8","y":"108","n":8,"ax":"S-classical","df":"基礎","pr":0.76,"gc":"","gi":"","st":"「暇時引讀瑤篇，座前見水華木翠。夜裡趣摘章句，紙上有月白風清。」這段文字主要在描寫下列何種意趣？","op":{"A":"跋涉山水，遍覽自然風光","B":"閒暇遊逛園林，聆賞天籟之趣","C":"開卷吟誦，書中自有雋雅美景","D":"揮毫點染，筆下有無限清風明月"},"an":"C","nt":[],"gn":[]},{"id":"CAP-108-國文-15","y":"108","n":15,"ax":"S-classical","df":"進階","pr":0.67,"gc":"","gi":"","st":"「我向默默耕耘者學習等待，也向堅持不懈者學習勇敢；我從高傲的人身上學會了彎腰，也從奢靡的人身上學到了簡樸。」這段文句最能呼應《論語》中的哪一段話？","op":{"A":"學而時習之，不亦說乎","B":"人之過也，各於其黨。觀過，斯知仁矣","C":"三人行，必有我師焉。擇其善者而從之，其不善者而改之","D":"君子不重則不威，學則不固。主忠信。無友不如己者。過則勿憚改"},"an":"C","nt":[],"gn":[]},{"id":"CAP-108-國文-19","y":"108","n":19,"ax":"S-classical","df":"進階","pr":0.68,"gc":"","gi":"","st":"「學書之法，初學分布，但求平正；既知平正，務追險絕；既能險絕，復歸平正。初謂未及，中則過之，後乃通會。」這段話的寫作用意，最可能是下列何者？","op":{"A":"說明學習書法的不同階段與進境","B":"強調練習書法時要有正確的心態","C":"提醒常人不應追求艱難的書法技巧","D":"指出書法的最高境界在於標新立異"},"an":"A","nt":[],"gn":[]},{"id":"CAP-108-國文-22","y":"108","n":22,"ax":"S-classical","df":"進階","pr":0.57,"gc":"","gi":"","st":"「諸葛武侯文采不豔，然其〈出師〉二表至今為學者膾炙，有志之士擊節讀之，有至於嗟嘆流涕者。六朝、隋、唐文人動輒百數十篇，穠華纖巧，極其雕飾，或卒無一語可傳。然則文之為文，豈必多且麗乎哉？」根據這段文字，下列何者最符合作者的觀點？","op":{"A":"文章之優劣，取決於作者的學識修養與文采表現","B":"寫作不宜過度雕章琢句，當以抒發情志、感動人心為佳","C":"六朝文人多投注心力於雕飾辭藻，以致作品質精而量少","D":"諸葛武侯文采不豔，唯〈出師〉二表典麗華美，膾炙人口"},"an":"B","nt":[],"gn":[]},{"id":"CAP-108-國文-23","y":"108","n":23,"ax":"S-classical","df":"挑戰","pr":0.53,"gc":"","gi":"","st":"金陵城北有湖，名園勝境，掩映如畫。一日，諸臣待漏1朝堂，語及林泉之事，坐間馮謐舉唐玄宗賜賀知章三百里鏡湖，曰：「予非敢望此，但賜後湖，亦暢予平生也。」吏部徐鉉怡聲而對曰：「主上尊賢待士，常恐不及，豈惜一後湖？所乏者知章爾。」馮大有慚色。根據本文，下列敘述何者正確？","op":{"A":"徐鉉覺得馮謐之才不及賀知章","B":"徐鉉安慰馮謐他日終將獲得賞賜","C":"徐鉉認為三百里鏡湖應賞賜給馮謐","D":"徐鉉暗示馮謐應知所進退、歸隱山林"},"an":"A","nt":[{"n":1,"term":"待漏","text":"古群臣聽漏刻入朝，後用以比喻將入朝時"}],"gn":[]},{"id":"CAP-108-國文-27","y":"108","n":27,"ax":"S-classical","df":"挑戰","pr":0.41,"gc":"","gi":"","st":"趙簡子問於壯馳茲曰：「東方之士孰為愈1？」壯馳茲曰：「敢賀！」簡子曰：「未應吾問，何賀？」對曰：「臣聞之：國家將興也，君子自以為不足；其亡也，若有餘。今子任晉國之政，而問及小人，又求賢人，吾是以賀。」根據這段文字，趙簡子之所以得到壯馳茲的祝賀，其原因最可能是下列何者？","op":{"A":"取得晉國執政權","B":"能明辨小人與賢人","C":"具備禮賢下士的態度","D":"已找到東方最好的謀士"},"an":"C","nt":[{"n":1,"term":"愈","text":"高明"}],"gn":[]},{"id":"CAP-108-國文-28","y":"108","n":28,"ax":"S-classical","df":"進階","pr":0.55,"gc":"","gi":"","st":"「君子不以口譽人，則民盡忠勸善。故君子問人之寒則衣之，問人之飢則食之，稱人之美則爵1之。」由這段話可知，為政者對待人民的原則應是下列何者？","op":{"A":"循循善誘的教化","B":"公平公正的賞罰","C":"無微不至的關懷","D":"具體實惠的行動"},"an":"D","nt":[{"n":1,"term":"爵","text":"予以官位"}],"gn":[]},{"id":"CAP-108-國文-29","y":"108","n":29,"ax":"S-classical","df":"進階","pr":0.56,"gc":"","gi":"","st":"「古之治天下，朝有進善之旌，誹謗之木，所以通治道而來諫者。今法有誹謗妖言之罪，是使眾臣不敢盡情，而上無由聞過失也。將何以來遠方之賢良？其除之。」文中「其除之」的「之」字所代稱的對象為何？","op":{"A":"進善之旌","B":"誹謗之木","C":"誹謗妖言之罪","D":"遠方之賢良"},"an":"C","nt":[],"gn":[]},{"id":"CAP-108-國文-32","y":"108","n":32,"ax":"S-classical","df":"挑戰","pr":0.5,"gc":"","gi":"","st":"東坡云：「歐公喜古人『竹徑通幽處，禪房花木深』、『柳塘春水漫，花塢夕陽遲』，自言終身學不能到。此固佳句，特鳳凰一毛耳。公之才若垂天之雲，彼何足道？豈厭八珍乃喜螺蛤耶？」根據這段文字，下列何者與東坡的看法最接近？","op":{"A":"詩文創作應該力求質樸，不求精鍊","B":"歐公謙沖為懷，其實才華洋溢，遠勝古人","C":"前人「竹徑」、「柳塘」之句境界高雅，歐公不能及","D":"由歐公喜「竹徑」、「柳塘」句可知，文人難免敝帚自珍"},"an":"B","nt":[],"gn":[]},{"id":"CAP-108-國文-33","y":"108","n":33,"ax":"S-classical","df":"挑戰","pr":0.41,"gc":"","gi":"","st":"「 學 不 得 法 ， 猶 願 魚 而 無 網 ， 心 雖 勤 而 無 獲 ； 若 得 其 要 ， 猶 順 流 馭 舟 ， __________。」根據文意，畫線處填入下列何者最恰當？","op":{"A":"心不知其所往","B":"氣不礙其暢達","C":"意不盡而有餘","D":"體不勞而致遠"},"an":"D","nt":[],"gn":[]},{"id":"CAP-108-國文-34","y":"108","n":34,"ax":"S-classical","df":"挑戰","pr":0.32,"gc":"","gi":"","st":"據說盆景始於漢、唐，盛於兩宋。明朝 吳縣人王鏊作《姑蘇志》有云：「虎丘人善於盆中植奇花異卉，盤松古梅，置之几案，清雅可愛，謂之盆景。」是姑蘇不僅擅園林之美，且以盆景之製作馳譽於一時。劉鑾《五石瓠》：「吾人以盆盎間樹石為玩，長者屈而短之，大者削而約之，或膚寸而結果實，或咫尺而蓄蟲魚，蓋稱盆景，元人謂之些子景。」些子大概是元人語，細小之意。根據這段文字，下列敘述何者正確？","op":{"A":"王鏊始創盆景，虎丘人稱美其作品清雅可愛","B":"元朝人劉鑾稱盆景為些子景，取其細小之意","C":"姑蘇人不擅營造園林之美，但以製作盆景馳名","D":"古人多以屈長削大的方式製作盆景，求其精巧"},"an":"D","nt":[],"gn":[]},{"id":"CAP-108-國文-45","y":"108","n":45,"ax":"G-classical","df":"進階","pr":0.62,"gc":"野火燎荒原，霜雪日皜皜1。牛羊無可噍2，眾綠就枯槁。天地心不泯，根芽蟄深杳3。春風一披拂，顏色還媚好。如何被兵地，黎庶不自保。高門先破碎，大屋例傾倒。間或遇茅舍，呻吟遺稚老。常恐馬蹄響，無罪被擒討。逃奔深谷中，又懼虎狼咬。一朝稍甦息，追胥4復紛擾。人生值艱難，不如路傍草。\n――改寫自方回〈路傍草〉","gi":"請閱讀以下詩文，並回答45～46題：","st":"關於本詩的分析，下列敘述何者錯誤？","op":{"A":"是一韻到底的五言古詩","B":"可歸類為社會寫實派的作品","C":"通篇使用倒敘手法追述沿途所見","D":"內容包含戰亂與官吏壓迫的描述"},"an":"C","nt":[{"n":1,"term":"皜皜","text":"潔白貌。皜，音ㄏㄠˋ"},{"n":2,"term":"噍","text":"音ㄐㄧㄠˋ，嚼"},{"n":3,"term":"蟄深杳","text":"蟄，伏藏。深杳，很深"},{"n":4,"term":"追胥","text":"催徵賦稅的小吏"}],"gn":[]},{"id":"CAP-108-國文-46","y":"108","n":46,"ax":"G-classical","df":"進階","pr":0.64,"gc":"野火燎荒原，霜雪日皜皜1。牛羊無可噍2，眾綠就枯槁。天地心不泯，根芽蟄深杳3。春風一披拂，顏色還媚好。如何被兵地，黎庶不自保。高門先破碎，大屋例傾倒。間或遇茅舍，呻吟遺稚老。常恐馬蹄響，無罪被擒討。逃奔深谷中，又懼虎狼咬。一朝稍甦息，追胥4復紛擾。人生值艱難，不如路傍草。\n――改寫自方回〈路傍草〉","gi":"請閱讀以下詩文，並回答45～46題：","st":"本詩的主旨最可能是下列何者？","op":{"A":"與其羨慕路傍草，不如勇於面對人生困境","B":"嚴冬野草尚有生機，人在亂世卻難以生存","C":"人當學習野草深植其根、燎而復生的精神","D":"讚賞路傍草隨遇而安，高門茅舍皆可生長"},"an":"B","nt":[],"gn":[]},{"id":"CAP-108-國文-47","y":"108","n":47,"ax":"G-classical","df":"挑戰","pr":0.39,"gc":"【甲】\n司馬昭專權，帝欲殺之，反為賈充、成濟所害。昭入殿中，召群臣會議。尚書左僕射陳泰不至，昭使其舅尚書荀顗召之，泰曰：「世之論者以泰方於舅，今舅不如泰也。」子弟內外咸共逼之，乃入，見昭，悲慟，昭亦對之泣曰：「卿何以處我？」泰曰：「獨有斬賈充，少可以謝天下耳。」昭久之曰：「卿更思其次。」泰曰：「惟有進於此，不知其次。」昭乃不復更言。\n――改寫自《資治通鑑•魏紀九》\n【乙】\n帝崩，內外喧譁。司馬昭問陳泰曰：「何以靜之？」泰云：「唯殺賈充以謝天下。」昭曰：「可復下此否？」對曰：「但見其上，未見其下。」\n――改寫自《世說新語•方正》","gi":"以下是兩篇內容相關的短文，請閱讀並回答47～48題：","st":"關於甲篇中的人物，下列推論何者最恰當？","op":{"A":"賈充是司馬昭陣營的人馬","B":"陳泰為了救荀顗而見司馬昭","C":"司馬昭與陳泰因權臣橫行而對泣","D":"眾人認為陳泰應比荀顗早一步進宮"},"an":"A","nt":[],"gn":[]},{"id":"CAP-108-國文-48","y":"108","n":48,"ax":"G-classical","df":"挑戰","pr":0.39,"gc":"【甲】\n司馬昭專權，帝欲殺之，反為賈充、成濟所害。昭入殿中，召群臣會議。尚書左僕射陳泰不至，昭使其舅尚書荀顗召之，泰曰：「世之論者以泰方於舅，今舅不如泰也。」子弟內外咸共逼之，乃入，見昭，悲慟，昭亦對之泣曰：「卿何以處我？」泰曰：「獨有斬賈充，少可以謝天下耳。」昭久之曰：「卿更思其次。」泰曰：「惟有進於此，不知其次。」昭乃不復更言。\n――改寫自《資治通鑑•魏紀九》\n【乙】\n帝崩，內外喧譁。司馬昭問陳泰曰：「何以靜之？」泰云：「唯殺賈充以謝天下。」昭曰：「可復下此否？」對曰：「但見其上，未見其下。」\n――改寫自《世說新語•方正》","gi":"以下是兩篇內容相關的短文，請閱讀並回答47～48題：","st":"根據甲篇內容，可推測乙篇陳泰所言「但見其上，未見其下」的涵義最可能是下列何者？","op":{"A":"指出賈充屢獲晉升卻未曾被貶官","B":"認為殺賈充是最起碼的處置方式","C":"批評司馬昭遇事時未能顧及下屬","D":"諷刺司馬昭只知媚上卻無法服眾 13 試題結束"},"an":"B","nt":[],"gn":[]},{"id":"CAP-109-國文-11","y":"109","n":11,"ax":"S-classical","df":"進階","pr":0.74,"gc":"","gi":"","st":"「杲杲1冬日出，照我屋南隅。負暄閉目坐，和氣生肌膚。初似飲醇醪2，又如蟄者蘇。外融百骸暢，中適一念無。曠然忘所在，心與虛空俱。」關於這首詩的分析，下列敘述何者正確？","op":{"A":"本詩為一韻到底的五言律詩","B":"以飲美酒比喻午後昏昏欲睡的狀態","C":"描寫層次由外而內，鋪陳歡聚之樂","D":"呈現冬日曬太陽時，閒適自得的心境"},"an":"D","nt":[{"n":1,"term":"杲杲","text":"日光明亮。杲，音ㄍㄠˇ"},{"n":2,"term":"醇醪","text":"美酒。醪，音ㄌㄠˊ"}],"gn":[]},{"id":"CAP-109-國文-16","y":"109","n":16,"ax":"S-classical","df":"進階","pr":0.68,"gc":"","gi":"","st":"荊州街子葛清，自頸以下，遍刺白居易舍人詩。荊客陳至呼觀之，令其自解，背上亦能暗記。反手指其札處，至「不是花中偏愛菊」，則有一人持杯臨菊叢。又「黃夾纈林1寒有葉」，則指一樹，樹上掛纈2，纈上花紋極細。凡刻三十餘首，體無完膚，陳至贊為「白舍人行詩圖」也。根據這段文字，下列關於葛清的敘述，何者正確？","op":{"A":"刺青內容取自白詩","B":"獲贈白舍人行詩圖","C":"主動展示身上的圖文","D":"詩句圖文皆刺在背部"},"an":"A","nt":[{"n":1,"term":"黃夾纈林","text":"林木盡成黃色"},{"n":2,"term":"纈","text":"音ㄒㄧㄝˊ，印染花紋的絲織品"}],"gn":[]},{"id":"CAP-109-國文-18","y":"109","n":18,"ax":"S-classical","df":"進階","pr":0.65,"gc":"","gi":"","st":"「用兵久則驕惰自生，驕惰則未有不敗者。勤字所以醫惰，慎字所以醫驕，二字之先，須有一誠字以為本。立意要將此事知得透，辨得穿。精誠所至，金石為開，鬼神亦避，此在己之誠也。」根據這段文字，下列敘述何者正確？","op":{"A":"祭祀鬼神，心誠則靈","B":"勤慎用兵，以誠為本","C":"慎可以醫惰，勤可以醫驕","D":"修身首重勤，次為慎，終為誠"},"an":"B","nt":[],"gn":[]},{"id":"CAP-109-國文-22","y":"109","n":22,"ax":"S-classical","df":"挑戰","pr":0.49,"gc":"","gi":"","st":"「鳩摩羅什願凡所宣譯傳流後世，每云：『天竺國俗甚重文制，其宮商體韻以入弦為善，以歌嘆為貴。改梵為漢，失其藻蔚，雖得大意，殊隔文體。有似嚼飯與人，非徒失味，乃令嘔也。』」根據這段文字，下列何者最符合鳩摩羅什對譯經的看法？","op":{"A":"可因國情不同而修改內容","B":"首要關鍵在於音律的和諧","C":"應避免以華麗辭藻干擾文意","D":"保留原文形式之美並不容易"},"an":"D","nt":[],"gn":[]},{"id":"CAP-109-國文-23","y":"109","n":23,"ax":"S-classical","df":"進階","pr":0.63,"gc":"","gi":"","st":"皮日休詠房、杜1詩云：「黃閣2三十年，清風一萬古。」凡言千古萬古者，皆是無窮之意，今下「一」字，便有所止矣。根據這則詩評，下列關於皮日休詩的敘述何者最恰當？","op":{"A":"用字遣詞多落入俗套","B":"數字對仗工整，可稱佳作","C":"詩句用字精確，傳誦千古","D":"「一」字影響了詩句的意境"},"an":"D","nt":[{"n":1,"term":"房、杜","text":"指唐代名相房玄齡、杜如晦"},{"n":2,"term":"黃閣","text":"宰相"}],"gn":[]},{"id":"CAP-109-國文-25","y":"109","n":25,"ax":"S-classical","df":"挑戰","pr":0.45,"gc":"","gi":"","st":"龍眼枝甚柔脆，熟時賃慣手1登採，恐其恣食，與約曰：「唱勿輟，輟則無薪。」樹枝扶疏，人坐綠蔭中，高低斷續，喁喁2弗已。遠聽之，頗足娛耳。土人謂之「唱龍眼」。根據這段文字，可明確得知下列何者？","op":{"A":"主人肯錄用沒有經驗的人","B":"不諳歌唱的工人不予工資","C":"「唱龍眼」源自於主人防弊的手段","D":"採龍眼的工人喜在工作時彼此唱和"},"an":"C","nt":[{"n":1,"term":"慣手","text":"有經驗的人"},{"n":2,"term":"喁喁","text":"低語聲"}],"gn":[]},{"id":"CAP-109-國文-27","y":"109","n":27,"ax":"S-classical","df":"進階","pr":0.62,"gc":"","gi":"","st":"「客睡何曾著，秋天不肯明。入簾殘月影，高枕遠江聲。計拙無衣食，途窮仗友生1。老妻書數紙，應悉未歸情。」根據本詩，關於詩中主人翁的敘述，下列何者不正確？","op":{"A":"經濟拮据，生活困頓","B":"親友疏離，借貸無門","C":"生計無著，徹夜難眠","D":"夫妻分離，兩地相思"},"an":"B","nt":[{"n":1,"term":"友生","text":"朋友"}],"gn":[]},{"id":"CAP-109-國文-30","y":"109","n":30,"ax":"S-classical","df":"挑戰","pr":0.48,"gc":"","gi":"","st":"「大鐵椎 1，不知何許人。北平 陳子燦省兄河南，與遇宋將軍家。宋，懷慶青華鎮人，工技擊，七省好事者皆來學。人以其雄健，呼『宋將軍』云。」根據這段文字，可明確得知下列何者？","op":{"A":"大鐵椎是陳子燦的遠房兄長","B":"陳子燦與大鐵椎在宋府相遇","C":"宋將軍善使大鐵椎，故別名大鐵椎","D":"大鐵椎久慕陳子燦之能，從之學藝"},"an":"B","nt":[{"n":1,"term":"鐵椎","text":"即鐵槌。椎，音ㄔㄨㄟˊ"}],"gn":[]},{"id":"CAP-109-國文-32","y":"109","n":32,"ax":"S-classical","df":"挑戰","pr":0.47,"gc":"","gi":"","st":"「擷茶以黎明，見日則止。用爪斷芽，不以指揉，慮氣汗熏漬，茶不鮮潔，故茶工多以新汲水自隨，得芽則投諸水。凡芽如雀舌、穀粒者為鬥品1，一槍一旗2為揀芽，一槍二旗又次之，餘斯為下。茶之芽始萌則有白合，既擷則有烏蒂，白合不去害茶味，烏蒂不去害茶色。」根據這段文字，下列關於茶葉的敘述何者正確？","op":{"A":"在太陽剛升起時開始採茶","B":"茶工要自備飲水現場試茶","C":"一槍一旗為最上品的茶葉","D":"烏蒂會影響泡出來的顏色"},"an":"D","nt":[{"n":1,"term":"鬥品","text":"茶葉的精品"},{"n":2,"term":"一槍一旗","text":"一芽一葉"}],"gn":[]},{"id":"CAP-109-國文-33","y":"109","n":33,"ax":"S-classical","df":"挑戰","pr":0.52,"gc":"","gi":"","st":"有道士講經茅山，聽者數百人。有自外入者，大罵曰：「道士奴！天正熱，聚眾造妖何為？」道士起謝曰：「居山養徒，資用乏，不得不爾。」罵者怒少解，曰：「須錢不難，何至作此！」乃取釜灶杵臼之類，得百餘斤，以少藥鍛之，皆為銀，乃去。後數年，道士復見此人從一老道士，鬚髮如雪，騎白驢，此人腰插一驢鞭從其後。道士遙望叩頭，欲從之。此人指老道士，且搖手作驚畏狀，去如飛，少頃即不見。根據這則故事，下列關於「自外入者」的敘述何者正確？","op":{"A":"責罵道士搶走自己的信徒","B":"聽完道士說明後更加生氣","C":"被道士收買，為道士斂財","D":"擁有特殊藥物，鍛物成銀"},"an":"D","nt":[],"gn":[]},{"id":"CAP-109-國文-34","y":"109","n":34,"ax":"S-classical","df":"挑戰","pr":0.25,"gc":"","gi":"","st":"楚莊王謀事而當，群臣莫能逮，退朝而有憂色。申公巫臣進曰：「君朝而有憂色，何也？」楚王曰：「吾聞之：諸侯自擇師者王，自擇友者霸，足於己而群臣莫若之者亡。今以不穀1之不肖而議於朝，且群臣莫能逮，吾國其幾於亡矣，是以有憂色也。」根據這則故事，楚莊王有憂色的原因，最可能是下列何者？","op":{"A":"缺乏優秀人才輔政","B":"群臣不願追隨國君","C":"朝中小人當道亂政","D":"難以抉擇施政方向"},"an":"A","nt":[{"n":1,"term":"不穀","text":"古代君王自稱的謙詞"}],"gn":[]},{"id":"CAP-109-國文-45","y":"109","n":45,"ax":"G-classical","df":"挑戰","pr":0.38,"gc":"雅志堂後小室，名之曰「更衣」，以為姻賓憩息地。稚子數請所出，因錄班固《漢書》語示之：\n《漢書》：「坐乃起更衣。」顏師古注：「坐，坐中之人。更，改也。凡久坐者皆起更衣，以其寒暖或變也。」\n《漢書》又載：「延年起，至更衣。」顏師古注：「古者延賓必有更衣之處。」\n――改寫自洪邁《容齋隨筆》","gi":"請閱讀以下短文，並回答45～46題：","st":"根據本文，「稚子數請所出」句中「數請所出」的涵義最可能是下列何者？","op":{"A":"再三懇請父親出來宴客","B":"多次詢問小室命名由來","C":"屢次延請賓客前往休憩","D":"頻頻敦請姻賓離室用餐"},"an":"B","nt":[],"gn":[]},{"id":"CAP-109-國文-46","y":"109","n":46,"ax":"G-classical","df":null,"pr":null,"gc":"雅志堂後小室，名之曰「更衣」，以為姻賓憩息地。稚子數請所出，因錄班固《漢書》語示之：\n《漢書》：「坐乃起更衣。」顏師古注：「坐，坐中之人。更，改也。凡久坐者皆起更衣，以其寒暖或變也。」\n《漢書》又載：「延年起，至更衣。」顏師古注：「古者延賓必有更衣之處。」\n――改寫自洪邁《容齋隨筆》","gi":"請閱讀以下短文，並回答45～46題：","st":"根據本文，雅志堂後名為「更衣」的小室，其主要用途與現代哪一種場所最接近？","op":{"A":"兒童遊戲場","B":"商場試衣間","C":"婚禮宴會廳","D":"賓客休息室"},"an":"D","nt":[],"gn":[]},{"id":"CAP-109-國文-47","y":"109","n":47,"ax":"G-classical","df":"挑戰","pr":0.33,"gc":"治亂之本在君之好惡，好惡在所習。少習也正，其長也必賢；少習也不正，其長難與共為治矣。不幸而然，則將磨之。孰能磨之？擇人焉，朝夕相與俱，出入言動相綴接焉，是則可磨之也。主然1而是2者，助之；主然而違者，替之。不釋3，則極論之。除其蔽慾而接之以道，不使其見邪者而變焉，其志素定矣，然後可與共為治。\n――改寫自曾鞏〈論習〉","gi":"請閱讀以下短文，並回答47～48題：","st":"下列文句「」中的字，何者意義說明正確？","op":{"A":"「孰」能磨之：難道","B":"朝夕相與「俱」：具備","C":"主然而違者，「替」之：改變","D":"「接」之以道：招待"},"an":"C","nt":[{"n":1,"term":"然","text":"如此"},{"n":2,"term":"是","text":"正確"},{"n":3,"term":"釋","text":"了解"}],"gn":[]},{"id":"CAP-109-國文-48","y":"109","n":48,"ax":"G-classical","df":"挑戰","pr":0.47,"gc":"治亂之本在君之好惡，好惡在所習。少習也正，其長也必賢；少習也不正，其長難與共為治矣。不幸而然，則將磨之。孰能磨之？擇人焉，朝夕相與俱，出入言動相綴接焉，是則可磨之也。主然1而是2者，助之；主然而違者，替之。不釋3，則極論之。除其蔽慾而接之以道，不使其見邪者而變焉，其志素定矣，然後可與共為治。\n――改寫自曾鞏〈論習〉","gi":"請閱讀以下短文，並回答47～48題：","st":"下列敘述何者最貼近本文的內容？","op":{"A":"大臣輔政須能執行上意","B":"大臣應經磨練方能輔政","C":"國君擇臣宜摒除個人好惡","D":"國君所習攸關天下之治亂 13 試題結束"},"an":"D","nt":[],"gn":[]},{"id":"CAP-110-國文-8","y":"110","n":8,"ax":"S-classical","df":"基礎","pr":0.77,"gc":"","gi":"","st":"「昔人未見麟，問嘗見者：『麟何類乎？』見者曰：『麟如麟也。』問者曰：『若吾嘗見麟，則不問子矣。而云麟如麟，寧可解哉？』見者曰：『麟者，麇1 身牛尾，鹿蹄馬背。』問者豁然而解。」根據這則故事，下列敘述何者最恰當？","op":{"A":"問者蓄意為難，明知故問","B":"見者實未曾見麟，信口開河","C":"問者終不得其解，寧可自尋答案","D":"見者最後以具體事物為喻，輔助說明"},"an":"D","nt":[{"n":1,"term":"麇","text":"音ㄐㄩㄣ，形體似鹿之獸"}],"gn":[]},{"id":"CAP-110-國文-9","y":"110","n":9,"ax":"S-classical","df":"基礎","pr":0.78,"gc":"","gi":"","st":"「落帆逗淮鎮，停舫臨孤驛。浩浩風起波，冥冥日沉夕。人歸山郭暗，雁下蘆洲白。獨夜憶秦關，聽鐘未眠客。」關於這首詩的分析，下列敘述何者最恰當？","op":{"A":"首兩句寫出與友餞別的地點與時間","B":"以「風起」、「日沉」自喻懷才不遇","C":"以「雁下蘆洲白」表示太陽將升起","D":"末兩句點出客因心有所思而不成眠"},"an":"D","nt":[],"gn":[]},{"id":"CAP-110-國文-17","y":"110","n":17,"ax":"S-classical","df":"進階","pr":0.62,"gc":"","gi":"","st":"「洛陽之俗，大抵好牡丹，春時城中無分貴賤皆插花，雖負擔者亦然。花開時，士庶競為遊遨，至花落乃罷。洛陽至東京六驛，舊不進花，自今歲遣衙校一員，乘驛馬，一日一夕至京師。所進不過姚黃魏紫三數朵。以菜葉實竹籠子，藉1 覆之使馬上不動搖，以蠟封蒂，乃數日不落。」根據這段文字，下列關於牡丹的敘述何者最恰當？","op":{"A":"姚黃魏紫指的皆是牡丹","B":"洛陽權貴才有資格買牡丹","C":"牡丹運送前須以蠟整株封存","D":"牡丹運送時以菜葉提供其養分"},"an":"A","nt":[{"n":1,"term":"藉","text":"鋪墊"}],"gn":[]},{"id":"CAP-110-國文-25","y":"110","n":25,"ax":"S-classical","df":"挑戰","pr":0.49,"gc":"","gi":"","st":"辛棄疾〈西江月〉江行采石岸，戲作漁夫詞千丈懸崖削翠，一川落日鎔金。白鷗來往本無心。選甚風波一任。 別浦魚肥堪膾，前村酒美重斟。千年往事已沉沉。閒管興亡則甚。關於這闋詞的分析，下列敘述何者最恰當？","op":{"A":"題目為〈西江月〉，後附小序","B":"上、下片的首二句皆為對仗句","C":"上片先情後景，下片先景後情","D":"結尾寫出以天下為己任的抱負"},"an":"B","nt":[],"gn":[]},{"id":"CAP-110-國文-26","y":"110","n":26,"ax":"S-classical","df":"進階","pr":0.59,"gc":"","gi":"","st":"彭玉麟任江南巡按時，有人告訴他武昌知府靠逢迎拍馬才能升官。彭公聽了大怒，召知府來斥責，武昌知府恭謹地說：「卑職奉承的對象，都是喜歡被奉承的人，像大人您這樣公正嚴明，卑職再會奉承也沒有用啊！」彭公聽了得意地笑說：「我就知道你拍不了我的馬屁。」根據這則故事，關於彭公和武昌知府的敘述何者最不恰當？","op":{"A":"彭公自認不喜歡被人奉承","B":"彭公被拍了馬屁還不自知","C":"武昌知府不會對公正之人逢迎","D":"武昌知府逢迎拍馬的能力極佳"},"an":"C","nt":[],"gn":[]},{"id":"CAP-110-國文-27","y":"110","n":27,"ax":"S-classical","df":"挑戰","pr":0.42,"gc":"","gi":"","st":"王國維評姜白石詞：「古今詞人格調之高，無如白石。惜不於意境上用力，故覺無言外之味、弦外之響。終不能與於第一流之作者也。」下列何者最符合這段文字的觀點？","op":{"A":"白石非第一流之作者","B":"白石之詞善於經營意境","C":"有弦外之響者必是第一流詞作","D":"詞有言外之意方顯作者格調之高"},"an":"A","nt":[],"gn":[]},{"id":"CAP-110-國文-28","y":"110","n":28,"ax":"S-classical","df":"挑戰","pr":0.47,"gc":"","gi":"","st":"「淳于恭，字孟孫，北海人。人有盜刈 1恭禾者，恭見之，念其愧，因伏草中，至去乃起。」根據這則故事，下列敘述何者最恰當？","op":{"A":"當時五穀歉收，盜賊四處搶糧","B":"淳于恭個性溫厚寬容，能體恤他人","C":"北海地區盜賊兇悍，人民不敢與之對抗","D":"淳于恭伏於草中，乃因心中有愧，不欲見人"},"an":"B","nt":[{"n":1,"term":"刈","text":"音ㄧˋ，割取"}],"gn":[]},{"id":"CAP-110-國文-29","y":"110","n":29,"ax":"S-classical","df":"挑戰","pr":0.45,"gc":"","gi":"","st":"「夫山之異於眾者，尚能待人而自見，而況人之異於眾者哉！天於詭奇之地不多設，人於登臨之樂不常遇。有其地而非其人，有其人而非其地，皆不足以盡夫遊觀之樂也。今靈巖為名山，諸公為名士，蓋必相須而適相值，夫豈偶然哉！宜其目領而心解，景會而理得也。」下列敘述何者與這段文字中的觀點最接近？","op":{"A":"若能保持心靈的澄淨，所到之處都會是美景","B":"徜徉於大自然中，可洗滌世俗的汙濁與煩憂","C":"只要有名士登臨，無論怎樣的山水都可成為名勝","D":"要盡遊觀之樂，須有特別的景致與懂得欣賞的人"},"an":"D","nt":[],"gn":[]},{"id":"CAP-110-國文-30","y":"110","n":30,"ax":"S-classical","df":"挑戰","pr":0.48,"gc":"","gi":"","st":"胡旦晚年病目，閉門閒居。一日，史館共議作一貴侯傳，其人少賤，嘗屠豕豬。史官以為諱之即非實錄，書之即難為辭。相與見旦，旦曰：「何不曰『某少嘗操刀以割』，示有宰天下之志。」莫不嘆服。根據這則故事，下列關於胡旦的敘述何者最恰當？","op":{"A":"年少時曾操刀殺豬","B":"史官共議為其立傳","C":"史官因不知如何記實而登門求教","D":"眾人因其有宰割天下之志而嘆服"},"an":"C","nt":[],"gn":[]},{"id":"CAP-110-國文-31","y":"110","n":31,"ax":"S-classical","df":"挑戰","pr":0.45,"gc":"","gi":"","st":"「有覆於上者如天，載於下者如地，而百姓不之知。有恩信及一物，教化及一夫，民則歸之。其猶豐年與旱歲也：豐年之民，不知甘雨柔風之力，不知生育長養之仁，而曰：『我耕作以時，倉廩以實』。旱歲之民，則野枯苗縮，然後決川以灌之。然則一川之仁豈深於四時也哉？」下列何者最能與這段文字的意旨相呼應？","op":{"A":"對感情的得失順其自然，不執著強求","B":"平日砥礪心志，災禍發生時才能處變不驚","C":"購買生產過剩的農產品，幫助農民度過難關","D":"對外人的一時之助充滿感謝，卻忽略父母深恩"},"an":"D","nt":[],"gn":[]},{"id":"CAP-110-國文-32","y":"110","n":32,"ax":"S-classical","df":"挑戰","pr":0.48,"gc":"","gi":"","st":"「必備匙箸兩副，食前多品。擇取欲食者，以別箸取之，置一器中，食之必盡。飯前以別匙分而另置，始膳。吳后嘗問其故，曰：『不欲以殘食與宮人食也。』」這段文字記載宋高宗的用膳習慣，據此可看出他具備什麼樣的特質？","op":{"A":"用餐講究排場","B":"飲食注重養生","C":"對妻言聽計從","D":"待下體貼細心"},"an":"D","nt":[],"gn":[]},{"id":"CAP-110-國文-44","y":"110","n":44,"ax":"G-classical","df":"挑戰","pr":0.42,"gc":"陸羽《茶經》論水云：「山水上，石泉又上，江水次而井水下。」又「江水取去人遠者，井取汲多者。」其說止於此，未嘗品第天下之水味。張又新《煎茶水記》云劉伯芻謂水有七等，以揚子江為第一，惠山石泉為第二，虎丘井第三，淮水居末。又載羽為李季卿論水次第有二十種，江水居山水上，井水居江水上。二說皆與《茶經》不合。\n水味有美惡而已，欲求天下之水一一而次第之者，謬說也。羽之論水，惡渟浸１ 而喜泉源，故井取多汲者。江雖長，然眾水雜聚，故次山水。惟此說近物理云。\n――改寫自歐陽脩〈大明水記〉","gi":"請閱讀以下短文，並回答44～45題：","st":"根據本文，下列敘述何者最恰當？","op":{"A":"張又新將天下的水按水質分成二十種","B":"歐陽脩按水源的遠近和高低評定水質","C":"在《煎茶水記》中，張又新反駁劉伯芻看法","D":"依《茶經》論水的標準，揚子江優於虎丘井"},"an":"D","nt":[{"n":1,"term":"渟浸","text":"水停止不動"}],"gn":[]},{"id":"CAP-110-國文-45","y":"110","n":45,"ax":"G-classical","df":null,"pr":null,"gc":"陸羽《茶經》論水云：「山水上，石泉又上，江水次而井水下。」又「江水取去人遠者，井取汲多者。」其說止於此，未嘗品第天下之水味。張又新《煎茶水記》云劉伯芻謂水有七等，以揚子江為第一，惠山石泉為第二，虎丘井第三，淮水居末。又載羽為李季卿論水次第有二十種，江水居山水上，井水居江水上。二說皆與《茶經》不合。\n水味有美惡而已，欲求天下之水一一而次第之者，謬說也。羽之論水，惡渟浸１ 而喜泉源，故井取多汲者。江雖長，然眾水雜聚，故次山水。惟此說近物理云。\n――改寫自歐陽脩〈大明水記〉","gi":"請閱讀以下短文，並回答44～45題：","st":"關於本文的寫作手法，下列敘述何者最恰當？","op":{"A":"首段提出各家之說，末段表明作者的觀點","B":"首段評比水質高下，末段以各家之說佐證","C":"首段引述《茶經》的說法，末段舉各家之說駁斥","D":"首段分論不同水源的特性，末段以取水標準總結"},"an":"A","nt":[],"gn":[]},{"id":"CAP-110-國文-46","y":"110","n":46,"ax":"G-classical","df":null,"pr":null,"gc":"【甲】\n柳開少好任氣，大言凌物1。應舉時，以文章投於主考簾前，凡千軸，載以獨輪車。引試2 日，自擁車入，欲以此駭眾取名。其時張景能文有名，唯袖一書簾前獻之。主考大稱賞，擢景優等。時人為之語曰：「柳開千軸，不如張景一書。」\n――改寫自沈括《夢溪筆談》\n【乙】\n張景，字晦之，江陵 公安人。幼能長言，嗜學尤力。貧不治產，往從柳開。開以文自名，而薦寵士類，一見歡甚，悉出家書予之，由是屬辭益有法度。開每曰：「今朝中之士，誰踰晦之者！」即厚饋，使如京師。後中進士。\n――改寫自宋祁〈故大理評事張公3墓誌銘4〉【丙】相關人物簡表\n姓名 西元生卒年 中舉年分\n柳開 948～1001 973\n張景 970～1018 1000\n宋祁 998～1061 1024\n沈括 1031～1095 1063","gi":"請閱讀以下短文與表格，並回答46～48題：","st":"下列文句「」中字的意義說明，何者最恰當？","op":{"A":"駭眾取「名」――姓名","B":"嗜學「尤」力――尚且","C":"「悉」出家書予之――明白","D":"使「如」京師――前往"},"an":"D","nt":[],"gn":[{"n":1,"term":"凌物","text":"傲視他人"},{"n":2,"term":"引試","text":"面試"},{"n":3,"term":"張公","text":"指張景"},{"n":4,"term":"墓誌銘","text":"記錄死者生平事蹟的石刻文字"}]},{"id":"CAP-110-國文-47","y":"110","n":47,"ax":"G-classical","df":null,"pr":null,"gc":"【甲】\n柳開少好任氣，大言凌物1。應舉時，以文章投於主考簾前，凡千軸，載以獨輪車。引試2 日，自擁車入，欲以此駭眾取名。其時張景能文有名，唯袖一書簾前獻之。主考大稱賞，擢景優等。時人為之語曰：「柳開千軸，不如張景一書。」\n――改寫自沈括《夢溪筆談》\n【乙】\n張景，字晦之，江陵 公安人。幼能長言，嗜學尤力。貧不治產，往從柳開。開以文自名，而薦寵士類，一見歡甚，悉出家書予之，由是屬辭益有法度。開每曰：「今朝中之士，誰踰晦之者！」即厚饋，使如京師。後中進士。\n――改寫自宋祁〈故大理評事張公3墓誌銘4〉【丙】相關人物簡表\n姓名 西元生卒年 中舉年分\n柳開 948～1001 973\n張景 970～1018 1000\n宋祁 998～1061 1024\n沈括 1031～1095 1063","gi":"請閱讀以下短文與表格，並回答46～48題：","st":"關於甲、乙兩文的內容，下列說明何者最不恰當？","op":{"A":"甲文比較柳開、張景才華的高下","B":"乙文敘述張景投靠柳開後的際遇","C":"兩文皆凸顯柳開自大的形象","D":"兩文皆肯定張景不凡的文才"},"an":"C","nt":[],"gn":[{"n":1,"term":"凌物","text":"傲視他人"},{"n":2,"term":"引試","text":"面試"},{"n":3,"term":"張公","text":"指張景"},{"n":4,"term":"墓誌銘","text":"記錄死者生平事蹟的石刻文字"}]},{"id":"CAP-110-國文-48","y":"110","n":48,"ax":"G-classical","df":null,"pr":null,"gc":"【甲】\n柳開少好任氣，大言凌物1。應舉時，以文章投於主考簾前，凡千軸，載以獨輪車。引試2 日，自擁車入，欲以此駭眾取名。其時張景能文有名，唯袖一書簾前獻之。主考大稱賞，擢景優等。時人為之語曰：「柳開千軸，不如張景一書。」\n――改寫自沈括《夢溪筆談》\n【乙】\n張景，字晦之，江陵 公安人。幼能長言，嗜學尤力。貧不治產，往從柳開。開以文自名，而薦寵士類，一見歡甚，悉出家書予之，由是屬辭益有法度。開每曰：「今朝中之士，誰踰晦之者！」即厚饋，使如京師。後中進士。\n――改寫自宋祁〈故大理評事張公3墓誌銘4〉【丙】相關人物簡表\n姓名 西元生卒年 中舉年分\n柳開 948～1001 973\n張景 970～1018 1000\n宋祁 998～1061 1024\n沈括 1031～1095 1063","gi":"請閱讀以下短文與表格，並回答46～48題：","st":"根據丙表所列舉的年分，對照甲、乙兩文內容，下列推論何者最合理？","op":{"A":"柳開中舉前已受張景愛戴","B":"宋祁跟柳開兩人頗有交情","C":"甲文的寫作時間早於乙文","D":"乙文所述內容較甲文可信 14 試題結束"},"an":"D","nt":[],"gn":[{"n":1,"term":"凌物","text":"傲視他人"},{"n":2,"term":"引試","text":"面試"},{"n":3,"term":"張公","text":"指張景"},{"n":4,"term":"墓誌銘","text":"記錄死者生平事蹟的石刻文字"}]},{"id":"CAP-111-國文-8","y":"111","n":8,"ax":"S-classical","df":"進階","pr":0.67,"gc":"","gi":"","st":"陸公嘗於市遇一佳硯，議價未定。既還邸，使門人往，以一金易歸。門人持硯歸，公訝其不類。門人堅證其是。公曰：「向觀硯有鴝鵒眼，今何無之？」答曰：「吾嫌其微凸，路遇石工，令磨而平之。」公大惋惜。下列關於故事中人物的敘述，何者最恰當？","op":{"A":"門人買錯硯臺卻不知道","B":"陸公惋惜是因石工技藝不佳","C":"門人請人磨平硯眼是自作聰明","D":"陸公對門人購硯的價格感到驚訝"},"an":"C","nt":[],"gn":[]},{"id":"CAP-111-國文-10","y":"111","n":10,"ax":"S-classical","df":"進階","pr":0.71,"gc":"","gi":"","st":"「名不可以倖取也。天下之事，固有外似而中實不然者。倖其似而竊其名，非不可以欺一時，然他日人即其似而求其真，則情現實吐，無不立敗。」下列何者最能與這段文字的意旨相呼應？","op":{"A":"因其貌不揚被小看，沒想到靠著精湛演技成為影帝","B":"不勞而獲的錢財，因為來得容易，往往被輕易揮霍","C":"以作弊手段考上名校，最後卻因適應不良而中輟學業","D":"當不切實際的夢想碰到冷酷的現實，也只能化為泡影"},"an":"C","nt":[],"gn":[]},{"id":"CAP-111-國文-16","y":"111","n":16,"ax":"S-classical","df":"進階","pr":0.58,"gc":"","gi":"","st":"某古典戲曲中有一段唱詞：「俺讀些稗官詞寄牢騷，對江山吃一斗苦松醪 1。小鼓兒顫杖輕敲，寸板兒軟手頻搖。一字字臣忠子孝，一聲聲龍吟虎嘯。快舌尖鋼刀出鞘，響喉嚨轟雷烈炮。呀！似這般冷嘲、熱挑，用不著筆抄、墨描，勸英豪一盤錯帳速勾了。」據此判斷，唱詞中「俺」的職業最可能是下列何者？","op":{"A":"說書人","B":"算命師","C":"外交使臣","D":"監察御史"},"an":"A","nt":[{"n":1,"term":"醪","text":"音ㄌㄠˊ，混含渣滓的濁酒"}],"gn":[]},{"id":"CAP-111-國文-18","y":"111","n":18,"ax":"S-classical","df":"基礎","pr":0.78,"gc":"","gi":"","st":"「粥之既熟，水米成交，猶米之釀而為酒矣。慮其太厚而入水於粥，猶入水於酒也，水入而酒成糟粕，其味尚可咀乎？故熬前挹水必限以數，使其勺不能增，滴無可減。」根據這段文字，作者對於熬粥的看法，下列敘述何者最恰當？","op":{"A":"熬煮前須加足適量的水","B":"熬煮時可適度添加米飯","C":"熬煮過程中可加酒提味","D":"熬煮過久容易生出糟粕"},"an":"A","nt":[],"gn":[]},{"id":"CAP-111-國文-20","y":"111","n":20,"ax":"S-classical","df":"挑戰","pr":0.52,"gc":"","gi":"","st":"「江南二月試羅衣 1，春盡燕山雪尚飛。應是子規 2 啼不到，故鄉雖好不思歸。」關於這首詩的分析，下列說明何者最恰當？","op":{"A":"就體裁而言，這是一首七言律詩","B":"就形式而言，對仗工整，句句押韻","C":"以「試羅衣」、「雪尚飛」對比兩地氣候差異","D":"以遊子口吻寫出羈旅在外、難以返回的鄉愁"},"an":"C","nt":[{"n":1,"term":"羅衣","text":"絲質的衣服"},{"n":2,"term":"子規","text":"杜鵑鳥，啼聲如「不如歸去」"}],"gn":[]},{"id":"CAP-111-國文-22","y":"111","n":22,"ax":"S-classical","df":"挑戰","pr":0.44,"gc":"","gi":"","st":"「學者如取水，終日取而不能踰其量，故操瓢者止於瓢，操盎者止於盎；教者如分火，終日分而未嘗虧其體，故散為十燈而明自若，散為千燈而明自若。故善學者 ________，善教者________。」根據文意脈絡，畫線處依序填入下列何者最恰當？","op":{"A":"不自隘其器／不自吝其光","B":"如逆水行舟／似雪中取火","C":"宜自知其量／宜自晦其光","D":"無一時之患／有終身之憂"},"an":"A","nt":[],"gn":[]},{"id":"CAP-111-國文-23","y":"111","n":23,"ax":"S-classical","df":"挑戰","pr":0.47,"gc":"","gi":"","st":"莊子釣於濮水，楚王使大夫二人往先焉，曰：「願以境內累矣 1！」莊子持竿不顧，曰：「吾聞楚有神龜，死已三千歲矣，王巾笥 2 而藏之廟堂之上。此龜者，寧其死為留骨而貴乎，寧其生而曳尾於塗中乎？」二大夫曰：「寧生而曳尾塗中。」莊子曰：「往矣！吾將曳尾於塗中。」根據這段文字，下列何者與莊子的想法最接近？","op":{"A":"人死留名，虎死留皮","B":"不慕榮利，唯願逍遙","C":"神龜雖壽，猶有竟時","D":"寧鳴而死，不默而生"},"an":"B","nt":[{"n":1,"term":"願以境內累矣","text":"希望勞煩您協助國事"},{"n":2,"term":"笥","text":"放物品的竹器"}],"gn":[]},{"id":"CAP-111-國文-24","y":"111","n":24,"ax":"S-classical","df":"挑戰","pr":0.53,"gc":"","gi":"","st":"「世人之事君者，皆以孫叔敖之遇楚莊王為幸，自有道者論之則不然，此楚國之幸。楚莊王好周遊田獵，馳騁弋射，歡樂無遺，盡付其境內之勞與諸侯之憂於孫叔敖。孫叔敖日夜不息，不得顧及養生之事，故使莊王功績著乎竹帛，傳乎後世。」關於這段文字的寫作手法，下列說明何者最恰當？","op":{"A":"先提出世俗看法，再以不同論點反駁","B":"先從正、反兩面論述，再另舉他例說明","C":"先記敘孫叔敖事蹟，再評論楚莊王功績","D":"先以楚莊王觀點闡述，再從孫叔敖立場反駁"},"an":"A","nt":[],"gn":[]},{"id":"CAP-111-國文-39","y":"111","n":39,"ax":"G-classical","df":"進階","pr":0.71,"gc":"【甲】\n文帝時，莢錢 1 益多，輕，乃更鑄四銖錢，上鑄「半兩」字樣，民亦得自鑄錢。故吳王就山鑄錢，富等天子，其後以此叛逆。又有大夫鄧通者，亦以鑄錢富甲天下。故吳、鄧氏錢布天下，而後乃生鑄錢之禁。\n―― 改寫自《史記．平準書》\n【乙】\n漢文帝時，鄧通得賜蜀銅山，聽得鑄錢，形制文字重量，皆與天子四銖錢同。時吳王亦有銅山鑄錢，故有吳錢，微重，形制文字，與天子錢不異。\n―― 改寫自《西京雜記》","gi":"請閱讀以下兩篇短文，並回答39～40題：","st":"根據甲、乙兩文推論，漢文帝時各種錢幣的重量依序最可能是下列何者？","op":{"A":"四銖錢 ＞ 吳錢 ＞ 鄧通錢","B":"四銖錢 ＝ 鄧通錢 ＞ 吳錢","C":"吳錢 ＞ 四銖錢 ＞ 鄧通錢","D":"吳錢 ＞ 鄧通錢 ＝ 四銖錢"},"an":"D","nt":[],"gn":[{"n":1,"term":"莢錢","text":"西漢初年所鑄銅錢，形如榆莢，故名"}]},{"id":"CAP-111-國文-40","y":"111","n":40,"ax":"G-classical","df":"挑戰","pr":0.43,"gc":"【甲】\n文帝時，莢錢 1 益多，輕，乃更鑄四銖錢，上鑄「半兩」字樣，民亦得自鑄錢。故吳王就山鑄錢，富等天子，其後以此叛逆。又有大夫鄧通者，亦以鑄錢富甲天下。故吳、鄧氏錢布天下，而後乃生鑄錢之禁。\n―― 改寫自《史記．平準書》\n【乙】\n漢文帝時，鄧通得賜蜀銅山，聽得鑄錢，形制文字重量，皆與天子四銖錢同。時吳王亦有銅山鑄錢，故有吳錢，微重，形制文字，與天子錢不異。\n―― 改寫自《西京雜記》","gi":"請閱讀以下兩篇短文，並回答39～40題：","st":"根據甲、乙兩文，下列敘述何者最恰當？","op":{"A":"鄧通與吳王同時自鑄莢錢，導致莢錢過多","B":"鄧通與吳王所鑄銅錢上應有「半兩」字樣","C":"鄧通叛逆謀反，文帝遂下令禁止私鑄銅錢","D":"鄧通所鑄錢布天下，故文帝賜其銅山一座"},"an":"B","nt":[],"gn":[{"n":1,"term":"莢錢","text":"西漢初年所鑄銅錢，形如榆莢，故名"}]},{"id":"CAP-111-國文-41","y":"111","n":41,"ax":"G-classical","df":"挑戰","pr":0.48,"gc":"王起主文柄 1，欲以白敏中為狀元，病其與賀拔惎為友。惎有文而落拓。乃密令門人申意，俾敏中與惎絕。門人復約敏中，具以告之。敏中曰：「皆如所教。」既而惎果造門，左右欺以敏中他適，惎遲留不言而去。俄頃，敏中躍出，連呼左右召惎，悉以實告，曰：「一第何患不致，奈輕負至交！」相與歡醉。門人睹之，大怒而去。懇告於起，且云不可必矣。起曰：「我原只得白敏中，今當更取賀拔惎矣。」\n―― 改寫自《唐摭言》","gi":"請閱讀以下短文，並回答41～42題：","st":"根據本文，下列文句省略的主語，何者是白敏中？","op":{"A":"病其與賀拔惎為友","B":"乃密令門人申意","C":"悉以實告","D":"大怒而去"},"an":"C","nt":[],"gn":[{"n":1,"term":"主文柄","text":"主持科舉考試"}]},{"id":"CAP-111-國文-42","y":"111","n":42,"ax":"G-classical","df":"挑戰","pr":0.4,"gc":"王起主文柄 1，欲以白敏中為狀元，病其與賀拔惎為友。惎有文而落拓。乃密令門人申意，俾敏中與惎絕。門人復約敏中，具以告之。敏中曰：「皆如所教。」既而惎果造門，左右欺以敏中他適，惎遲留不言而去。俄頃，敏中躍出，連呼左右召惎，悉以實告，曰：「一第何患不致，奈輕負至交！」相與歡醉。門人睹之，大怒而去。懇告於起，且云不可必矣。起曰：「我原只得白敏中，今當更取賀拔惎矣。」\n―― 改寫自《唐摭言》","gi":"請閱讀以下短文，並回答41～42題：","st":"根據本文，王起說：「我原只得白敏中，今當更取賀拔惎矣。」這句話的原因，最可能是下列何者？","op":{"A":"白敏中向王起推薦賀拔惎取代自己","B":"賀拔惎已知此次科考內幕，只好破格錄取封口","C":"比起白敏中的前倨後恭，賀拔惎的真誠顯得更為可貴","D":"白敏中把賀拔惎看得比狀元還重，可知賀拔惎有過人之處 14 試題結束"},"an":"D","nt":[],"gn":[{"n":1,"term":"主文柄","text":"主持科舉考試"}]},{"id":"CAP-112-國文-10","y":"112","n":10,"ax":"S-classical","df":"進階","pr":0.71,"gc":"","gi":"","st":"「夏七月，赤日停天，亦無風，亦無雲。前後庭赫然如洪爐，無一鳥敢來飛。汗出遍身，縱橫成渠。置飯於前，不可得吃。呼簟欲臥地上，則地濕如膏，蒼蠅又來緣頸附鼻，驅之不去。正莫可如何，忽然疾澍澎湃之聲，如數百萬金鼓。簷溜浩於瀑布。身汗頓收，地燥如掃，蒼蠅盡去，飯便得吃。不亦快哉！」根據這段文字，作者心情轉變的關鍵最可能是下列何者？","op":{"A":"發現美麗的景致","B":"遠離擾人的蟲蠅","C":"聽見悅耳的鼓聲","D":"驟降消暑的大雨"},"an":"D","nt":[],"gn":[]},{"id":"CAP-112-國文-12","y":"112","n":12,"ax":"S-classical","df":"進階","pr":0.7,"gc":"","gi":"","st":"「少室周為趙簡子之右1，聞牛談有力，請與之競，弗勝，致2右焉。簡子許之，使少室周為宰，曰：『知賢而讓，可以為訓矣。』」根據文意脈絡，下列何者最適合用來說明「訓」字的意義？","op":{"A":"典範","B":"順從","C":"教誨","D":"解釋"},"an":"A","nt":[{"n":1,"term":"右","text":"職官名，立君主之右，擔任保衛工作"},{"n":2,"term":"致","text":"禮讓"}],"gn":[]},{"id":"CAP-112-國文-13","y":"112","n":13,"ax":"S-classical","df":"進階","pr":0.61,"gc":"","gi":"","st":"「茲鄭引輦1 上高梁2 而不能支。茲鄭倚轅而歌，前者止，後者趨，輦乃上。使茲鄭無術以致人，則身雖絕力至死，輦猶不上也。今身不至勞苦而輦以上者，有術以致人之故也。」這段文字的主旨最可能是下列何者？","op":{"A":"團結就是力量","B":"做事要講究方法","C":"堅持到底才能成功","D":"沒有付出就沒有收穫"},"an":"B","nt":[{"n":1,"term":"輦","text":"古時用人拉著走的車"},{"n":2,"term":"梁","text":"橋"}],"gn":[]},{"id":"CAP-112-國文-15","y":"112","n":15,"ax":"S-classical","df":"進階","pr":0.69,"gc":"","gi":"","st":"甲：花寒懶發鳥慵啼，信馬閑行到日西。何處未春先有思？柳條無力魏王堤。―― 白居易〈魏王堤〉乙：陰陰溪曲綠交加，小雨翻萍上淺沙。鵝鴨不知春去盡，爭隨流水趁桃花。―― 晁沖之〈春日〉關於這兩首詩的分析，下列敘述何者最恰當？","op":{"A":"甲詩描寫清晨春寒料峭的景象","B":"乙詩描寫春末溪邊所見的景致","C":"兩詩首二句皆對仗，表達情思","D":"兩詩皆屬七絕，只有偶句用韻"},"an":"B","nt":[],"gn":[]},{"id":"CAP-112-國文-16","y":"112","n":16,"ax":"S-classical","df":"進階","pr":0.67,"gc":"","gi":"","st":"「蓋天下有反覆之小人，亦有反覆之君子。人但知不反覆不足以為小人，庸知不反覆亦不足以為君子。蓋小人之反覆也，因風氣勢利之所歸，以為變動；君子之反覆也，因學識之層累疊進，以為變動。其反覆同，其所以為反覆者不同。」根據這段文字，作者認為「不反覆亦不足以為君子」的原因，最可能是下列何者？","op":{"A":"小人若洗心革面，一反前非即可成為君子","B":"為應對小人反覆，不得不改變既有的策略","C":"順應民心的向背，選擇最適合現況的做法","D":"隨著所知的增長，會修正自己原本的觀點"},"an":"D","nt":[],"gn":[]},{"id":"CAP-112-國文-20","y":"112","n":20,"ax":"S-classical","df":"挑戰","pr":0.48,"gc":"","gi":"","st":"蘇軾〈西江月〉：「世事一場大夢，人生幾度新涼？夜來風葉已鳴廊，看取眉頭鬢上。 酒賤常愁客少，月明多被雲妨。中秋誰與共孤光，把盞淒然北望。」下列關於詞句的說明，何者最不恰當？","op":{"A":"「看取眉頭鬢上」表達自己年華老去","B":"「酒賤常愁客少」意謂難以維持生計","C":"「月明多被雲妨」比喻美好的事物不可能長久","D":"「中秋誰與共孤光」流露想與親友團聚的心願"},"an":"B","nt":[],"gn":[]},{"id":"CAP-112-國文-22","y":"112","n":22,"ax":"S-classical","df":"進階","pr":0.64,"gc":"","gi":"","st":"「復北上，行石罅中，石峰片片夾起，路宛轉石間，塞者鑿之，陡者級之，斷者架木通之，懸者植梯接之。下瞰峭壑陰森，楓松相間，五色紛披，燦若圖繡。因念黃山當生平奇覽，而有奇若此，前未一探，茲遊快且愧矣！」根據這段文字，下列敘述何者最恰當？","op":{"A":"作者對自己破壞自然環境感到慚愧","B":"黃山片片石峰色彩繽紛，有如織錦","C":"作者北上舊地重遊，乃因懷念黃山冬季美景","D":"此遊窺得黃山奇景，作者心中因而喜愧交集"},"an":"D","nt":[],"gn":[]},{"id":"CAP-112-國文-23","y":"112","n":23,"ax":"S-classical","df":"挑戰","pr":0.51,"gc":"","gi":"","st":"往歲士人多尚對偶為文，穆脩、張景輩始為平文，當時謂之古文。穆、張嘗同造朝，適見有奔馬踐死一犬，二人各記其事。穆脩曰：「馬逸1，有黃犬遇蹄而斃。」張景曰：「有犬死奔馬之下。」時文體新變，二人之語皆拙澀，當時已謂之工，傳之至今。根據這段文字，關於穆脩、張景針對奔馬踐死一犬的記事，下列敘述何者最恰當？","op":{"A":"穆脩記事只著眼於犬","B":"張景記事只著眼於馬","C":"二人用語崇尚句式對偶","D":"二人用語皆為時人稱頌"},"an":"D","nt":[{"n":1,"term":"逸","text":"奔跑"}],"gn":[]},{"id":"CAP-112-國文-24","y":"112","n":24,"ax":"S-classical","df":"挑戰","pr":0.39,"gc":"","gi":"","st":"「錢塘江石堤為洪濤所激，歲歲摧決。杜偉長為轉運使，人有獻說，自浙江稅場以東，移退數里為月堤，以避怒水。眾水工皆以為善，獨一老水工以為不然，密諭其黨：『移堤則歲無水患，吾等何所衣食？』眾人樂其利，乃從而和之。偉長不悟其計，費以巨萬，而江堤之害仍歲有之。」根據這段文字，下列敘述何者最恰當？","op":{"A":"月堤耗時過久，使杜偉長浪費公帑","B":"水工們為保生計，阻礙了移堤工程","C":"老水工深知修築月堤無益於防堵水患","D":"杜偉長堅持移堤，導致年年發生水患"},"an":"B","nt":[],"gn":[]},{"id":"CAP-112-國文-39","y":"112","n":39,"ax":"G-classical","df":"進階","pr":0.55,"gc":"大將軍仇鸞，始為曾銑所劾，欲倚嚴嵩以抗曾銑，故約為父子。已而鸞得帝重，嵩猶視之若子，遂浸相惡。嵩密疏毀鸞，帝不聽，而頗納鸞所陳嵩父子過，少疏之。嵩當入值，不召者數矣。嵩見徐階、李本入西內1，即與俱入。至西華門，門者以非詔旨格之。嵩還第，父子對泣。時陸炳掌錦衣，與鸞爭寵，嵩乃結炳共圖鸞。會鸞病死，炳訐鸞陰事，帝追戮之。於是益信任嵩，遣所乘龍舟過海子召嵩，載值西內如故。\n—— 改寫自《明史．奸臣》","gi":"請閱讀以下短文，並回答39 ～ 40題：","st":"根據本文，下列何者最可能是仇鸞與嚴嵩一開始交惡的原因？","op":{"A":"嚴嵩私下上奏，詆毀仇鸞","B":"嚴嵩與曾銑結盟，疏遠仇鸞","C":"仇鸞向皇帝稟告嚴嵩父子的罪行","D":"仇鸞權位日重，不願嚴嵩仍以子視之"},"an":"D","nt":[{"n":1,"term":"內","text":"宮廷"}],"gn":[]},{"id":"CAP-112-國文-40","y":"112","n":40,"ax":"G-classical","df":"挑戰","pr":0.49,"gc":"大將軍仇鸞，始為曾銑所劾，欲倚嚴嵩以抗曾銑，故約為父子。已而鸞得帝重，嵩猶視之若子，遂浸相惡。嵩密疏毀鸞，帝不聽，而頗納鸞所陳嵩父子過，少疏之。嵩當入值，不召者數矣。嵩見徐階、李本入西內1，即與俱入。至西華門，門者以非詔旨格之。嵩還第，父子對泣。時陸炳掌錦衣，與鸞爭寵，嵩乃結炳共圖鸞。會鸞病死，炳訐鸞陰事，帝追戮之。於是益信任嵩，遣所乘龍舟過海子召嵩，載值西內如故。\n—— 改寫自《明史．奸臣》","gi":"請閱讀以下短文，並回答39 ～ 40題：","st":"下列文句的解說，何者最恰當？","op":{"A":"門者以非詔旨格之：守門者將徐階、李本擋下","B":"嵩還第，父子對泣：嚴嵩與仇鸞兩人盡釋前嫌","C":"炳訐鸞陰事，帝追戮之：皇帝認為陸炳毀謗死者，憤而殺之","D":"遣所乘龍舟過海子召嵩：皇帝以高規格召回嚴嵩，以示禮遇"},"an":"D","nt":[],"gn":[]},{"id":"CAP-112-國文-41","y":"112","n":41,"ax":"G-classical","df":"挑戰","pr":0.48,"gc":"楊朱見梁王，言治天下如運諸掌。梁王曰：「先生有三畝之園而不能耘，而言治天下如運諸掌，何也？」對曰：「君不見牧羊者乎？百羊而群，使五尺童子荷杖隨之，欲東而東，欲西而西。使堯牽一羊，舜荷杖隨之，則不能前矣。且臣聞之：吞舟之魚，不游支流；鴻鵠高飛，不集汙池。何則？其志遠也。黃鐘大呂不可從繁奏之舞。何則？其音疏也。將治大者不治細，成大功者不成小，此之謂矣。」\n—— 改寫自《列子．楊朱》","gi":"請閱讀以下短文，並回答41 ～ 42題：","st":"根據本文，關於梁王與楊朱的敘述，下列何者最恰當？","op":{"A":"梁王認為治理天下應重視禮樂之道","B":"梁王質疑楊朱是否具有治理天下的能力","C":"楊朱貶抑堯、舜，能治天下卻不能牧羊","D":"楊朱以牧羊為例，說明治天下須從小事做起"},"an":"B","nt":[],"gn":[]},{"id":"CAP-112-國文-42","y":"112","n":42,"ax":"G-classical","df":"挑戰","pr":0.41,"gc":"楊朱見梁王，言治天下如運諸掌。梁王曰：「先生有三畝之園而不能耘，而言治天下如運諸掌，何也？」對曰：「君不見牧羊者乎？百羊而群，使五尺童子荷杖隨之，欲東而東，欲西而西。使堯牽一羊，舜荷杖隨之，則不能前矣。且臣聞之：吞舟之魚，不游支流；鴻鵠高飛，不集汙池。何則？其志遠也。黃鐘大呂不可從繁奏之舞。何則？其音疏也。將治大者不治細，成大功者不成小，此之謂矣。」\n—— 改寫自《列子．楊朱》","gi":"請閱讀以下短文，並回答41 ～ 42題：","st":"下列文句，何者最能呼應文中「吞舟之魚，不游支流；鴻鵠高飛，不集汙池」的涵義？","op":{"A":"狡兔死，良狗烹；高鳥盡，良弓藏","B":"高飛之鳥，死於美食；深泉之魚，死於芳餌","C":"騏驥千里，一日而達；駑馬十駕，旬亦至之","D":"剖三寸之蚌，難得明月之珠；探枳棘之巢，難求鳳凰之雛 14 試題結束"},"an":"D","nt":[],"gn":[]},{"id":"CAP-113-國文-12","y":"113","n":12,"ax":"S-classical","df":"進階","pr":0.66,"gc":"","gi":"","st":"「老農家貧在山住，耕種山田三四畝。苗疏稅多不得食，輸入官倉化為土。歲暮鋤犁傍空室，呼兒登山收橡實。西江賈客珠百斛，船中養犬長食肉。」關於這首詩的說明，下列敘述何者最恰當？","op":{"A":"就形式而言，是一首七言律詩","B":"就類別而言，是一首山居躬耕的閒適詩","C":"就內涵而言，描繪農民於繁重稅賦下艱困的生活","D":"就技巧而言，以農家與商賈對比，凸顯人情的可貴"},"an":"C","nt":[],"gn":[]},{"id":"CAP-113-國文-14","y":"113","n":14,"ax":"S-classical","df":"進階","pr":0.74,"gc":"","gi":"","st":"「玉慘花愁出鳳城，蓮花樓下柳青青。尊前一唱〈陽關曲〉，別個人人第五程？ 尋好夢，夢難成。有誰知我此時情？枕前淚共階前雨，隔個窗兒滴到明。」關於這闋詞的分析，下列敘述何者錯誤？","op":{"A":"首句情景交融，「慘」、「愁」二字點出別情","B":"下闋首句點出「我」為了追尋理想而遠離佳人","C":"末尾二句暗示「我」滿懷離情別緒，一夜未眠","D":"上闋描寫分別時的情景，下闋描寫別後的思情"},"an":"B","nt":[],"gn":[]},{"id":"CAP-113-國文-18","y":"113","n":18,"ax":"S-classical","df":"進階","pr":0.56,"gc":"","gi":"","st":"漢靈帝時，陳留 蔡邕，以數上書陳奏，忤上旨意，又內寵惡之，慮不免，乃亡命江海，遠跡吳郡。吳有燒桐以爨1 者，邕聞火烈聲，曰：「此良材也。」因請之，削之以琴，果有美音。而其尾焦，因名「焦尾琴」。根據這則故事，下列敘述何者最恰當？","op":{"A":"焦尾琴因蔡邕識材而製成","B":"吳人向來以燒桐製琴聞名","C":"焦尾琴製成後經火烤而音色優美","D":"蔡邕因忤逆上意而遭流放至吳郡"},"an":"A","nt":[{"n":1,"term":"爨","text":"音ㄘㄨㄢˋ，升火煮食"}],"gn":[]},{"id":"CAP-113-國文-19","y":"113","n":19,"ax":"S-classical","df":"挑戰","pr":0.47,"gc":"","gi":"","st":"「蝸以涎見覓，蟬以聲見黏，螢以光見獲。故愛身者，不貴赫赫之名。」這句話的涵義與下列何者最接近？","op":{"A":"人過留名，雁過留聲","B":"所榮者善行，所恥者惡名","C":"名不可簡而成，譽不可巧而立","D":"樹大招風風損樹，人為名高傷喪身"},"an":"D","nt":[],"gn":[]},{"id":"CAP-113-國文-21","y":"113","n":21,"ax":"S-classical","df":"進階","pr":0.57,"gc":"","gi":"","st":"鞠武〈報燕太子丹書〉曰：「臣聞快於意者虧於行，甘於心者傷於性。今太子欲滅悁悁1 之恥，除久久之恨，此實臣所當糜軀碎首而不避也。私以為智者不冀僥倖以要功，明者不苟從志以順心。事必成，然後舉；身必安，而後行。故發無失舉之尤，動無蹉跌2 之愧也。太子貴匹夫之勇，信一劍之任，而欲望功，臣以為疏。」關於這段文字的寫作分析，下列敘述何者最恰當？","op":{"A":"分析個中利害關係，鼓勵太子須建功立業","B":"採取先抑後揚筆法，肯定太子能獨當一面","C":"以工整句式加強文氣，勸諫太子應謀定而後動","D":"列舉前人失敗的事例，提醒太子不宜心存僥倖"},"an":"C","nt":[{"n":1,"term":"悁悁","text":"憤怒"},{"n":2,"term":"蹉跌","text":"失誤"}],"gn":[]},{"id":"CAP-113-國文-22","y":"113","n":22,"ax":"S-classical","df":"進階","pr":0.62,"gc":"","gi":"","st":"賈人某，至直隸界，忽大雨雹，伏禾中。聞空中云：「此張不量田，勿傷其稼。」天霽，他田偃壞，張田獨無恙。蓋張氏積粟甚富，每春間貧民皆就貸焉。償時多寡不較，悉納之，未嘗執概取盈，故鄉人名之「不量」。根據本文，「張田獨無恙」的原因最可能是下列何者？","op":{"A":"張氏行善積德，得到護佑","B":"貧民虔誠祈願，感動上天","C":"張氏田產甚多無法丈量，看不出損失","D":"賈人福澤深厚，連帶使張田倖免於難"},"an":"A","nt":[],"gn":[]},{"id":"CAP-113-國文-24","y":"113","n":24,"ax":"S-classical","df":"挑戰","pr":0.38,"gc":"","gi":"","st":"「夫繭，捨而不治，則腐蠹而棄。使女工繅1 之，以為美錦，國君服而朝之。身者，繭也，捨而不治，則智行腐蠹。使賢者教之，以為世士，則天下諸侯莫敢不敬。」關於本文的分析，下列敘述何者最恰當？","op":{"A":"以繭為喻，說明教化對修身的重要","B":"以身著美錦，暗指上位者奢靡誤國","C":"以女工與賢者對照，強調環境的影響","D":"以腐蠹的蠶繭，嘲諷國政的敗壞衰頹"},"an":"A","nt":[{"n":1,"term":"繅","text":"音ㄙㄠ，煮繭抽絲"}],"gn":[]},{"id":"CAP-113-國文-38","y":"113","n":38,"ax":"G-classical","df":"進階","pr":0.64,"gc":"【甲】\n人讀聖人書二三十年，一旦遇事，便與里巷人無異，或有一聽老成語，便能終身服膺。豈老成之言過於六經哉？只緣讀書不作有用看故也。大抵看史見治則以為治，見亂則以為亂，見一事則止知一事，何取？觀史如身在其中，見事之利害、時之禍患，必掩卷自思，使我遇此等事，當作何處之——如此觀史，學問亦可以進，智識亦可以高，方為有益。\n——改寫自呂祖謙《東萊集》\n【乙】\n讀書時，須細看古人處一事，接一物，是如何思量？如何氣象？及自己處事接物時，又細心將古人比擬。設若古人當此，其措置之法，當是如何？我自己任性為之，又當如何？然後自己過錯始見，古人道理始出。斷不可以古人之書，與自己處事接物為兩事。\n——《左宗棠全集》","gi":"請閱讀以下二文，並回答38 ～ 39題：","st":"下列關於甲、乙二文文句的說明，何者最恰當？","op":{"A":"「一旦遇事，便與里巷人無異」是因書讀得不夠多","B":"「見一事則止知一事」意謂對事情的理解不夠全面","C":"「如何氣象」其意是思索今人當前所處的環境氛圍","D":"「我自己任性為之」意謂今人比古人更加不受拘束"},"an":"B","nt":[],"gn":[]},{"id":"CAP-113-國文-39","y":"113","n":39,"ax":"G-classical","df":"挑戰","pr":0.38,"gc":"【甲】\n人讀聖人書二三十年，一旦遇事，便與里巷人無異，或有一聽老成語，便能終身服膺。豈老成之言過於六經哉？只緣讀書不作有用看故也。大抵看史見治則以為治，見亂則以為亂，見一事則止知一事，何取？觀史如身在其中，見事之利害、時之禍患，必掩卷自思，使我遇此等事，當作何處之——如此觀史，學問亦可以進，智識亦可以高，方為有益。\n——改寫自呂祖謙《東萊集》\n【乙】\n讀書時，須細看古人處一事，接一物，是如何思量？如何氣象？及自己處事接物時，又細心將古人比擬。設若古人當此，其措置之法，當是如何？我自己任性為之，又當如何？然後自己過錯始見，古人道理始出。斷不可以古人之書，與自己處事接物為兩事。\n——《左宗棠全集》","gi":"請閱讀以下二文，並回答38 ～ 39題：","st":"關於甲、乙二文的說明與比較，下列何者最恰當？","op":{"A":"甲文認為耳熟能詳的淺近道理，更勝於聖賢之言","B":"乙文以古人處事的標準，評斷自身舉措是否合宜","C":"二者都認為讀書應活用，不應拘泥於古人的看法","D":"二者都覺得古人讀書講究方法，比今人更有效率"},"an":"B","nt":[],"gn":[]},{"id":"CAP-113-國文-40","y":"113","n":40,"ax":"G-classical","df":"挑戰","pr":0.42,"gc":"楚人江乙為郢大夫。有入王宮中盜者，令尹以罪乙，請於王而黜之。其母往言於王曰：「妾夜亡布八匹，令尹盜之。」王謂母曰：「令尹信盜之，寡人不為其富貴而不行法焉。若不盜而誣之，楚國有常法。」母曰：「令尹不身盜之也，乃使人盜之。」王曰：「其使人盜奈何？」對曰：「昔孫叔敖之為令尹也，道不拾遺，門不閉關，而盜賊自息。今令尹之治也，耳目不明，盜賊公行，是故使盜得盜妾之布，是與使人盜何以異也？」王曰：「令尹在上，寇盜在下，令尹不知有何罪焉？」\n母曰：「昔日妾之子為郢大夫，有盜王宮中之物者，妾子坐而黜，妾子亦豈知之哉？然終坐之。令尹獨何人，而不以是為過也？昔者周武王有言曰：『百姓有過，在予一人。』上不明則下不治，相不賢則國不寧。王其察之。」\n——改寫自《列女傳》","gi":"請閱讀以下文章，並回答40 ～ 42題：","st":"根據本文，下列文句「」中的字義，何者說明最恰當？","op":{"A":"妾夜「亡」布八匹：損壞","B":"令尹「信」盜之：隨意","C":"妾子「坐」而黜：受罰","D":"王「其」察之：難道"},"an":"C","nt":[],"gn":[]},{"id":"CAP-113-國文-41","y":"113","n":41,"ax":"G-classical","df":"挑戰","pr":0.46,"gc":"楚人江乙為郢大夫。有入王宮中盜者，令尹以罪乙，請於王而黜之。其母往言於王曰：「妾夜亡布八匹，令尹盜之。」王謂母曰：「令尹信盜之，寡人不為其富貴而不行法焉。若不盜而誣之，楚國有常法。」母曰：「令尹不身盜之也，乃使人盜之。」王曰：「其使人盜奈何？」對曰：「昔孫叔敖之為令尹也，道不拾遺，門不閉關，而盜賊自息。今令尹之治也，耳目不明，盜賊公行，是故使盜得盜妾之布，是與使人盜何以異也？」王曰：「令尹在上，寇盜在下，令尹不知有何罪焉？」\n母曰：「昔日妾之子為郢大夫，有盜王宮中之物者，妾子坐而黜，妾子亦豈知之哉？然終坐之。令尹獨何人，而不以是為過也？昔者周武王有言曰：『百姓有過，在予一人。』上不明則下不治，相不賢則國不寧。王其察之。」\n——改寫自《列女傳》","gi":"請閱讀以下文章，並回答40 ～ 42題：","st":"根據本文，下列關於令尹與楚王的敘述何者最恰當？","op":{"A":"令尹打算偷盜布匹再將罪責嫁禍給他人","B":"令尹主張楚國盜賊橫行是須正視的問題","C":"楚王覺得宮中之物被盜應是令尹的責任","D":"楚王認為不論身分地位都應該遵守法律"},"an":"D","nt":[],"gn":[]},{"id":"CAP-113-國文-42","y":"113","n":42,"ax":"G-classical","df":"進階","pr":0.61,"gc":"楚人江乙為郢大夫。有入王宮中盜者，令尹以罪乙，請於王而黜之。其母往言於王曰：「妾夜亡布八匹，令尹盜之。」王謂母曰：「令尹信盜之，寡人不為其富貴而不行法焉。若不盜而誣之，楚國有常法。」母曰：「令尹不身盜之也，乃使人盜之。」王曰：「其使人盜奈何？」對曰：「昔孫叔敖之為令尹也，道不拾遺，門不閉關，而盜賊自息。今令尹之治也，耳目不明，盜賊公行，是故使盜得盜妾之布，是與使人盜何以異也？」王曰：「令尹在上，寇盜在下，令尹不知有何罪焉？」\n母曰：「昔日妾之子為郢大夫，有盜王宮中之物者，妾子坐而黜，妾子亦豈知之哉？然終坐之。令尹獨何人，而不以是為過也？昔者周武王有言曰：『百姓有過，在予一人。』上不明則下不治，相不賢則國不寧。王其察之。」\n——改寫自《列女傳》","gi":"請閱讀以下文章，並回答40 ～ 42題：","st":"根據本文，江母見楚王的目的最可能是下列何者？","op":{"A":"想要替兒子江乙頂罪","B":"表達江乙被懲處的不公","C":"向楚王告發郢大夫的罪行","D":"建議楚王再用孫叔敖為令尹 14 試題結束"},"an":"B","nt":[],"gn":[]},{"id":"CAP-114-國文-8","y":"114","n":8,"ax":"S-classical","df":"基礎","pr":0.8,"gc":"","gi":"","st":"貫雲石〈小梁州〉秋芙蓉映水菊花黃，滿目秋光。枯荷葉底鷺鷥藏。金風盪，飄動桂枝香。雷峰塔畔登高望，見錢塘一派長江。湖水清，江潮漾。天邊斜月，新雁兩三行。關於這首曲的分析，下列何者最恰當？","op":{"A":"題目為〈小梁州〉，是散曲中的小令","B":"在曲作的中間換韻，不是一韻到底","C":"以「菊花」、「金風」、「桂枝」呼應「秋」","D":"以「斜月」、「新雁」象徵世間繁華轉眼成空"},"an":"C","nt":[],"gn":[]},{"id":"CAP-114-國文-10","y":"114","n":10,"ax":"S-classical","df":"基礎","pr":0.83,"gc":"","gi":"","st":"「蜂造之蜜出山崖、土穴者十居其八，而人家招蜂造釀而割取者，十居其二也。北方乾燥，土穴所釀多出於此。南方卑溼，故有崖蜜而無穴蜜。西北半天下，蓋與蔗漿分勝云。」根據本文，下列推論何者最恰當？","op":{"A":"穴蜜多產於乾燥之處","B":"崖蜜多為人工養育而來","C":"卑溼之地沒有天然的蜂造之蜜","D":"西北蜂蜜產量是東南蔗漿的一半"},"an":"A","nt":[],"gn":[]},{"id":"CAP-114-國文-17","y":"114","n":17,"ax":"S-classical","df":"挑戰","pr":0.51,"gc":"","gi":"","st":"祖可〈小重山〉﹕「誰向江頭遺恨濃？碧波流不斷，楚山重。柳煙和雨隔疏鐘。黃昏後，羅幕更朦朧。 桃李小園空。阿誰1猶笑語，拾殘紅。珠簾捲盡夜來風。人不見，春在綠蕪中。」關於這闋詞的分析，下列何者最恰當？","op":{"A":"上片押平聲韻，下片轉押仄聲韻","B":"上片寫景抒情，下片敘事兼論理","C":"「碧波流不斷」將「遺恨濃」具體化","D":"藉由「綠蕪」來反襯「桃李」的豔冶"},"an":"C","nt":[{"n":1,"term":"阿誰","text":"何人"}],"gn":[]},{"id":"CAP-114-國文-18","y":"114","n":18,"ax":"S-classical","df":"進階","pr":0.59,"gc":"","gi":"","st":"皎然〈尋陸鴻漸不遇〉：「移家雖帶郭，野徑入桑麻。近種籬邊菊，秋來未著花。扣門無犬吠，欲去問西家。報道山中去，歸來每日斜。」根據本詩，作者此次訪友之行曾看見下列何者？","op":{"A":"荒蕪的農地","B":"盛開的菊花","C":"歸來的鴻漸","D":"鴻漸的鄰居"},"an":"D","nt":[],"gn":[]},{"id":"CAP-114-國文-20","y":"114","n":20,"ax":"S-classical","df":"挑戰","pr":0.51,"gc":"","gi":"","st":"太祖以事責丞相李善長，劉基言：「善長勛舊，能調和諸將。」太祖曰：「是數欲害汝，汝竟為之言耶？吾將相汝矣。」基頓首曰：「是如易柱，須得大木。若束小木為之，且立覆。」關於文中人物的敘述，下列何者最恰當？","op":{"A":"太祖因多次陷害劉基而心存愧疚","B":"太祖想以李善長替代劉基為丞相","C":"劉基認為李善長調和諸將就像束小木","D":"劉基認為李善長比自己適合擔任丞相"},"an":"D","nt":[],"gn":[]},{"id":"CAP-114-國文-22","y":"114","n":22,"ax":"S-classical","df":"挑戰","pr":0.51,"gc":"","gi":"","st":"安邑里巷口有賣餅者，吾每早過戶，未嘗不聞其歌。一日，召之與語，貧窘可憐。因與萬錢，令多其本，日取餅以償之。欣然持錢而去。後過其戶，則寂然不聞謳歌之聲。及呼乃至，謂曰：「爾何輟歌之遽乎？」曰：「本流既大，所謀益增，不暇唱曲矣。」關於文中的「吾」與賣餅者，下列敘述何者最恰當？","op":{"A":"「吾」喜歡吃賣餅者的餅，日日光顧","B":"賣餅者生意資本擴增後，工作更繁忙","C":"「吾」喜歡賣餅者的歌聲，勸他以此招攬生意","D":"賣餅者經濟狀況改善之後，就不想再繼續賣餅"},"an":"B","nt":[],"gn":[]},{"id":"CAP-114-國文-24","y":"114","n":24,"ax":"S-classical","df":"挑戰","pr":0.3,"gc":"","gi":"","st":"「世傳《碧雲騢》一卷為梅聖俞作，皆歷詆慶曆以來公卿隱過，雖范文正亦不免。議者遂謂聖俞游諸公間，官竟不達，懟而為此以報之。君子成人之美，縱使萬有一不至，猶當為賢者諱，況未必有實。聖俞賢者，豈至是哉？後聞之，乃魏泰所為，嫁之聖俞也。此豈特累諸公，又將以誣聖俞？歐陽文忠《歸田錄》自言不記人之過惡，君子之用心當如此也。」下列何者最符合本文的觀點？","op":{"A":"范文正也曾揭發公卿的過錯","B":"《碧雲騢》應非梅聖俞所作","C":"魏泰因官運不亨而怨懟梅聖俞","D":"《歸田錄》反對替賢者隱諱的筆法"},"an":"B","nt":[],"gn":[]},{"id":"CAP-114-國文-36","y":"114","n":36,"ax":"G-classical","df":"挑戰","pr":0.52,"gc":"南唐 後主 李煜跪在明德樓前，白衣素袍，向宋太祖 趙匡胤歸降時，內心肯定百感交集。他想過以後的歷史，怎麼寫他嗎？《舊五代史》直接把十國裡凡稱帝的都貶為「僭偽列傳」，南唐當然也逃不了。《新五代史》稍稍客氣，但也僅以「世家1」定位。《舊五代史》南唐部分只寫到烈主 李昪、中主 李璟，並沒有後主 李煜。《新五代史》雖提及李後主，但入宋的部分不寫。\n為何新、舊《五代史》如此定位？這就必須了解中國史家重視傳統王朝興替的「正統情結」。趙匡胤是借「陳橋兵變」、「黃袍加身」而當上皇帝，其政權正當性，乃繼承北方中原的政權更替。以此史觀來看，唐朝滅亡後在中原相繼更迭的北方政權：後梁、後唐、後晉、後漢、後周，便被視為正統，其他政權則被視為僭越。\n然而紛亂的五代十國，主戰場就在北方中原。五代國祚最短的是後漢，三年多換了兩個君主。最長的是後梁，十七年四個皇帝。何況，五代王位之爭，經常是血腥暴力、骨肉相殘，朝廷難有建樹，更談不上人文建設、經濟民生。\n「君王唯兵強馬壯者得之」，五代帝王幾乎沒幾位是有高度文化修養的。反倒是十國裡的南唐前後維持近四十年，只經歷三個皇帝，沒有繼承權的紛亂，政權相對穩定。且南唐三位國君都重視文教，珍藏圖書，蒐羅書畫，建立教坊，網羅畫師，一時之間南唐成了文化重鎮。宋朝雖然滅了南唐，可是汴京皇城裡的文化資產，有多少是來自南唐啊！\n——改寫自蔡詩萍《李後主事件簿》","gi":"五代十國是指唐亡後至宋建國前，在各地分立興亡的諸國。當時北方有五個政權遞 嬗的王朝，稱為「五代」。南方有十個並存的國家，稱為「十國」。以下短文是根 據這樣的時代背景論述，請閱讀並回答36 ～ 37題：","st":"關於文中新、舊《五代史》對南唐君主的記載，下列敘述何者最恰當？","op":{"A":"《舊五代史》記錄李昪，是因為認同他的正統地位","B":"新、舊《五代史》都不肯承認南唐君主的帝王身分","C":"南唐君主在《舊五代史》的定位比在《新五代史》高","D":"《新五代史》不承認北方政權，故未提及李後主入宋"},"an":"B","nt":[],"gn":[{"n":1,"term":"世家","text":"紀傳體史書體例之一，諸侯王傳記的體例為「世家」，帝王則為「本紀」"}]},{"id":"CAP-114-國文-37","y":"114","n":37,"ax":"G-classical","df":"進階","pr":0.58,"gc":"南唐 後主 李煜跪在明德樓前，白衣素袍，向宋太祖 趙匡胤歸降時，內心肯定百感交集。他想過以後的歷史，怎麼寫他嗎？《舊五代史》直接把十國裡凡稱帝的都貶為「僭偽列傳」，南唐當然也逃不了。《新五代史》稍稍客氣，但也僅以「世家1」定位。《舊五代史》南唐部分只寫到烈主 李昪、中主 李璟，並沒有後主 李煜。《新五代史》雖提及李後主，但入宋的部分不寫。\n為何新、舊《五代史》如此定位？這就必須了解中國史家重視傳統王朝興替的「正統情結」。趙匡胤是借「陳橋兵變」、「黃袍加身」而當上皇帝，其政權正當性，乃繼承北方中原的政權更替。以此史觀來看，唐朝滅亡後在中原相繼更迭的北方政權：後梁、後唐、後晉、後漢、後周，便被視為正統，其他政權則被視為僭越。\n然而紛亂的五代十國，主戰場就在北方中原。五代國祚最短的是後漢，三年多換了兩個君主。最長的是後梁，十七年四個皇帝。何況，五代王位之爭，經常是血腥暴力、骨肉相殘，朝廷難有建樹，更談不上人文建設、經濟民生。\n「君王唯兵強馬壯者得之」，五代帝王幾乎沒幾位是有高度文化修養的。反倒是十國裡的南唐前後維持近四十年，只經歷三個皇帝，沒有繼承權的紛亂，政權相對穩定。且南唐三位國君都重視文教，珍藏圖書，蒐羅書畫，建立教坊，網羅畫師，一時之間南唐成了文化重鎮。宋朝雖然滅了南唐，可是汴京皇城裡的文化資產，有多少是來自南唐啊！\n——改寫自蔡詩萍《李後主事件簿》","gi":"五代十國是指唐亡後至宋建國前，在各地分立興亡的諸國。當時北方有五個政權遞 嬗的王朝，稱為「五代」。南方有十個並存的國家，稱為「十國」。以下短文是根 據這樣的時代背景論述，請閱讀並回答36 ～ 37題：","st":"根據本文，下列何者最接近作者的觀點？","op":{"A":"應該重視王朝興替的「正統情結」","B":"北方政權相對穩定，有利於人文建設","C":"肯定李氏三代重視文教，對文化的貢獻","D":"趙匡胤借「陳橋兵變」稱帝，是為僭越"},"an":"C","nt":[],"gn":[{"n":1,"term":"世家","text":"紀傳體史書體例之一，諸侯王傳記的體例為「世家」，帝王則為「本紀」"}]},{"id":"CAP-114-國文-39","y":"114","n":39,"ax":"G-classical","df":"挑戰","pr":0.54,"gc":"公子光之父曰吳王 諸樊。諸樊弟三人：次曰餘祭，次曰夷眛，次曰季子札。諸樊知季子札賢而不立太子，以次傳三弟，欲卒致國於季子札。諸樊既死，傳餘祭。餘祭死，傳夷眛。夷眛死，當傳季子札。季子札逃不肯立，吳人乃立夷眛之子僚為王。公子光曰：「使以兄弟次邪，季子當立；必以子乎，則光真嫡嗣，當立。」\n——改寫自司馬遷《史記》","gi":"請閱讀以下短文，並回答38 ～ 39題：","st":"根據本文，公子光最無法接受誰擔任吳王？","op":{"A":"餘祭","B":"夷眛","C":"季子札","D":"僚"},"an":"D","nt":[],"gn":[]},{"id":"CAP-114-國文-40","y":"114","n":40,"ax":"G-classical","df":"進階","pr":0.58,"gc":"日前令郎訪逮，出手筆並石月屏為贈，捧玩不勝愧喜。比來，數於都下朋從處見此屏，觀其天質圓瑩，非刻非繪，如秋高氣清，迥然在望，信乎天地之異氣、山澤之殊寶也。素心悅之，無從可得，豈意一旦不煩懇請，坐致握中。性本疏野，雅叶1所欲，雖受文錦十純2，白璧百雙，在光之愚，未為重賜。俗故忽忽，久不遑修謝，尤增悚懼。令郎注官3甚便，想加慰喜，未期接侍，倍希珍厚。\n——改寫自司馬光〈答薛虢州謝石月屏書〉","gi":"請閱讀以下短文，並回答40 ～ 42題：","st":"根據文意脈絡，下列「」中的詞語，何者替換後意義仍相同？","op":{"A":"日前「令郎」訪逮：令尊","B":"「比來」，數於都下朋從處見此屏：近來","C":"豈意「一旦」不煩懇請：剎那","D":"「俗故」忽忽：老友"},"an":"B","nt":[],"gn":[{"n":1,"term":"叶","text":"音ㄒㄧㄝˊ，符合"},{"n":2,"term":"純","text":"計量單位，布帛一段為一純"},{"n":3,"term":"注官","text":"按照當時的官制授職"}]},{"id":"CAP-114-國文-41","y":"114","n":41,"ax":"G-classical","df":"挑戰","pr":0.5,"gc":"日前令郎訪逮，出手筆並石月屏為贈，捧玩不勝愧喜。比來，數於都下朋從處見此屏，觀其天質圓瑩，非刻非繪，如秋高氣清，迥然在望，信乎天地之異氣、山澤之殊寶也。素心悅之，無從可得，豈意一旦不煩懇請，坐致握中。性本疏野，雅叶1所欲，雖受文錦十純2，白璧百雙，在光之愚，未為重賜。俗故忽忽，久不遑修謝，尤增悚懼。令郎注官3甚便，想加慰喜，未期接侍，倍希珍厚。\n——改寫自司馬光〈答薛虢州謝石月屏書〉","gi":"請閱讀以下短文，並回答40 ～ 42題：","st":"關於文中的石月屏，下列敘述何者最恰當？","op":{"A":"若不是薛虢州贈送石月屏，司馬光無從見其真貌","B":"石月屏雖比文錦、白璧昂貴，但司馬光更重友情","C":"司馬光初獲石月屏時雖心喜，當下仍堅守節操婉拒","D":"石月屏自然生成，清氣可見，因此司馬光甚為喜愛"},"an":"D","nt":[],"gn":[{"n":1,"term":"叶","text":"音ㄒㄧㄝˊ，符合"},{"n":2,"term":"純","text":"計量單位，布帛一段為一純"},{"n":3,"term":"注官","text":"按照當時的官制授職"}]},{"id":"CAP-114-國文-42","y":"114","n":42,"ax":"G-classical","df":"挑戰","pr":0.41,"gc":"日前令郎訪逮，出手筆並石月屏為贈，捧玩不勝愧喜。比來，數於都下朋從處見此屏，觀其天質圓瑩，非刻非繪，如秋高氣清，迥然在望，信乎天地之異氣、山澤之殊寶也。素心悅之，無從可得，豈意一旦不煩懇請，坐致握中。性本疏野，雅叶1所欲，雖受文錦十純2，白璧百雙，在光之愚，未為重賜。俗故忽忽，久不遑修謝，尤增悚懼。令郎注官3甚便，想加慰喜，未期接侍，倍希珍厚。\n——改寫自司馬光〈答薛虢州謝石月屏書〉","gi":"請閱讀以下短文，並回答40 ～ 42題：","st":"根據本文，下列何者最可能是司馬光收下石月屏後的反應？","op":{"A":"欲登門回禮，惜薛公務繁忙，擬另擇日造訪","B":"獲贈禮物，喜出望外，故寫信向薛表達謝意","C":"受薛贈寶深感有愧，已經備好厚禮回贈致謝","D":"為辨優劣，邀請好友來家中共同鑑賞石月屏 14 試題結束"},"an":"B","nt":[],"gn":[{"n":1,"term":"叶","text":"音ㄒㄧㄝˊ，符合"},{"n":2,"term":"純","text":"計量單位，布帛一段為一純"},{"n":3,"term":"注官","text":"按照當時的官制授職"}]},{"id":"CAP-115-國文-9","y":"115","n":9,"ax":"S-classical","df":"進階","pr":0.61,"gc":"","gi":"","st":"「烘書之情何所似，有如老翁撫病子。心知元氣不可復，但求無死斯足矣。書燒之時又何其，有如慈父怒啼兒。恨死擲去不回顧，徐徐復自撫摩之。此情自痴還自笑，心血既乾轉煩惱。上壽八十能幾何，為爾多累何其多。」關於這首詩的說明，下列敘述何者最恰當？","op":{"A":"「心知元氣不可復」指作者時日無多而焚書","B":"「恨死擲去不回顧」代表愛書之情至死不渝","C":"「徐徐復自撫摩之」表達作者不忍書燒之情","D":"「上壽八十能幾何」意指書籍保存有其時限"},"an":"C","nt":[],"gn":[]},{"id":"CAP-115-國文-13","y":"115","n":13,"ax":"S-classical","df":"進階","pr":0.62,"gc":"","gi":"","st":"齊高帝善草書，篤好不已，祖述子敬，稍乏風骨。嘗與王僧虔賭書，書畢曰：「誰為第一？」對曰：「臣書臣中第一，陛下書帝中第一。」帝笑曰：「卿可謂善自謀矣。」然高帝與僧虔賭書，亦猶雞之搏狸，稍不自知量力也。關於文中人物書法的比較，下列敘述何者最恰當？","op":{"A":"作者認為高帝書法不如僧虔","B":"作者認為子敬書法天下第一","C":"子敬覺得高帝的草書缺乏風骨","D":"僧虔自認與高帝賭書猶雞之搏狸"},"an":"A","nt":[],"gn":[]},{"id":"CAP-115-國文-18","y":"115","n":18,"ax":"S-classical","df":"挑戰","pr":0.49,"gc":"","gi":"","st":"「子產相鄭，往見壺丘子林，與其弟子坐，必以年1。夫居相於萬乘之國，而能捨之，謀志論行，而以心與人相索，其唯子產乎？故相鄭十八年，唯刑三人、殺二人，桃李之垂於行者，莫之援2也。」關於文中子產的敘述，下列何者最恰當？","op":{"A":"求才若渴，四處招募各國的賢士","B":"認為教育乃治國根本，極力興學","C":"推行嚴刑峻法，令人民路不拾遺","D":"跳脫身分貴賤的框架，以誠待人"},"an":"D","nt":[{"n":1,"term":"以年","text":"依年齡就座"},{"n":2,"term":"援","text":"採摘"}],"gn":[]},{"id":"CAP-115-國文-20","y":"115","n":20,"ax":"S-classical","df":"挑戰","pr":0.42,"gc":"","gi":"","st":"蔣堂為淮南轉運使，屬縣依例致賀，皆投書即還。有一縣令使人，獨求回書，左右諭之皆不聽，呵逐亦不去，曰：「寧得罪，不得書不敢回邑。」時蘇子美在座頗駭怪，曰：「小吏如此野狠，其令可知。」蔣曰：「不然，令必能者，使人不敢慢其命令如此。」乃為簡答之，方去。子美歸吳中月餘，得蔣書曰：「縣令果能者。」遂為之延譽，後卒為名臣。關於文中人物的敘述，下列何者最恰當？","op":{"A":"小吏仗勢欺人，目無尊長","B":"縣令治事有方，管理嚴格","C":"蔣堂寫信推薦蘇子美為吳中令","D":"蘇子美有識人之明而成為名臣"},"an":"B","nt":[],"gn":[]},{"id":"CAP-115-國文-21","y":"115","n":21,"ax":"S-classical","df":"挑戰","pr":0.49,"gc":"","gi":"","st":"或問：「世間何物最硬？」曰：「石頭與鋼鐵。」其人曰：「石可碎，鐵可鏨1，安得為硬？以弟看來為兄面上髭鬚最硬，鐵石總不如也。」問其故，答曰：「兄面皮厚，竟被看出。」鬚者回嘲曰：「足下面皮更老，這等硬鬚還鑽不透。」根據這則笑話，以鬚者的立場來看，下列何者最硬？","op":{"A":"石頭與鋼鐵","B":"鬚者的面皮","C":"面皮上的髭鬚","D":"無鬚者的面皮"},"an":"D","nt":[{"n":1,"term":"鏨","text":"雕鑿"}],"gn":[]},{"id":"CAP-115-國文-22","y":"115","n":22,"ax":"S-classical","df":"挑戰","pr":0.54,"gc":"","gi":"","st":"「往年士大夫好講水利。有言欲涸梁山泊以為農田者，或詰之曰：『梁山泊涸之，不幸秋夏之交，行潦四集，諸水並入，何以受之？』貢父適在坐，徐曰：『卻於泊之傍鑿一池，大小正同，則可受其水矣。』坐中皆絕倒，言者大慚沮。」關於文中眾人對水利的想法，下列敘述何者最恰當？","op":{"A":"為解決梁山泊秋夏淹水的問題，士大夫提議涸梁山泊為田","B":"提出詰問的人擔憂梁山泊因泥沙淤積而難以吸納大量洪水","C":"貢父表面提出方法，實則藉此凸顯欲涸梁山泊為田的荒謬","D":"眾人對貢父的想法不以為然，仍堅持涸梁山泊為田的建議"},"an":"C","nt":[],"gn":[]},{"id":"CAP-115-國文-23","y":"115","n":23,"ax":"S-classical","df":"挑戰","pr":0.46,"gc":"","gi":"","st":"【甲】寒梅清秀誰知？霜禽翠羽同期。瀟灑寒塘月淡，暗香幽意，一枝雪裡偏宜。【乙】野橋當日誰栽？前村昨夜先開。雪散珍珠亂篩，多情嬌態，一枝風送香來。甲、乙兩曲皆詠梅，下列關於二者的比較，何者敘述最恰當？","op":{"A":"甲以雪喻梅，乙以珍珠喻梅","B":"二者皆有視覺與嗅覺的摹寫","C":"皆於首句提問，次句明確回答","D":"二者的視線推移皆是由近而遠"},"an":"B","nt":[],"gn":[]},{"id":"CAP-115-國文-39","y":"115","n":39,"ax":"G-classical","df":"挑戰","pr":0.52,"gc":"僮僕遂者，閩之海山人，至忠。吾妻劉孺人逝時，遂侵曉起，私市餺飥1，漬茗跪進於靈次，拜不止。他僮笑之，遂怒曰：「我孝主母，弗類若不孝也！」嘗從余客荔城，過綿亭山，輿翻，遂咎輿夫曰：「明日再跌，當擇其平坦者，勿令碎吾主人輿中物也。」其愚如此。余來杭城，遂哭，將從余，余止之。後得家書，遂乃以今年五月十八日被疫死矣。嗚呼！吾聞南方多疫，勞者先死，是必吾家役之無方耳，傳之亦所以志余過也。\n――改寫自林紓〈僮遂小傳〉","gi":"請閱讀以下短文，並回答39 ～ 40題：","st":"根據本文，下列「」中的字何者當動詞使用？","op":{"A":"「至」忠","B":"弗類「若」不孝也","C":"嘗從余「客」荔城","D":"傳之亦所以志余「過」也"},"an":"C","nt":[],"gn":[{"n":1,"term":"餺飥","text":"湯餅"}]},{"id":"CAP-115-國文-40","y":"115","n":40,"ax":"G-classical","df":"挑戰","pr":0.42,"gc":"僮僕遂者，閩之海山人，至忠。吾妻劉孺人逝時，遂侵曉起，私市餺飥1，漬茗跪進於靈次，拜不止。他僮笑之，遂怒曰：「我孝主母，弗類若不孝也！」嘗從余客荔城，過綿亭山，輿翻，遂咎輿夫曰：「明日再跌，當擇其平坦者，勿令碎吾主人輿中物也。」其愚如此。余來杭城，遂哭，將從余，余止之。後得家書，遂乃以今年五月十八日被疫死矣。嗚呼！吾聞南方多疫，勞者先死，是必吾家役之無方耳，傳之亦所以志余過也。\n――改寫自林紓〈僮遂小傳〉","gi":"請閱讀以下短文，並回答39 ～ 40題：","st":"關於文中僮僕遂的敘述，下列何者最恰當？","op":{"A":"生母過世後，託人購買湯餅祭拜表達孝心","B":"提醒轎夫選擇平坦的道路，以免自己受傷","C":"雖想跟從主人前去杭城，最終仍聽命留下","D":"流落南方不幸染疫，死後輾轉歸葬於海山"},"an":"C","nt":[],"gn":[{"n":1,"term":"餺飥","text":"湯餅"}]},{"id":"CAP-115-國文-41","y":"115","n":41,"ax":"G-classical","df":"進階","pr":0.68,"gc":"田饒事魯哀公，而不見察。謂哀公曰：「臣將去君，黃鵠舉矣。」哀公曰：「何謂也？」田饒曰：「君獨不見夫雞乎？頭戴冠者，文也；足傅距1者，武也；敵在前敢鬥者，勇也；見食相告者，仁也；守夜不失時者，信也。雞雖有此五德，君猶烹而食之者，何也？則以其所從來者近也。夫黃鵠一舉千里，止君園池，食君魚鱉，啄君黍粱，無此五德，君猶貴之者，何也？以其所從來者遠也。臣將去君，黃鵠舉矣。」遂去之燕，燕以為相，三年，燕政大平。\n――改寫自韓嬰《韓詩外傳》","gi":"請閱讀以下短文，並回答41 ～ 42題：","st":"下列文句「」中文字的解釋，何者最恰當？","op":{"A":"田饒事魯哀公，而「不見察」：不懂得自我反省","B":"「見食相告」者，仁也：看到食物就通知夥伴","C":"夫黃鵠「一舉千里」：高踞樹頂，眼界開闊","D":"「遂去之燕」，燕以為相：離開了燕國"},"an":"B","nt":[],"gn":[{"n":1,"term":"足傅距","text":"腳上長著爪子"}]},{"id":"CAP-115-國文-42","y":"115","n":42,"ax":"G-classical","df":"挑戰","pr":0.35,"gc":"田饒事魯哀公，而不見察。謂哀公曰：「臣將去君，黃鵠舉矣。」哀公曰：「何謂也？」田饒曰：「君獨不見夫雞乎？頭戴冠者，文也；足傅距1者，武也；敵在前敢鬥者，勇也；見食相告者，仁也；守夜不失時者，信也。雞雖有此五德，君猶烹而食之者，何也？則以其所從來者近也。夫黃鵠一舉千里，止君園池，食君魚鱉，啄君黍粱，無此五德，君猶貴之者，何也？以其所從來者遠也。臣將去君，黃鵠舉矣。」遂去之燕，燕以為相，三年，燕政大平。\n――改寫自韓嬰《韓詩外傳》","gi":"請閱讀以下短文，並回答41 ～ 42題：","st":"根據本文，田饒認為哀公晉用人才的態度，與下列何者最接近？","op":{"A":"肥水不落外人田","B":"遠來的和尚會念經","C":"不求有功，但求無過","D":"內舉不避親，外舉不避仇 14 試題結束"},"an":"B","nt":[],"gn":[{"n":1,"term":"足傅距","text":"腳上長著爪子"}]}];
